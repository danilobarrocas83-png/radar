
<title>Radar Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F4; --surface-3:#E2E8ED;
  --line:#D3DBE2; --line-soft:#E5EAEF;
  --text:#101820; --text-2:#48586A; --text-3:#77879A;
  --accent:#0E6F78; --accent-ink:#0A545B; --accent-soft:#DCEDEF;
  --quente:#C4342F; --quente-soft:#FBE4E2;
  --morno:#9A6608; --morno-soft:#FAEEDA;
  --frio:#5F7288; --frio-soft:#E8ECF1;
  --ok:#186B42; --ok-soft:#DCEFE4;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 14px rgba(16,24,32,.05);
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D141B; --surface:#141D26; --surface-2:#1B2732; --surface-3:#24323F;
    --line:#2D3D4C; --line-soft:#223040;
    --text:#E8EEF4; --text-2:#9DAEBF; --text-3:#728499;
    --accent:#3FB0BA; --accent-ink:#6FCBD3; --accent-soft:#173238;
    --quente:#F0716B; --quente-soft:#3A1E1D;
    --morno:#DFA83F; --morno-soft:#352A15;
    --frio:#93A6BA; --frio-soft:#212D3A;
    --ok:#4FBF87; --ok-soft:#14301F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D141B; --surface:#141D26; --surface-2:#1B2732; --surface-3:#24323F;
  --line:#2D3D4C; --line-soft:#223040;
  --text:#E8EEF4; --text-2:#9DAEBF; --text-3:#728499;
  --accent:#3FB0BA; --accent-ink:#6FCBD3; --accent-soft:#173238;
  --quente:#F0716B; --quente-soft:#3A1E1D;
  --morno:#DFA83F; --morno-soft:#352A15;
  --frio:#93A6BA; --frio-soft:#212D3A;
  --ok:#4FBF87; --ok-soft:#14301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Archivo,-apple-system,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:Archivo;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
@media(max-width:820px){#app{grid-template-columns:1fr}}

.rail{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:16px 10px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
@media(max-width:820px){
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;
    border-right:none;border-bottom:1px solid var(--line);padding:10px}
}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--quente);
  box-shadow:0 0 0 4px var(--quente-soft);flex:none}
.brand b{font-family:Archivo;font-size:14.5px;font-weight:700;letter-spacing:-.02em}
@media(max-width:820px){.brand{width:100%;padding-bottom:8px}}

.navbtn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);
  color:var(--text-2);font-size:13.5px;font-weight:500;text-align:left;width:100%;
  transition:background .12s,color .12s}
.navbtn:hover{background:var(--surface-2);color:var(--text)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navbtn .ic{width:16px;flex:none;opacity:.85;display:grid;place-items:center}
.navbtn .n{margin-left:auto;font-size:11px;font-family:"IBM Plex Mono",monospace;
  color:var(--text-3);font-variant-numeric:tabular-nums}
.navbtn[aria-current="true"] .n{color:var(--accent-ink)}
@media(max-width:820px){.navbtn{width:auto}.navbtn .n{margin-left:6px}}

.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft)}
@media(max-width:820px){.rail-foot{margin-top:0;width:100%;border-top:none;padding-top:6px}}
.whoami{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r);width:100%}
.whoami:hover{background:var(--surface-2)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:Archivo;font-weight:700;font-size:11px;color:#fff;letter-spacing:.01em}
.whoami .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoami .rl{font-size:10.5px;color:var(--text-3)}

main{padding:22px 26px 60px;min-width:0;max-width:1180px}
@media(max-width:600px){main{padding:16px 14px 50px}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:22px;font-weight:700}
.page-head p{margin:3px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}

/* ---------- Quota meter ---------- */
.quota{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:9px 14px;box-shadow:var(--shadow)}
.quota .big{font-family:Archivo;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.quota .big s{text-decoration:none;color:var(--text-3);font-size:13px;font-weight:500}
.bar{width:104px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar i.done{background:var(--ok)}

/* ---------- Filters ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;font-weight:500;color:var(--text-2);transition:.12s}
.chip:hover{border-color:var(--text-3)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--ground);font-weight:600}
.search{flex:1;min-width:150px;max-width:270px;padding:6px 11px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13px}
.search::placeholder{color:var(--text-3)}

/* ---------- Lead rows ---------- */
.rows{display:flex;flex-direction:column;gap:6px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  border-left-width:3px;box-shadow:var(--shadow);overflow:hidden}
.row.A{border-left-color:var(--quente)} .row.B{border-left-color:var(--morno)} .row.C{border-left-color:var(--frio)}
.row.feito{opacity:.62}
.rhead{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 14px;
  align-items:center;width:100%;text-align:left}
.rhead:hover{background:var(--surface-2)}
.rtitle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.rtitle b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.rtitle .meta{font-size:12px;color:var(--text-3)}
.gancho{font-size:12.5px;color:var(--text-2);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rside{display:flex;align-items:center;gap:8px;flex:none}

.tag{font-family:Archivo;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 7px;border-radius:4px}
.tag.A{background:var(--quente-soft);color:var(--quente)}
.tag.B{background:var(--morno-soft);color:var(--morno)}
.tag.C{background:var(--frio-soft);color:var(--frio)}

.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.pill.novo{background:var(--surface-3);color:var(--text-3)}
.pill.andamento{background:var(--accent-soft);color:var(--accent-ink)}
.pill.ganho{background:var(--ok-soft);color:var(--ok)}
.pill.perdido{background:var(--surface-2);color:var(--text-3);text-decoration:line-through}

/* ---------- Expanded panel ---------- */
.rbody{border-top:1px solid var(--line-soft);padding:15px 14px;background:var(--surface-2);
  display:grid;gap:15px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media(max-width:760px){.rbody{grid-template-columns:1fr}}
.block{display:flex;flex-direction:column;gap:7px;min-width:0}
.scriptbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;font-size:13px;white-space:pre-wrap;line-height:1.6;color:var(--text)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:7px 13px;border-radius:6px;font-size:12.5px;font-weight:600;border:1px solid var(--line);
  background:var(--surface);color:var(--text);transition:.12s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--text-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv a{color:var(--accent-ink);font-weight:500}
select,textarea,input[type=text]{font:inherit;font-size:13px;padding:6px 9px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);width:100%}
textarea{resize:vertical;min-height:56px}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;box-shadow:var(--shadow)}
.stat .v{font-family:Archivo;font-size:25px;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums;margin-top:5px;letter-spacing:-.02em}
.stat .sub{font-size:11.5px;color:var(--text-3);margin-top:2px}

/* ---------- Table ---------- */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th{text-align:left;padding:9px 13px;font-family:Archivo;font-size:10.5px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 13px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.trackbar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:64px}
.trackbar i{display:block;height:100%;background:var(--accent)}

/* ---------- Cards / sections ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h2{font-size:14.5px;font-weight:700;margin-bottom:3px}
.panel .hint{font-size:12.5px;color:var(--text-2);margin:0 0 13px;max-width:64ch}
.divide{border-top:1px solid var(--line-soft);margin:15px 0 0;padding-top:15px}

/* ---------- Script library ---------- */
.scriptcard{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:9px;background:var(--surface)}
.scriptcard>summary{padding:11px 14px;cursor:pointer;font-weight:600;font-size:13.5px;
  list-style:none;display:flex;align-items:center;gap:9px}
.scriptcard>summary::-webkit-details-marker{display:none}
.scriptcard>summary::before{content:"+";font-family:"IBM Plex Mono",monospace;color:var(--text-3);font-size:15px}
.scriptcard[open]>summary::before{content:"\2212"}
.scriptcard[open]>summary{border-bottom:1px solid var(--line-soft);background:var(--surface-2)}
.scriptcard .inner{padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.porque{background:var(--accent-soft);border-radius:var(--r);padding:11px 13px;font-size:12.5px;
  line-height:1.55;color:var(--accent-ink)}
.porque b{font-family:Archivo;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;display:block;margin-bottom:4px;opacity:.85}
.regra{background:var(--quente-soft);color:var(--quente);border:1px solid currentColor;
  border-radius:var(--r);padding:12px 14px;font-size:13px;margin-bottom:16px;line-height:1.55}
.regra b{font-family:Archivo;display:block;margin-bottom:3px;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase}

/* ---------- Classificacao do toque ---------- */
.motgrupo{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.motgrupo>span{font-family:Archivo;font-size:9.5px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--text-3)}
.motlinha{display:flex;flex-wrap:wrap;gap:5px}
.mot{padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);
  font-size:12px;font-weight:500;color:var(--text-2);transition:.12s;text-align:left}
.mot:hover{border-color:var(--text-3);background:var(--surface-3)}
.mot.on{background:var(--text);border-color:var(--text);color:var(--ground);font-weight:600}
.mot.ok{border-color:var(--ok);color:var(--ok)}
.mot.ok:hover{background:var(--ok-soft)}
.mot.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mot.al{border-color:var(--morno);color:var(--morno)}
.mot.al:hover{background:var(--morno-soft)}
.mot.al.on{background:var(--morno);border-color:var(--morno);color:#fff}
.mot.fr{color:var(--text-3)}
.mot.fr.on{background:var(--text-3);border-color:var(--text-3);color:var(--ground)}
/* A classificacao mora no alto do cartao (18/09): o vendedor abre o lead,
   manda a mensagem e marca ali mesmo, sem rolar ate o fim dos scripts. */
.classtopo{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:var(--r);padding:12px 13px 11px}
.classtopo .ct-head{display:flex;align-items:baseline;gap:4px 9px;flex-wrap:wrap;margin-bottom:10px}
.classtopo .ct-head b{font-size:13.5px}
.classtopo .ct-head span{font-size:12px;color:var(--text-2)}
.motgrupos{columns:260px auto;column-gap:18px}
.motgrupos .motgrupo{break-inside:avoid;page-break-inside:avoid}
.classtopo textarea{margin-top:2px;min-height:44px}
@media(max-width:760px){
  .classtopo{padding:10px 10px 9px}
  .classtopo .ct-head{margin-bottom:7px}
  .classtopo .ct-head span{display:none}
  .classtopo .motgrupo{margin-bottom:6px;gap:3px}
  .classtopo .motlinha{gap:4px}
  .classtopo .mot{padding:4px 8px;font-size:11.5px}
  .classtopo textarea{min-height:38px}
}
.tagmot{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;
  background:var(--surface-3);color:var(--text-2);white-space:nowrap}

/* ---------- Roteiro passo a passo ---------- */
.passo{display:grid;grid-template-columns:25px 1fr;gap:10px;margin-bottom:13px;align-items:start}
.passo>i{width:23px;height:23px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-family:Archivo;font-size:11.5px;font-weight:700;
  font-style:normal;margin-top:1px}
.passo .tit{font-size:13.5px;font-weight:600;margin-bottom:3px}
.passo .txt{font-size:12.5px;color:var(--text-2);line-height:1.5}
.se{border-left:3px solid var(--line-soft);padding-left:12px;margin-bottom:11px}
.se.venceu{border-left-color:var(--quente)}
.se.venceu>.q{color:var(--quente)}
.se>.q{font-family:Archivo;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-3);display:block;margin-bottom:5px}
.prazo{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);
  color:var(--accent-ink);border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:600}
.prazo.venceu{background:var(--quente-soft);color:var(--quente)}
.copiar{font-size:11.5px;font-weight:600;color:var(--accent-ink);background:none;
  padding:3px 0;text-decoration:underline;text-underline-offset:2px}
.copiar:hover{opacity:.7}
/* ---------- Cartao do lead (21/09): classificacao, contato, site e todas as
   mensagens logo abaixo, cada uma com o seu botao de copiar ---------- */
.rbody>.full{grid-column:1/-1;min-width:0}
.ct-sit{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ct-sit:empty{display:none}
.ct-ok{background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:700}
.cardbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.cardbox>.cb-head{display:flex;align-items:baseline;gap:4px 9px;flex-wrap:wrap;margin-bottom:10px}
.cardbox>.cb-head b{font-size:13.5px}
.cardbox>.cb-head span{font-size:12px;color:var(--text-2);line-height:1.5}
.siterow{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;
  border:1px dashed var(--line);border-radius:6px;background:var(--surface-2)}
.siterow a{font-weight:600;font-size:13px;color:var(--accent-ink);overflow-wrap:anywhere}
.siterow .copiar,details.msg>summary .copiar{flex:none;border:1px solid var(--line);border-radius:6px;
  padding:4px 10px;background:var(--surface);text-decoration:none}
.msgcols{columns:2 340px;column-gap:24px}
.msgcols .eyebrow{break-after:avoid;margin:13px 0 6px}
.msgcols>.eyebrow:first-child{margin-top:0}
details.msg{break-inside:avoid;page-break-inside:avoid;border-left:3px solid var(--line-soft);padding-left:10px;margin-bottom:5px}
details.msg.venceu{border-left-color:var(--quente)}
details.msg>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;padding:4px 0}
details.msg>summary::-webkit-details-marker{display:none}
details.msg>summary::before{content:"\25B8";color:var(--text-3);font-size:12px;flex:none;width:10px}
details.msg[open]>summary::before{content:"\25BE"}
details.msg .q{flex:1;min-width:0;font-family:Archivo;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-2);line-height:1.4}
details.msg.venceu .q{color:var(--quente)}
details.msg>.scriptbox{margin:4px 0 9px}
.row.feito .rtitle b::before{content:"\2713\00a0";color:var(--ok)}
/* no celular a coluna dos valores de "Dados da empresa" ficava com 11px de
   largura e o bloco passava de 2000px de altura: uma coluna so resolve */
@media(max-width:760px){
  .kv{grid-template-columns:1fr;gap:1px 0}
  .kv dt{margin-top:7px}
}
.barras{display:flex;flex-direction:column;gap:5px}
.barra{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center}
.barra>span:first-child{font-size:12.5px;color:var(--text-2)}
.barra>span:last-child{font-family:"IBM Plex Mono",monospace;font-size:12.5px;text-align:right;
  font-variant-numeric:tabular-nums}
@media(max-width:520px){.barra{grid-template-columns:110px 1fr 34px}}

/* ---------- Setup gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ground)}
.gatecard{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:28px;max-width:430px;width:100%;box-shadow:var(--shadow)}
.gatecard h1{font-size:19px;margin-bottom:5px}
.gatecard p{color:var(--text-2);font-size:13.5px;margin:0 0 18px}
.people{display:flex;flex-direction:column;gap:5px;max-height:330px;overflow-y:auto}
.person{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--text);color:var(--ground);padding:9px 17px;border-radius:99px;font-size:13px;
  font-weight:500;box-shadow:var(--shadow);opacity:0;transition:.24s;pointer-events:none;z-index:99}

/* --- nuvem: indicador de sincronizacao --- */

  color:#6b7280;letter-spacing:.01em}
.syncdot{width:7px;height:7px;border-radius:50%;background:#22a06b;flex:none}
#sync[data-s="enviando"]{color:#8a6d00}
#sync[data-s="pendente"]{color:#a4442c}
#sync[data-s="offline"]{color:#6b7280}
.syncbar:has(#sync[data-s="enviando"]) .syncdot{background:#d29a00}
.syncbar:has(#sync[data-s="pendente"]) .syncdot{background:#c4432a}
.syncbar:has(#sync[data-s="offline"]) .syncdot{background:#9aa3ad}

/* Data de HOJE no fuso de quem esta usando. Com toISOString() (UTC) tudo que
   o time marcava depois das 21h de Fortaleza ja entrava com a data do dia
   seguinte - e no dia seguinte contava de novo como "hoje". */
function dataLocal(dt){
  dt = dt || new Date();
  return dt.getFullYear() + "-" +
         ("0"+(dt.getMonth()+1)).slice(-2) + "-" +
         ("0"+dt.getDate()).slice(-2);
}

/* ---------- utils ---------- */
function el(t,a,c){var e=document.createElement(t);a=a||{};
  for(var k in a){ if(k==="class")e.className=a[k];
    else if(k==="html")e.innerHTML=a[k];
    else if(k==="text")e.textContent=a[k];
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),a[k]);
    else if(a[k]!==null&&a[k]!==undefined)e.setAttribute(k,a[k]); }
  (c||[]).forEach(function(x){ if(x) e.appendChild(typeof x==="string"?document.createTextNode(x):x); });
  return e;}
function esc(s){return String(s==null?"":s);}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");

function iniciais(n){return String(n||"?").trim().split(/\s+/).slice(0,2)

function corDe(id){var s=0,i;for(i=0;i<String(id).length;i++)s+=String(id).charCodeAt(i);
  return CORES[s%CORES.length];}
function diasDesde(d){ if(!d) return 999;
  var a=new Date(d+"T00:00:00"), b=new Date(HOJE+"T00:00:00");
  return Math.round((b-a)/86400000);}

function dataBR(iso){ if(!iso) return "—";

  var d=new Date((iso||HOJE)+"T12:00:00"); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
/* Quando vence o proximo toque, pela regra: 2 dias apos o 1o contato,
   3 dias apos o follow-up 1. */
function vencimento(reg){
  if(!reg||!reg.d) return null;
  if(reg.s==="reuniao"){ var dr=dataReuniao(reg); if(!dr) return null; return diasDesde(dr.iso)<-1?somaDias(dr.iso,-1):dr.iso; }
  if(reg.s==="contatado") return somaDias(reg.d,2);
  if(reg.s==="fup1") return somaDias(reg.d,3);
  if(reg.s==="conversa"||reg.s==="proposta") return somaDias(reg.d,4);
  return null;
}
function waLink(tel,txt){ if(!tel) return null;

function copiar(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast("Copiado")},function(){fallbackCopy(t)});
  } else fallbackCopy(t);
}
function fallbackCopy(t){var a=el("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";
  document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copiado")}catch(e){toast("Nao consegui copiar")}
  document.body.removeChild(a);}

   sabe se anunciam. Nada de "vi o anuncio de voces" — a abertura pergunta. */

/* 23/09 (pedido do Danilo): a pergunta vem primeiro, sem citar a empresa, e a
   apresentacao fica no fim - mais humano, menos vendedor. */
var PERGUNTA_ANUNCIA="Oi, tudo bem?\nHoje você ainda depende de indicação, ou já investe em anúncio mas chega só lead desqualificado?";

/* "Vendedor 03" e nome de fabrica, nao pode ir numa mensagem real. */
function nomeReal(n){
  var s=String(n||"").trim();
  if(!s||/^vendedor\s*\d*$/i.test(s)) return "[COLOQUE SEU NOME]";
  return primeiroNome(s);
}

/* A pergunta e uma conversa, nao um interrogatorio de metrica.
   Cada uma nomeia a dor real daquele negocio, do jeito que o dono sente. */
var PERGUNTAS=[
 [/implant|reabilit/i,"Deixa eu te perguntar uma coisa: hoje o anúncio traz paciente que fecha o tratamento mesmo, ou chega muita gente perguntando preço e depois some?"],

function perguntaChave(nicho){
  var n=nicho||"", i;
  for(i=0;i<PERGUNTAS.length;i++) if(PERGUNTAS[i][0].test(n)) return PERGUNTAS[i][1];

var FECHAMENTO="Se quiser, o Danilo te mostra o que dá pra ajustar aí. São uns 20 minutinhos, sem compromisso nenhum — é mais pra você entender o projeto e ver se faz sentido pra vocês. Fica melhor pra você amanhã de manhã ou de tarde?";

/* ---------- a OBSERVACAO: o gancho traduzido pra lingua do dono ----------
   Na v3 ela NAO vai na abertura (a abertura dos prints funciona sem ela).
   Entra como reforco opcional depois que o dono confirmou a dor, e como
   conteudo do follow-up 1. Devolve null quando nao ha erro pra apontar
   (setup profissional). */
function entreAspas(g){
  var m=String(g||"").match(/["“]([^"”]{1,60})["”]/);
  return m?m[1].trim():"";
}
function numeroDe(g){
  var m=String(g||"").match(/(\d+)\s*(anúncio|anuncio|criativo|campo)/i);
  return m?parseInt(m[1],10):0;
}
function observacaoDe(l){
  var g=String((l&&l.gancho)||""), q=entreAspas(g), n=numeroDe(g), emp=(l&&l.empresa)||"a página";
  if(!g) return null;
  if(/setup profissional|t[íi]tulo estruturado/i.test(g)) return null;
  if(/IMPULSIONAMENTO/i.test(g))
    return "o anúncio é um post impulsionado e manda a pessoa pro perfil, não pro WhatsApp — ela clica, cai no feed e não tem pra onde ir";
  if(/USD|moeda estrangeira/i.test(g))
    return "a conta de anúncios de vocês tá configurada em dólar — cada real que entra paga IOF e variação de câmbio antes de virar anúncio";
  if(/copy inteira colada/i.test(g))
    return "o texto inteiro do anúncio foi colado no campo do título, então no celular ele aparece cortado com “…” logo no começo";
  if(/URL crua|api\.whatsapp|wa\.me/i.test(g))
    return q ? "o título do anúncio tá aparecendo como “"+q+"” em vez de uma chamada"
             : "o título do anúncio tá aparecendo como um endereço de site em vez de uma chamada";
  if(/nome da p[áa]gina colado|igual ao nome da p[áa]gina/i.test(g)){
    var rep=g.match(/repetido\s+(\d+)x/i);
    return "o título do anúncio tá saindo só com o nome “"+emp+"”"+
           (rep?", repetido em "+rep[1]+" anúncios":"")+", sem chamada nenhuma";
  }
  if(/sem t[íi]tulo de link|t[íi]tulo vazio|campos? de t[íi]tulo vazio/i.test(g))
    return "o anúncio tá rodando sem o título embaixo da imagem — aquele texto em negrito que chama pro clique tá em branco";
  if(/mesma chamada|t[íi]tulo id[êe]ntico|criativos id[êe]nticos|mesmo t[íi]tulo|ao mesmo tempo/i.test(g))
    return "tem "+(n?n:"vários")+" anúncios rodando ao mesmo tempo com a mesma chamada — a verba tá dividida entre cópias iguais";
  if(/erro de escrita/i.test(g))
    return "o título do anúncio tá com um erro de digitação"+(q?" (“"+q+"”)":"")+" — e é a primeira coisa que a pessoa lê";
  if(/CAIXA ALTA/i.test(g))
    return "o título do anúncio tá inteiro em maiúsculas"+(q?" (“"+q+"”)":"")+" — no feed isso costuma ser lido como spam e a pessoa passa reto";
  if(/espa[çc]o duplo/i.test(g))
    return "o título do anúncio tá saindo com espaços e barras sobrando"+(q?" (“"+q+"”)":"")+" — dá pra ver que foi montado na pressa";
  if(/CTA gen[ée]rico/i.test(g))
    return "todos os anúncios estão com a mesma chamada genérica"+(q?", “"+q+"”,":"")+" sem dizer pra pessoa o que ela ganha clicando";
  return null;
}
/* Quem cuida: "o Dr. Walter" / "a Dra. Ariane" quando o nome da empresa traz o profissional. */
function quemCuida(l){
  var e=String((l&&l.empresa)||"");
  var m=e.match(/\b(dra|dr)\.?\s+([A-Za-zÀ-ÿ][\wÀ-ÿ'.-]*)/i);
  if(!m) return "";
  var t=m[1].toLowerCase()==="dra"?"a Dra.":"o Dr.";
  return t+" "+m[2].replace(/[.,-]+$/,"");
}
/* O verbo que o nicho usa quando o cliente "vem": visitar, agendar ou fechar. */
function verboDoNicho(nicho){

/* ---------- reuniao marcada: dia e hora saem da anotacao ----------
   A tabela atividade nao tem coluna pra isso; o vendedor escreve
   "15/09 14h" na anotacao e o Radar le dali. */
function dataReuniao(reg){
  if(!reg||reg.s!=="reuniao") return null;
  var o=String(reg.o||""), m=o.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(!m) return null;
  var dia=parseInt(m[1],10), mes=parseInt(m[2],10);
  if(!dia||!mes||dia>31||mes>12) return null;
  var ano=m[3]?parseInt(m[3].length===2?"20"+m[3]:m[3],10):parseInt(HOJE.slice(0,4),10);
  var iso=ano+"-"+("0"+mes).slice(-2)+"-"+("0"+dia).slice(-2);
  /* sem ano: se ficou mais de 60 dias no passado, e do ano que vem */
  if(!m[3]&&diasDesde(iso)>60) iso=(ano+1)+iso.slice(4);
  var h=o.slice(m.index+m[0].length).match(/(\d{1,2})\s*(?:h|:)\s*(\d{2})?/);
  var hora=h?(h[1]+"h"+(h[2]&&h[2]!=="00"?h[2]:"")):"";
  return {iso:iso,hora:hora};
}

/* ---------- dados ---------- */
function todosLeads(){
  var out=[];
  STATE.lotes.forEach(function(lote){
    (lote.itens||[]).forEach(function(it){
      out.push(Object.assign({},it,{lote:lote._id,loteData:lote.data}));
    });
  });
  return out;
}
function regDe(vid,leadId){
  var m=STATE.atividade[vid]||{};
  return m[leadId]||null;
}
function statusDe(vid,leadId){var r=regDe(vid,leadId);return r&&r.s?r.s:"novo";}

/* Quem "dona" o registro de um lead: o vendedor dele. O gestor ve tudo,
   e le o registro do vendedor a quem o lead foi distribuido. */
function donoDoLead(l){
  var v=STATE.vend; if(!v) return null;
  return v.gestor ? (l.vend||v.id) : v.id;
}
function meusLeads(){
  var v=STATE.vend; if(!v) return [];
  if(v.gestor) return todosLeads();
  return todosLeads().filter(function(l){return l.vend===v.id;});
}
/* A fila pessoal de quem esta logado. Para o vendedor e a mesma coisa que
   meusLeads(); para o gestor e so o que foi distribuido para ele (a aba
   "Meus leads" dele, desde 17/09). */
function filaPropria(){
  var v=STATE.vend; if(!v) return [];
  return todosLeads().filter(function(l){return l.vend===v.id;});
}
function ultimaData(){
  var d="";
  STATE.lotes.forEach(function(x){ if(String(x.data||"")>d) d=String(x.data||""); });
  return d;
}
/* Vendedor que saiu continua no cadastro: o historico dele (contatos,
   reunioes, classificacoes) e do time e nao pode sumir do painel. O que
   ele perde e a fila e a entrada. */
/* O gestor tambem prospecta (desde 17/09): com "prospecta" ele entra na
   cota, no ranking, no funil, no historico e na divisao da remessa como
   qualquer vendedor - e continua sendo o gestor (PIN, Gerencial, Historico). */
function prospecta(p){ return !!p && (!p.gestor || !!p.prospecta); }
function ativos(){
  return STATE.equipe.filter(function(p){return prospecta(p) && !p.inativo;});
}
function todosVend(){
  return STATE.equipe.filter(function(p){return prospecta(p);});
}
function exVend(){
  return STATE.equipe.filter(function(p){return !p.gestor && p.inativo;});
}
/* Um lead que trocou de dono pode ja ter sido trabalhado pelo dono antigo.
   Sem este aviso o novo dono abre como primeiro contato e a empresa recebe
   a mesma abordagem duas vezes. */
function historicoOutro(l,dono){
  var achado=null, ids=Object.keys(STATE.atividade||{});
  ids.forEach(function(vid){
    if(achado||vid===dono) return;
    var r=(STATE.atividade[vid]||{})[l.id];
    if(r&&r.s&&r.s!=="novo") achado={vend:vid,reg:r};
  });
  return achado;

  return a?a.nome:id;
}
function ehGestor(id){

/* O lead aberto nao muda de lugar na lista quando e classificado. Antes ele
   pulava pro fim, a tela ficava mostrando outros leads "Nao contatado" no
   lugar dele e o vendedor achava que a marcacao nao tinha pegado (21/09). */
function pesoNovo(l){
  if(l.id===STATE.aberto && (STATE.abertoEraNovo===true||STATE.abertoEraNovo===false)) return STATE.abertoEraNovo?0:1;
  return statusDe(donoDoLead(l),l.id)==="novo"?0:1;
}
function ordenar(arr){
  var peso={A:0,B:1,C:2};
  return arr.slice().sort(function(a,b){
    var sa=pesoNovo(a), sb=pesoNovo(b);
    if(sa!==sb) return sa-sb;
    var pa=peso[a.prio]!==undefined?peso[a.prio]:3, pb=peso[b.prio]!==undefined?peso[b.prio]:3;
    if(pa!==pb) return pa-pb;
    var wa=a.wa?0:1, wb=b.wa?0:1;
    if(wa!==wb) return wa-wb;
    return String(a.empresa).localeCompare(String(b.empresa),"pt");
  });
}
function precisaFollowup(vid,leadId){
  var r=regDe(vid,leadId); if(!r||!r.d) return false;
  var d=diasDesde(r.d);
  if(r.s==="reuniao"){ var dr=dataReuniao(r); if(!dr) return false; var k=diasDesde(dr.iso); return k===-1||k===0; }
  if(r.s==="contatado") return d>=2;
  if(r.s==="fup1") return d>=3;
  if(r.s==="conversa"||r.s==="proposta") return d>=4;
  if(r.s==="fup2") return false;
  return false;
}
function contatadosHoje(vid){
  var m=STATE.atividade[vid]||{},n=0,k;
  for(k in m) if(m[k]&&m[k].d===HOJE) n++;

}

/* NUNCA redesenhe a tela enquanto alguem esta digitando: o campo seria
   destruido e recriado com o valor antigo, e o texto se perderia antes
   do salvamento (que so dispara ao sair do campo). Guardamos o pedido e
   redesenhamos quando o foco sair. */
var RENDER_PEND=false, _rq=null;
/* No iPhone tocar num botao nao tira o foco do campo de texto: sem isto a
   tela nao redesenhava depois da classificacao e o "check" so aparecia mais tarde. */
function soltarFoco(){
  try{ var a=document.activeElement; if(a&&a!==document.body&&a.blur&&digitando()) a.blur(); }catch(e){}
}
function digitando(){
  var a=document.activeElement;
  if(!a) return false;
  var t=(a.tagName||"").toLowerCase();
  return t==="input"||t==="textarea"||t==="select";
}
function render(){
  if(digitando()){ RENDER_PEND=true; return; }
  RENDER_PEND=false;
  var root=document.getElementById("root");
  root.innerHTML="";
  if(!STATE.vend){ root.appendChild(gate()); return; }
  root.appendChild(shell());
}
/* Junta varias atualizacoes do banco num redesenho so. */
function pedirRender(){
  if(_rq) return;
  _rq=setTimeout(function(){ _rq=null; render(); },120);
}
document.addEventListener("focusout",function(){
  setTimeout(function(){ if(RENDER_PEND&&!digitando()) render(); },60);
});

/* ---------- transferencia para o Radar novo ----------
   Quando a pagina roda no visualizador do claude.ai ela nao alcanca o banco
   (CSP connect-src 'self'): tudo que o vendedor marca fica preso no
   localStorage desta origem. Antes ele copiava um JSON e mandava por
   WhatsApp para o Danilo colar no sistema. Agora e um clique: o pacote vai
   no #hash da URL para importar.html, no mesmo endereco do radar.html
   (danilobarrocas83-png.github.io), que grava no Supabase, deixa a copia no
   localStorage de la e responde por postMessage para esta aba limpar a fila.
   O hash nunca sai do navegador (nao vai para servidor nenhum). */
var RADAR_NOVO_ORIGEM="https://danilobarrocas83-png.github.io";

var RADAR_IMPORTAR=RADAR_NOVO_ORIGEM+"/radar/importar.html";
var RADAR_NOVO_CURTO="danilobarrocas83-png.github.io/radar/radar.html";

function b64url(s){
  var bin="";
  if(typeof TextEncoder!=="undefined"){
    var bytes=new TextEncoder().encode(s);
    for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  } else bin=unescape(encodeURIComponent(s));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
/* Tudo que este vendedor tem nesta maquina: a fila (o que nunca subiu) e o
   espelho local. Se um lead aparece nos dois, vale a fila, que e mais nova. */
function leadsJaTransferidos(){
  var t=lerTransferencia(), m={};
  ((t&&t.leads)||[]).forEach(function(id){ m[String(id)]=1; });
  return m;
}
function itensParaTransferir(){
  var v=STATE.vend; if(!v||v.gestor) return [];
  var m=STATE.atividade[v.id]||{}, porLead={}, feitos=leadsJaTransferidos();
  Object.keys(m).forEach(function(leadId){
    var r=m[leadId]; if(!r||!r.s||feitos[leadId]) return;
    porLead[leadId]={lead:leadId,s:r.s||null,m:r.m||null,d:r.d||null,o:r.o||null};
  });
  FILA.forEach(function(x){ if(x.vend===v.id && x.s) porLead[x.lead]={lead:x.lead,s:x.s||null,m:x.m||null,d:x.d||null,o:x.o||null}; });
  return Object.keys(porLead).map(function(k){ return porLead[k]; });
}
function payloadFila(){
  var v=STATE.vend||{};
  return JSON.stringify({ r:"radar-fila", v:2, vend:v.id||null, nome:v.nome||"", n:FILA.length, itens:itensParaTransferir() });
}
function urlTransferencia(){
  var v=STATE.vend||{}, itens=itensParaTransferir();
  var pacote={ r:"radar-fila", v:2, vend:v.id, nome:v.nome||"", n:itens.length, itens:itens, de:location.hostname, em:new Date().toISOString() };
  return RADAR_IMPORTAR+"#"+b64url(JSON.stringify(pacote));
}
function lerTransferencia(){
  var v=STATE.vend; if(!v) return null;
  try{ return JSON.parse(localStorage.getItem("radar_transf_"+v.id)||"null"); }catch(e){ return null; }
}
function transferirParaRadarNovo(){
  var v=STATE.vend; if(!v) return;
  if(v.gestor){ window.open(RADAR_NOVO,"_blank"); return; }
  var url=urlTransferencia(), n=itensParaTransferir().length;
  STATE.transfAbrindo={n:n,em:Date.now()};
  var w=null;
  try{ w=window.open(url,"_blank"); }catch(e){ w=null; }
  if(!w){ STATE.popupBloqueado=true; STATE.transfAbrindo=null; toast("O navegador bloqueou a nova aba"); render(); return; }
  render();
  /* se a aba nova nao responder (fechada antes da hora, sem opener...), o
     botao volta para o vendedor poder tentar de novo */
  setTimeout(function(){
    if(STATE.transfAbrindo && Date.now()-STATE.transfAbrindo.em>24000){ STATE.transfAbrindo=null; pedirRender(); }
  },25000);
}
/* importar.html responde quando terminou: ai a fila daqui pode ser limpa. */
window.addEventListener("message",function(ev){
  var d=ev.data; if(!d||d.r!=="radar-importado") return;
  if(ev.origin!==RADAR_NOVO_ORIGEM) return;
  var v=STATE.vend; if(!v||v.gestor||d.vend!==v.id) return;
  var leads={}; (d.leads||[]).forEach(function(id){ leads[String(id)]=1; });
  FILA=FILA.filter(function(x){ return !(x.vend===v.id && leads[x.lead]); });
  gravarFila();
  var antes=leadsJaTransferidos(); Object.keys(leads).forEach(function(id){ antes[id]=1; });
  var reg={n:d.n||0,em:new Date().toISOString(),pendente:!!d.pendente,hora:horaAgora(),leads:Object.keys(antes)};
  try{ localStorage.setItem("radar_transf_"+v.id,JSON.stringify(reg)); }catch(e){}
  STATE.transfAbrindo=null; STATE.transfOk=reg;
  toast(d.n? (d.n+" marcacao(oes) salva(s) no sistema") : "Tudo ja estava salvo no sistema");
  pedirRender();
});

/* ---------- painel de diagnostico (so o gestor ve) ---------- */
function painelDiagnostico(main){

function filtrar(arr){
  var f=STATE.filtro,b=STATE.busca.trim().toLowerCase(),hoje=ultimaData();
  return arr.filter(function(l){
    /* o lead aberto continua visivel mesmo depois de classificado,
       para o vendedor ver a confirmacao antes de fechar */
    if(l.id===STATE.aberto) return true;
    var s=statusDe(donoDoLead(l),l.id);
    /* a remessa de hoje mostra tambem o que ja foi trabalhado (vai pro fim,
       com o check): antes o lead sumia da lista e parecia nao ter sido marcado */
    if(f==="hoje"&&String(l.loteData||"")!==hoje) return false;
    if(f==="novo"&&s!=="novo") return false;
    if(f==="A"&&l.prio!=="A") return false;
    if(f==="andamento"&&ABERTOS.indexOf(s)<0) return false;
    if(f==="reuniao"&&s!=="reuniao"&&s!=="fechado") return false;
    if(b){
      var hay=(l.empresa+" "+(l.nicho||"")+" "+(l.cidade||"")).toLowerCase();
      if(hay.indexOf(b)<0) return false;
    }
    return true;
  });
}
function desenharLista(cont,v,proprio){
  cont.innerHTML="";
  var arr=ordenar(filtrar(proprio?filaPropria():meusLeads()));
  if(!arr.length){
    var msg="Nenhum lead com esse filtro. Troque o filtro acima.";
    if(STATE.filtro==="hoje") msg="Você já trabalhou toda a remessa de hoje. Vá para Follow-ups, ou mude o filtro para “Não contatados” e pegue leads dos dias anteriores.";
    cont.appendChild(el("div",{class:"empty",text:msg}));
    return;
  }
  if(STATE.filtro==="hoje" && !arr.some(function(l){return statusDe(donoDoLead(l),l.id)==="novo";}))
    cont.appendChild(el("div",{class:"empty",text:"Você já trabalhou toda a remessa de hoje — os leads abaixo estão marcados com ✓. Vá para Follow-ups, ou mude o filtro para “Não contatados” e pegue leads dos dias anteriores."}));
  arr.slice(0,200).forEach(function(l){cont.appendChild(linha(l,v));});
  if(arr.length>200) cont.appendChild(el("div",{class:"empty",
    text:"Mostrando 200 de "+arr.length+". Use a busca ou os filtros para achar o resto."}));
}

/* ---------- VIEW: ranking ---------- */
function estatVend(p){
  var m=STATE.atividade[p.id]||{}, k, r;
  var s={contatados:0,hoje:0,respostas:0,reunioes:0,fechados:0,abertos:0};
  for(k in m){ r=m[k]; if(!r||!r.s||r.s==="novo") continue;
    s.contatados++;
    if(r.d===HOJE) s.hoje++;
    if(["conversa","reuniao","proposta","fechado"].indexOf(r.s)>=0) s.respostas++;
    if(r.s==="reuniao") s.reunioes++;
    if(r.s==="fechado") s.fechados++;
    if(ABERTOS.indexOf(r.s)>=0) s.abertos++;
  }
  s.taxa=s.contatados?s.respostas/s.contatados:0;
  s.conv=s.contatados?s.fechados/s.contatados:0;
  return s;
}

function redistribuir(){
  var reps=ativos();
  if(!reps.length){toast("Cadastre vendedores primeiro");return;}
  if(!DB){toast("Sem banco: nao da pra redistribuir");return;}
  var i=0, mudou=0;
  var novos=STATE.lotes.map(function(lote){
    var itens=(lote.itens||[]).map(function(it){
      var trabalhado=reps.some(function(p){var r=regDe(p.id,it.id);return r&&r.s&&r.s!=="novo"});
      if(trabalhado) return it;
      mudou++;
      var novo=Object.assign({},it,{vend:reps[i%reps.length].id}); i++;

function sbCab(extra){

            "Content-Type": "application/json" };
  if(extra) for(var k in extra) h[k] = extra[k];

/* Uma chave recusada nao pode derrubar o time: tenta a outra uma vez. */
function sbPedir(caminho, opts){
  opts = opts || {};
  function tentativa(){
    var o = { method: opts.method || "GET", headers: sbCab(opts.headers) };
    if(opts.body) o.body = opts.body;
    return fetch(sbUrl(caminho), o);
  }
  return tentativa().then(function(r){
    if((r.status === 401 || r.status === 403) && sbTrocarChave()) return tentativa();
    return r;
  });
}

function enfileirar(vid, leadId, reg){
  if(!FILA.length) FILA_DESDE = Date.now();
  FILA = FILA.filter(function(x){ return !(x.vend===vid && x.lead===leadId); });
  FILA.push({
    vend: vid, lead: leadId,
    s: reg.s || null, m: reg.m || null,
    d: reg.d || null, o: reg.o || null
  });
  gravarFila();
  escoar();

/* Reempurra para o banco tudo que existe na maquina. Serve quando as
   marcacoes ficaram presas aqui e nunca chegaram no painel do gestor. */
function reenviarTudo(){
  var v = STATE.vend; if(!v) return 0;
  var alvos = v.gestor ? Object.keys(STATE.atividade||{}) : [v.id];
  var n = 0;
  alvos.forEach(function(vid){
    var m = STATE.atividade[vid] || {};
    Object.keys(m).forEach(function(leadId){
      var r = m[leadId]; if(!r || !r.s) return;
      FILA = FILA.filter(function(x){ return !(x.vend===vid && x.lead===leadId); });
      FILA.push({ vend:vid, lead:leadId, s:r.s||null, m:r.m||null, d:r.d||null, o:r.o||null });
      n++;
    });
  });
  gravarFila();
  escoar();
  pedirRender();
  return n;
}

var ESCOANDO = false;
function escoar(){
  if(ESCOANDO || !FILA.length) return;
  if(!sbConfigurado()){ STATE.sync = "offline"; pintarSync(); return; }
  if(typeof navigator !== "undefined" && navigator.onLine === false){
    STATE.sync = "pendente"; pintarSync(); return;
  }
  ESCOANDO = true;
  var lote = FILA.slice(0, 50);
  STATE.sync = "enviando"; pintarSync();
  sbPedir("atividade", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(lote)
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + " " + t); });
    var chaves = {};
    lote.forEach(function(x){ chaves[x.vend+" "+x.lead] = 1; });
    FILA = FILA.filter(function(x){ return !chaves[x.vend+" "+x.lead]; });
    gravarFila();
    ESCOANDO = false;
    DIAG.escritaOk = true; DIAG.escritaErro = ""; DIAG.enviadoAs = horaAgora();
    STATE.sync = FILA.length ? "pendente" : "ok";
    if(!FILA.length) FILA_DESDE = 0;
    pintarSync();
    /* se o aviso vermelho estava na tela, sai assim que a fila esvazia */
    if(!FILA.length && document.querySelector("main > .alerta")) pedirRender();
    if(FILA.length) escoar();
  }).catch(function(e){
    ESCOANDO = false;
    DIAG.escritaOk = false; DIAG.escritaErro = e.message;
    STATE.sync = "pendente"; pintarSync(); pedirRender();
    if(window.console && console.warn) console.warn("[radar] nao consegui enviar agora: " + e.message);
  });
}

/* pinta o indicador sem redesenhar a tela inteira */

}

function linhaParaReg(x){
  var reg = {};
  if(x.s) reg.s = x.s;
  if(x.m) reg.m = x.m;
  if(x.d) reg.d = String(x.d).slice(0,10);

}
function carregarNuvem(){
  if(!sbConfigurado()) return Promise.resolve(false);
  /* paginado: o Supabase corta em 1000 linhas por pedido */
  return sbTudo("atividade?select=vend,lead,s,m,d,o&order=vend.asc,lead.asc")
    .then(function(linhas){
      var mapa = {};
      /* comeca do que ja existe na maquina: o banco COMPLETA, nunca apaga.
         Sem isto, um registro que nunca subiu some da tela na primeira
         leitura da nuvem e o vendedor perde o trabalho do dia. */
      Object.keys(STATE.atividade||{}).forEach(function(vid){
        mapa[vid] = Object.assign({}, STATE.atividade[vid]);
      });
      (linhas||[]).forEach(function(x){
        var m = mapa[x.vend] || (mapa[x.vend] = {});
        m[x.lead] = linhaParaReg(x);
      });
      /* o que ainda esta na fila e mais novo que o banco: preserva */
      FILA.forEach(function(x){
        var m = mapa[x.vend] || (mapa[x.vend] = {});
        m[x.lead] = linhaParaReg(x);
      });
      STATE.atividade = mapa;
      Object.keys(mapa).forEach(function(vid){ espelhoLocal(vid); });
      DIAG.leituraOk = true; DIAG.leituraErro = "";
      DIAG.linhas = (linhas||[]).length; DIAG.lidoAs = horaAgora();
      STATE.sync = FILA.length ? "pendente" : "ok";
      return true;
    })
    .catch(function(e){
      STATE.sync = "pendente";
      DIAG.leituraOk = false; DIAG.leituraErro = e.message; DIAG.lidoAs = horaAgora();
      if(window.console && console.warn) console.warn("[radar] leitura falhou, usando copia local: " + e.message);
      return false;
    });
}

function carregarLeadsNuvem(){
  if(!sbConfigurado()) return Promise.resolve(false);
  return sbPedir("leads?select=*&order=remessa.desc")
    .then(function(r){ if(!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(function(linhas){
      DIAG.leadsNuvemLinhas = (linhas||[]).length;
      if(!linhas || !linhas.length){ DIAG.leadsFonte="embutida"; return false; }
      var daNuvem = linhas.map(function(x){
        return { id:x.id, empresa:x.empresa, nicho:x.nicho, cidade:x.cidade,
                 ig:x.ig, wa:x.wa, pageId:x.page_id, gancho:x.gancho,
                 prio:x.prio, oferta:x.oferta, vend:x.vend,
                 loteData: String(x.remessa||"").slice(0,10) };
      });
      function maiorData(arr){
        var d=""; (arr||[]).forEach(function(l){
          var v=String((l&&l.loteData)||""); if(v>d) d=v; }); return d;
      }
      DIAG.leadsNuvemData    = maiorData(daNuvem);
      DIAG.leadsEmbutidaData = maiorData(LEADS_EMBUTIDOS);
      /* O banco COMPLETA a lista embutida, nunca a substitui - a mesma regra
         que ja vale para a atividade. Antes ele substituia: uma tabela "leads"
         atrasada apagava a remessa recem-publicada e o time abria o dia com
         zero lead novo, sem nenhum aviso na tela. */
      var idsEmb={}; LEADS_EMBUTIDOS.forEach(function(l){ if(l&&l.id) idsEmb[l.id]=1; });
      var so=0; daNuvem.forEach(function(l){ if(l&&l.id&&!idsEmb[l.id]) so++; });
      DIAG.leadsSoDaNuvem = so;
      var porId={}, ordem=[];
      function juntar(l){
        if(!l || !l.id) return;
        if(!(l.id in porId)) ordem.push(l.id);
        porId[l.id]=l;
      }
      daNuvem.forEach(juntar);          /* primeiro o que veio da nuvem */
      LEADS_EMBUTIDOS.forEach(juntar);  /* o embutido vence quando o id se repete */
      DIAG.leadsFonte = "nuvem+embutida";
      montarLotes(aplicarRemanejo(ordem.map(function(id){ return porId[id]; })));
      return true;
    })
    .catch(function(e){
      DIAG.leadsFonte="erro"; DIAG.leadsErro=e.message;
      if(window.console && console.warn) console.warn("[radar] tabela leads: "+e.message);
      return false;
    });
}

/* ============================================================
   HISTORICO DE TOQUES (aba do gestor)
   ------------------------------------------------------------
   A tabela "atividade" guarda so o ESTADO ATUAL de cada lead: quando o
   vendedor remarca, a data anterior some. Para saber quanto cada um
   trabalhou por dia, cada clique tambem vai para a tabela "historico"
   (append-only: nunca sobrescreve). O que existia antes da tabela entrou
   como semente pela data da ultima marcacao (11/09/2026), e o que chega
   por outro caminho (importar.html) e completado pela mesma regra.
   ============================================================ */
var FILA_H = [];
var FILA_H_MAX = 5000;
function lerFilaH(){
  try{ FILA_H = JSON.parse(localStorage.getItem("radar_fila_h")||"[]") || []; }catch(e){ FILA_H = []; }
}
function gravarFilaH(){
  if(FILA_H.length > FILA_H_MAX) FILA_H = FILA_H.slice(FILA_H.length - FILA_H_MAX);
  try{ localStorage.setItem("radar_fila_h", JSON.stringify(FILA_H)); }catch(e){}
}
function idEvento(vid, leadId){
  return vid + ":" + leadId + ":" + Date.now().toString(36) + ":" + Math.random().toString(36).slice(2,8);
}
/* Chamado a cada classificacao (salvarReg com status). Um clique = um toque. */
function registrarToque(vid, leadId, reg){
  if(presoNoClaude()) return;          /* nesse endereco nada chega ao banco */
  if(!reg || !reg.s) return;
  FILA_H.push({ ev:idEvento(vid,leadId), vend:vid, lead:leadId,
                s:reg.s||null, m:reg.m||null, d:reg.d||HOJE,
                ts:new Date().toISOString() });
  gravarFilaH();
  escoarH();
}
var ESCOANDO_H = false;
function escoarH(){
  if(ESCOANDO_H || !FILA_H.length) return;
  if(!sbConfigurado()) return;
  if(typeof navigator !== "undefined" && navigator.onLine === false) return;
  ESCOANDO_H = true;
  var lote = FILA_H.slice(0, 50);
  sbPedir("historico?on_conflict=ev", {
    method: "POST",
    headers: { "Prefer": "resolution=ignore-duplicates,return=minimal" },
    body: JSON.stringify(lote)
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + " " + t); });
    var ids = {}; lote.forEach(function(x){ ids[x.ev] = 1; });
    FILA_H = FILA_H.filter(function(x){ return !ids[x.ev]; });
    gravarFilaH();
    ESCOANDO_H = false;
    DIAG.histEscritaOk = true; DIAG.histEscritaErro = ""; DIAG.histEnviadoAs = horaAgora();
    if(FILA_H.length) escoarH();
  }).catch(function(e){
    ESCOANDO_H = false;
    DIAG.histEscritaOk = false; DIAG.histEscritaErro = e.message;
    if(window.console && console.warn) console.warn("[radar] historico: nao consegui registrar agora: " + e.message);
  });
}

/* O Supabase devolve no maximo 1000 linhas por pedido. Sem paginar, a
   partir da milesima marcacao o painel passaria a mostrar menos do que
   existe, sem nenhum aviso. */
function sbTudo(caminho, passo){
  passo = passo || 1000;
  var tudo = [];
  function pagina(ini){
    var fim = ini + passo - 1;
    return sbPedir(caminho, { headers: { "Range-Unit":"items", "Range": ini+"-"+fim } })
      .then(function(r){
        if(r.status === 416) return tudo;
        if(!r.ok) throw new Error(String(r.status));
        return r.json().then(function(linhas){
          linhas = linhas || [];
          tudo = tudo.concat(linhas);
          if(linhas.length < passo) return tudo;
          return pagina(ini + passo);
        });
      });
  }
  return pagina(0);
}

/* ---------- leitura do historico (so o gestor precisa) ---------- */
var HIST = { linhas:null, ok:null, erro:"", lidoAs:"", carregando:false };
function carregarHistorico(){
  if(!sbConfigurado()){ HIST.ok=false; HIST.erro="sem banco configurado"; if(HIST.linhas===null) HIST.linhas=[]; return Promise.resolve(false); }
  if(HIST.carregando) return Promise.resolve(false);
  HIST.carregando = true;
  return sbTudo("historico?select=vend,lead,s,m,d,ts&order=id.asc")
    .then(function(linhas){
      HIST.linhas = linhas || []; HIST.ok = true; HIST.erro = ""; HIST.lidoAs = horaAgora();
      HIST.carregando = false; return true;
    })
    .catch(function(e){
      HIST.carregando = false; HIST.ok = false; HIST.erro = e.message; HIST.lidoAs = horaAgora();
      if(HIST.linhas === null) HIST.linhas = [];
      if(window.console && console.warn) console.warn("[radar] historico: leitura falhou: " + e.message);
      return false;
    });
}

/* Junta os toques registrados com o estado atual da "atividade": marcacao
   sem registro (feita antes da tabela existir, ou vinda do importar.html)
   entra pela data da ultima marcacao. A chave vend|lead|data|status evita
   contar duas vezes. */
function eventosHistorico(){
  var evs = [], chave = {};
  (HIST.linhas||[]).forEach(function(x){
    if(!x || !x.vend || !x.lead || !x.s) return;
    var d = String(x.d||"").slice(0,10) || String(x.ts||"").slice(0,10);
    if(!d) return;
    evs.push({ vend:x.vend, lead:x.lead, s:x.s, m:x.m||null, d:d, ts:x.ts||"", real:true });
    chave[x.vend+"|"+x.lead+"|"+d+"|"+x.s] = 1;
  });
  Object.keys(STATE.atividade||{}).forEach(function(vid){
    var m = STATE.atividade[vid]||{};
    Object.keys(m).forEach(function(leadId){
      var r = m[leadId]; if(!r || !r.s || !r.d) return;
      if(chave[vid+"|"+leadId+"|"+r.d+"|"+r.s]) return;
      evs.push({ vend:vid, lead:leadId, s:r.s, m:r.m||null, d:r.d, ts:"", real:false });
    });
  });
  return evs;
}

var HV = { periodo:"semana", ini:"", fim:"", grupo:"", metrica:"toques" };
function somaDiasLocal(iso, n){ var d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return dataLocal(d); }
function inicioSemana(iso){ var d=new Date(iso+"T12:00:00"); var dia=(d.getDay()+6)%7; d.setDate(d.getDate()-dia); return dataLocal(d); }
function inicioMes(iso){ return iso.slice(0,7)+"-01"; }
function fimMes(iso){ return dataLocal(new Date(+iso.slice(0,4), +iso.slice(5,7), 0, 12)); }
function diasEntre(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000)+1; }
var PERIODOS=[
  ["hoje","Hoje"],["ontem","Ontem"],["semana","Esta semana"],["semana_passada","Semana passada"],
  ["mes","Este mês"],["mes_passado","Mês passado"],["total","Total"],["custom","De / até"]
];
function periodoAtual(evs){
  var p = HV.periodo, ini, fim = HOJE, t;
  if(p==="hoje"){ ini=HOJE; }
  else if(p==="ontem"){ ini=fim=somaDiasLocal(HOJE,-1); }
  else if(p==="semana"){ ini=inicioSemana(HOJE); }
  else if(p==="semana_passada"){ fim=somaDiasLocal(inicioSemana(HOJE),-1); ini=somaDiasLocal(fim,-6); }
  else if(p==="mes"){ ini=inicioMes(HOJE); }
  else if(p==="mes_passado"){ fim=somaDiasLocal(inicioMes(HOJE),-1); ini=inicioMes(fim); }
  else if(p==="total"){ ini=""; evs.forEach(function(e){ if(e.d && (!ini || e.d<ini)) ini=e.d; }); if(!ini) ini=HOJE; }
  else { ini=HV.ini||somaDiasLocal(HOJE,-6); fim=HV.fim||HOJE; if(ini>fim){ t=ini; ini=fim; fim=t; } }
  return { ini:ini, fim:fim };
}
function grupoAuto(ini,fim){
  var n=diasEntre(ini,fim);
  return n<=31?"dia":(n<=140?"semana":"mes");
}
function chaveBucket(d, grupo){
  if(grupo==="mes") return d.slice(0,7);
  if(grupo==="semana") return inicioSemana(d);
  return d;
}
var MESES_CURTO=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var DIAS_CURTO=["dom","seg","ter","qua","qui","sex","sáb"];
function rotuloBucket(k, grupo){
  if(grupo==="mes") return MESES_CURTO[+k.slice(5,7)-1]+"/"+k.slice(2,4);
  if(grupo==="semana") return "sem. "+dataBR(k);
  return DIAS_CURTO[new Date(k+"T12:00:00").getDay()]+" "+dataBR(k);
}
function listaBuckets(ini, fim, grupo){
  var out=[], cur, guard=0;
  if(grupo==="mes"){ cur=inicioMes(ini); while(cur<=fim && guard++<120){ out.push(cur.slice(0,7)); cur=somaDiasLocal(fimMes(cur),1); } }
  else if(grupo==="semana"){ cur=inicioSemana(ini); while(cur<=fim && guard++<400){ out.push(cur); cur=somaDiasLocal(cur,7); } }
  else { cur=ini; while(cur<=fim && guard++<400){ out.push(cur); cur=somaDiasLocal(cur,1); } }
  return out;
}

function somarEvento(c, e){
  c.toques++;
  c._leads[e.lead]=1; c._dias[e.d]=1;
  if(e.s==="contatado" && e.m!=="recepcao") c.contatos++;
  if(e.s==="fup1"||e.s==="fup2") c.followups++;
  if(RESPOSTA.indexOf(e.s)>=0) c.respostas++;
  if(e.s==="reuniao") c.reunioes++;
  if(e.s==="fechado") c.fechados++;
  if(e.s==="perdido"||e.s==="bloqueado") c.perdidos++;
}
function fecharContador(c){
  c.leads=Object.keys(c._leads).length; c.dias=Object.keys(c._dias).length;
  c.mediaDia=c.dias?c.toques/c.dias:0;
  return c;
}

  var sel=el("select",{class:"search",style:"max-width:190px;border-radius:6px;padding:5px 9px",
    onchange:function(e){ HV.metrica=e.target.value; e.target.blur(); render(); }});
  METRICAS.forEach(function(m){ var o=el("option",{value:m[0],text:m[1]}); if(HV.metrica===m[0]) o.selected=true; sel.appendChild(o); });
  linhaCorte.appendChild(sel);
  main.appendChild(linhaCorte);

  /* --- agregacao --- */
  var buckets = listaBuckets(per.ini, per.fim, grupo);
  var reps = todosVend();
  var porV = {}, porVB = {}, total = contadorVazio(), porB = {};
  reps.forEach(function(p){ porV[p.id]=contadorVazio(); porVB[p.id]={}; });
  buckets.forEach(function(b){ porB[b]=contadorVazio(); });
  noPeriodo.forEach(function(e){
    if(!porV[e.vend]){ porV[e.vend]=contadorVazio(); porVB[e.vend]={}; }
    var b = chaveBucket(e.d, grupo);
    if(!porVB[e.vend][b]) porVB[e.vend][b]=contadorVazio();
    if(!porB[b]) porB[b]=contadorVazio();
    somarEvento(porV[e.vend], e); somarEvento(porVB[e.vend][b], e);
    somarEvento(porB[b], e); somarEvento(total, e);
  });
  fecharContador(total);
  Object.keys(porV).forEach(function(v){ fecharContador(porV[v]);
    Object.keys(porVB[v]).forEach(function(b){ fecharContador(porVB[v][b]); }); });
  Object.keys(porB).forEach(function(b){ fecharContador(porB[b]); });

  var linhas = reps.filter(function(p){ return !p.inativo || porV[p.id].toques>0; })
    .map(function(p){ return {p:p, c:porV[p.id]}; })
    .sort(function(a,b){ return b.c.toques-a.c.toques || b.c.reunioes-a.c.reunioes || a.p.nome.localeCompare(b.p.nome,"pt"); });
  var top = linhas.length && linhas[0].c.toques ? linhas[0] : null;
  var nDias = diasEntre(per.ini, per.fim);
  var ativosN = ativos().length;
  var metaDia = ativos().reduce(function(a,p){ return a+(p.cota||50); },0);

  var subPer = dataBR(per.ini)+(per.ini!==per.fim?" a "+dataBR(per.fim):"")+" · "+nDias+" dia(s)";
  var stTop = stat("Mais ativo", top?top.p.nome:"—", top?(top.c.toques+" toques · "+top.c.dias+" dia(s) ativo(s)"):"ninguém marcou nada");
  stTop.querySelector(".v").style.fontSize="19px";
  main.appendChild(el("div",{class:"stats"},[
    stat("Toques no período", String(total.toques), subPer),
    stat("Leads trabalhados", String(total.leads), total.contatos+" primeiro(s) contato(s)"),
    stat("Respostas", String(total.respostas), total.leads?Math.round(total.respostas/total.leads*100)+"% dos leads trabalhados":"—"),
    stat("Reuniões · fechados", total.reunioes+" · "+total.fechados, "R$ "+(total.fechados*TICKET).toLocaleString("pt-BR")+"/mês fechado"),
    stTop
  ]));

  /* --- grade vendedor x periodo --- */
  var pg = el("div",{class:"panel"},[
    el("h2",{text:"Por vendedor e "+(grupo==="dia"?"dia":grupo==="semana"?"semana":"mês")}),
    el("p",{class:"hint",text:"Cada célula é a métrica escolhida acima naquele corte. Quanto mais escura, mais movimento. A última linha soma o time; a última coluna soma o período."})
  ]);
  var metrica = HV.metrica;
  var maxCel = 1;
  linhas.forEach(function(x){ buckets.forEach(function(b){ var c=porVB[x.p.id][b]; if(c && c[metrica]>maxCel) maxCel=c[metrica]; }); });
  function cel(val, forte){
    var pct = val?Math.max(12,Math.round(val/maxCel*100)):0;
    return el("td",{class:"num",style:(val?"background:color-mix(in srgb, var(--accent) "+Math.round(pct*0.55)+"%, transparent);":"color:var(--text-3);")+(forte?"font-weight:600":""),
      text:val?String(val):"·"});
  }
  var tb = el("table",{style:"min-width:"+(240+buckets.length*62)+"px"});
  var cab = [el("th",{text:"Vendedor"})];
  buckets.forEach(function(b){ cab.push(el("th",{class:"num",text:rotuloBucket(b,grupo)})); });
  cab.push(el("th",{class:"num",text:"Total"}));
  tb.appendChild(el("thead",{},[el("tr",{},cab)]));
  var tbody = el("tbody");
  linhas.forEach(function(x){
    var tds=[el("td",{},[el("div",{style:"display:flex;align-items:center;gap:8px;white-space:nowrap"},[
      el("span",{class:"av",style:"background:"+corDe(x.p.id)+";width:22px;height:22px;font-size:9.5px"+(x.p.inativo?";opacity:.6":""),text:iniciais(x.p.nome)}),
      el("span",{},[el("div",{style:"font-weight:600",text:x.p.nome}),
        x.p.inativo?el("div",{style:"font-size:11px;color:var(--text-3)",text:"saiu do time"}):null])])])];
    buckets.forEach(function(b){ var c=porVB[x.p.id][b]; tds.push(cel(c?c[metrica]:0,false)); });
    tds.push(el("td",{class:"num",style:"font-weight:700",text:String(x.c[metrica])}));
    tbody.appendChild(el("tr",{},tds));
  });
  var tdsT=[el("td",{style:"font-weight:700",text:"Time"})];
  buckets.forEach(function(b){ tdsT.push(el("td",{class:"num",style:"font-weight:700;border-top:2px solid var(--line)",text:String(porB[b]?porB[b][metrica]:0)})); });
  tdsT.push(el("td",{class:"num",style:"font-weight:700;border-top:2px solid var(--line)",text:String(total[metrica])}));
  tbody.appendChild(el("tr",{},tdsT));
  tb.appendChild(tbody);
  pg.appendChild(el("div",{class:"tablewrap"},[tb]));
  if(!noPeriodo.length) pg.appendChild(el("div",{class:"empty",text:"Nenhum toque registrado neste período."}));
  pg.appendChild(el("div",{class:"acts",style:"margin-top:10px"},[
    el("button",{class:"btn",onclick:function(){
      var t=["Vendedor"].concat(buckets.map(function(b){return rotuloBucket(b,grupo)}),["Total"]).join("\t")+"\n";
      linhas.forEach(function(x){ t+=[x.p.nome].concat(buckets.map(function(b){var c=porVB[x.p.id][b];return c?c[metrica]:0}),[x.c[metrica]]).join("\t")+"\n"; });
      t+=["Time"].concat(buckets.map(function(b){return porB[b]?porB[b][metrica]:0}),[total[metrica]]).join("\t")+"\n";
      copiar(t);
    }},[document.createTextNode("Copiar tabela (cola direto na planilha)")])
  ]));
  main.appendChild(pg);

  /* --- detalhe por vendedor no periodo --- */
  var pd = el("div",{class:"panel"},[
    el("h2",{text:"Detalhe do período por vendedor"}),
    el("p",{class:"hint",text:"Ordenado por toques. 'Dias ativos' é em quantos dias do período a pessoa marcou alguma coisa; a média é toques por dia ativo. A cota é "+(ativosN?Math.round(metaDia/ativosN):50)+" contatos/dia por vendedor."})
  ]);
  var td2 = el("table");
  td2.appendChild(el("thead",{},[el("tr",{},[
    el("th",{text:"Vendedor"}),el("th",{class:"num",text:"Toques"}),el("th",{class:"num",text:"Leads"}),
    el("th",{class:"num",text:"1º contato"}),el("th",{class:"num",text:"Follow-ups"}),el("th",{class:"num",text:"Respostas"}),
    el("th",{class:"num",text:"Reuniões"}),el("th",{class:"num",text:"Fechados"}),el("th",{class:"num",text:"Sem interesse"}),
    el("th",{class:"num",text:"Dias ativos"}),el("th",{class:"num",text:"Média/dia"})
  ])]));
  var tb2 = el("tbody");
  linhas.forEach(function(x){
    var c=x.c;
    tb2.appendChild(el("tr",{},[
      el("td",{},[el("div",{style:"display:flex;align-items:center;gap:8px;white-space:nowrap"},[
        el("span",{class:"av",style:"background:"+corDe(x.p.id)+";width:22px;height:22px;font-size:9.5px",text:iniciais(x.p.nome)}),
        el("span",{style:"font-weight:600",text:x.p.nome})])]),
      el("td",{class:"num",style:"font-weight:700",text:String(c.toques)}),
      el("td",{class:"num",text:String(c.leads)}),
      el("td",{class:"num",text:String(c.contatos)}),
      el("td",{class:"num",text:String(c.followups)}),
      el("td",{class:"num",text:String(c.respostas)}),
      el("td",{class:"num",style:c.reunioes?"color:var(--ok);font-weight:600":"",text:String(c.reunioes)}),
      el("td",{class:"num",style:c.fechados?"color:var(--ok);font-weight:600":"",text:String(c.fechados)}),
      el("td",{class:"num",text:String(c.perdidos)}),
      el("td",{class:"num",text:c.dias+"/"+nDias}),
      el("td",{class:"num",text:c.dias?c.mediaDia.toFixed(1):"—"})
    ]));
  });
  td2.appendChild(tb2);
  pd.appendChild(el("div",{class:"tablewrap"},[td2]));
  main.appendChild(pd);

  /* --- de onde vem o numero --- */
  var reais = evs.filter(function(e){ return e.real; }).length, sint = evs.length-reais;
  var desde=""; evs.forEach(function(e){ if(e.real && (!desde || e.ts<desde)) desde=e.ts; });
  var pf = el("div",{class:"panel"});
  pf.appendChild(el("p",{class:"hint",style:"margin:0",html:
    "<b>De onde vem o número:</b> "+reais+" toque(s) registrado(s) na tabela de histórico"+(desde?" desde "+dataBR(desde.slice(0,10)):"")+
    (sint?", mais "+sint+" marcação(ões) sem registro contadas pela data da última marcação":"")+
    ". Cada clique de classificação vira um registro novo; nada é sobrescrito."+
    (HIST.lidoAs?" Lido às "+HIST.lidoAs+".":"")+(FILA_H.length?" <b>"+FILA_H.length+" toque(s) desta máquina ainda não subiram.</b>":"")}));
  pf.appendChild(el("div",{class:"acts",style:"margin-top:10px"},[
    el("button",{class:"btn",onclick:function(){ HIST.linhas=null; escoarH(); sincronizar().then(function(){ render(); }); }},[document.createTextNode("Reler agora")])
  ]));
  main.appendChild(pf);
}

/* ---------- boot ---------- */
READY = true;
lerFila();
if(FILA.length) FILA_DESDE = Date.now();
lerFilaH();
lerEspelho();

function restaurarVend(){
  var id=null; try{ id = localStorage.getItem("radar_vend"); }catch(e){}
  if(!id) return;
  var achado = STATE.equipe.filter(function(p){ return p.id===id; })[0];
  if(achado && achado.inativo){
    try{ localStorage.removeItem("radar_vend"); }catch(e){}
    return;
  }
  if(achado) STATE.vend = achado;
}
restaurarVend();
render();

function sincronizar(){
  var hist = (STATE.vend && STATE.vend.gestor && STATE.view==="historico") ? carregarHistorico() : Promise.resolve(false);
  return Promise.all([carregarNuvem(), hist]).then(function(r){
    var ok = r[0];
    if((ok || r[1]) && !digitando()) render(); else pintarSync();
    return ok;
  });
}
carregarLeadsNuvem().then(function(trocou){
  if(trocou && !digitando()) render();
  return sincronizar();
});

if(typeof window !== "undefined"){
  window.addEventListener("online", function(){ escoar(); escoarH(); });
  setInterval(function(){ if(FILA.length){ escoar(); pedirRender(); } if(FILA_H.length) escoarH(); }, 20000);
  /* se a pagina passar a virada do dia aberta, o contador de hoje vira junto */
  setInterval(function(){
    var h = dataLocal();
    if(h !== HOJE){ HOJE = h; pedirRender(); }
  }, 60000);
  setInterval(function(){ if(!digitando()) sincronizar(); }, 30000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) sincronizar();
  });
}

/* ---------- resumo do dia para mandar no grupo ---------- */
function resumoDoDia(){
  var v = STATE.vend; if(!v) return "";
  var m = STATE.atividade[v.id] || {}, k, r;
  var hoje = { enviadas:0, responderam:0, reunioes:0, semInteresse:0, followups:0 };
  var nomes = { reuniao:[], conversa:[] };
  var mapa = {};
  todosLeads().forEach(function(l){ mapa[l.id] = l.empresa; });
  for(k in m){
    r = m[k]; if(!r || r.d !== HOJE) continue;
    hoje.enviadas++;
    if(["conversa","reuniao","proposta","fechado"].indexOf(r.s) >= 0) hoje.responderam++;
    if(r.s === "reuniao"){ hoje.reunioes++; nomes.reuniao.push(mapa[k]||k); }
    if(r.s === "conversa"){ nomes.conversa.push(mapa[k]||k); }
    if(r.s === "perdido" || r.s === "bloqueado") hoje.semInteresse++;
    if(r.s === "fup1" || r.s === "fup2") hoje.followups++;
  }
  var d = HOJE.split("-");
  var t = "*Resumo do dia — " + v.nome + "*\n" + d[2] + "/" + d[1] + "\n\n";
  t += "Mensagens enviadas: " + hoje.enviadas + "\n";
  t += "Responderam: " + hoje.responderam + "\n";
  t += "Follow-ups feitos: " + hoje.followups + "\n";
  t += "*Reuniões marcadas: " + hoje.reunioes + "*\n";
  t += "Sem interesse: " + hoje.semInteresse + "\n";
  if(nomes.reuniao.length) t += "\n*Reuniões:* " + nomes.reuniao.join(", ") + "\n";
  if(nomes.conversa.length) t += "*Em conversa:* " + nomes.conversa.join(", ") + "\n";
  return t;
}
