<title>Radar Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F4; --surface-3:#E2E8ED;
  --line:#D3DBE2; --line-soft:#E5EAEF;
  --text:#101820; --text-2:#48586A; --text-3:#77879A;
  --accent:#0E6F78; --accent-ink:#0A545B; --accent-soft:#DCEDEF;
  --quente:#C4342F; --quente-soft:#FBE4E2;
  --morno:#9A6608; --morno-soft:#FAEEDA;
  --frio:#5F7288; --frio-soft:#E8ECF1;
  --ok:#186B42; --ok-soft:#DCEFE4;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 14px rgba(16,24,32,.05);
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D141B; --surface:#141D26; --surface-2:#1B2732; --surface-3:#24323F;
    --line:#2D3D4C; --line-soft:#223040;
    --text:#E8EEF4; --text-2:#9DAEBF; --text-3:#728499;
    --accent:#3FB0BA; --accent-ink:#6FCBD3; --accent-soft:#173238;
    --quente:#F0716B; --quente-soft:#3A1E1D;
    --morno:#DFA83F; --morno-soft:#352A15;
    --frio:#93A6BA; --frio-soft:#212D3A;
    --ok:#4FBF87; --ok-soft:#14301F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D141B; --surface:#141D26; --surface-2:#1B2732; --surface-3:#24323F;
  --line:#2D3D4C; --line-soft:#223040;
  --text:#E8EEF4; --text-2:#9DAEBF; --text-3:#728499;
  --accent:#3FB0BA; --accent-ink:#6FCBD3; --accent-soft:#173238;
  --quente:#F0716B; --quente-soft:#3A1E1D;
  --morno:#DFA83F; --morno-soft:#352A15;
  --frio:#93A6BA; --frio-soft:#212D3A;
  --ok:#4FBF87; --ok-soft:#14301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Archivo,-apple-system,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:Archivo;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
@media(max-width:820px){#app{grid-template-columns:1fr}}

.rail{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:16px 10px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
@media(max-width:820px){
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;
    border-right:none;border-bottom:1px solid var(--line);padding:10px}
}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--quente);
  box-shadow:0 0 0 4px var(--quente-soft);flex:none}
.brand b{font-family:Archivo;font-size:14.5px;font-weight:700;letter-spacing:-.02em}
@media(max-width:820px){.brand{width:100%;padding-bottom:8px}}

.navbtn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);
  color:var(--text-2);font-size:13.5px;font-weight:500;text-align:left;width:100%;
  transition:background .12s,color .12s}
.navbtn:hover{background:var(--surface-2);color:var(--text)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navbtn .ic{width:16px;flex:none;opacity:.85;display:grid;place-items:center}
.navbtn .n{margin-left:auto;font-size:11px;font-family:"IBM Plex Mono",monospace;
  color:var(--text-3);font-variant-numeric:tabular-nums}
.navbtn[aria-current="true"] .n{color:var(--accent-ink)}
@media(max-width:820px){.navbtn{width:auto}.navbtn .n{margin-left:6px}}

.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft)}
@media(max-width:820px){.rail-foot{margin-top:0;width:100%;border-top:none;padding-top:6px}}
.whoami{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r);width:100%}
.whoami:hover{background:var(--surface-2)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:Archivo;font-weight:700;font-size:11px;color:#fff;letter-spacing:.01em}
.whoami .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoami .rl{font-size:10.5px;color:var(--text-3)}

main{padding:22px 26px 60px;min-width:0;max-width:1180px}
@media(max-width:600px){main{padding:16px 14px 50px}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:22px;font-weight:700}
.page-head p{margin:3px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}

/* ---------- Quota meter ---------- */
.quota{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:9px 14px;box-shadow:var(--shadow)}
.quota .big{font-family:Archivo;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.quota .big s{text-decoration:none;color:var(--text-3);font-size:13px;font-weight:500}
.bar{width:104px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar i.done{background:var(--ok)}

/* ---------- Filters ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;font-weight:500;color:var(--text-2);transition:.12s}
.chip:hover{border-color:var(--text-3)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--ground);font-weight:600}
.search{flex:1;min-width:150px;max-width:270px;padding:6px 11px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13px}
.search::placeholder{color:var(--text-3)}

/* ---------- Lead rows ---------- */
.rows{display:flex;flex-direction:column;gap:6px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  border-left-width:3px;box-shadow:var(--shadow);overflow:hidden}
.row.A{border-left-color:var(--quente)} .row.B{border-left-color:var(--morno)} .row.C{border-left-color:var(--frio)}
.row.feito{opacity:.62}
.rhead{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 14px;
  align-items:center;width:100%;text-align:left}
.rhead:hover{background:var(--surface-2)}
.rtitle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.rtitle b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.rtitle .meta{font-size:12px;color:var(--text-3)}
.gancho{font-size:12.5px;color:var(--text-2);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rside{display:flex;align-items:center;gap:8px;flex:none}

.tag{font-family:Archivo;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 7px;border-radius:4px}
.tag.A{background:var(--quente-soft);color:var(--quente)}
.tag.B{background:var(--morno-soft);color:var(--morno)}
.tag.C{background:var(--frio-soft);color:var(--frio)}

.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.pill.novo{background:var(--surface-3);color:var(--text-3)}
.pill.andamento{background:var(--accent-soft);color:var(--accent-ink)}
.pill.ganho{background:var(--ok-soft);color:var(--ok)}
.pill.perdido{background:var(--surface-2);color:var(--text-3);text-decoration:line-through}

/* ---------- Expanded panel ---------- */
.rbody{border-top:1px solid var(--line-soft);padding:15px 14px;background:var(--surface-2);
  display:grid;gap:15px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media(max-width:760px){.rbody{grid-template-columns:1fr}}
.block{display:flex;flex-direction:column;gap:7px;min-width:0}
.scriptbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;font-size:13px;white-space:pre-wrap;line-height:1.6;color:var(--text)}
.acts{display:flex;gap:6px;flex-wrap:wrap}

   Devolve null quando nao ha erro pra apontar (setup profissional). */
function entreAspas(g){
  var m=String(g||"").match(/["“]([^"”]{1,60})["”]/);
  return m?m[1].trim():"";
}
function numeroDe(g){
  var m=String(g||"").match(/(\d+)\s*(anúncio|anuncio|criativo|campo)/i);
  return m?parseInt(m[1],10):0;
}
function observacaoDe(l){
  var g=String((l&&l.gancho)||""), q=entreAspas(g), n=numeroDe(g), emp=(l&&l.empresa)||"a página";
  if(!g) return null;
  if(/setup profissional|t[íi]tulo estruturado/i.test(g)) return null;
  if(/IMPULSIONAMENTO/i.test(g))
    return "o anúncio é um post impulsionado e manda a pessoa pro perfil, não pro WhatsApp — ela clica, cai no feed e não tem pra onde ir";
  if(/USD|moeda estrangeira/i.test(g))
    return "a conta de anúncios de vocês tá configurada em dólar — cada real que entra paga IOF e variação de câmbio antes de virar anúncio";
  if(/copy inteira colada/i.test(g))
    return "o texto inteiro do anúncio foi colado no campo do título, então no celular ele aparece cortado com “…” logo no começo";
  if(/URL crua|api\.whatsapp|wa\.me/i.test(g))
    return q ? "o título do anúncio tá aparecendo como “"+q+"” em vez de uma chamada"
             : "o título do anúncio tá aparecendo como um endereço de site em vez de uma chamada";
  if(/nome da p[áa]gina colado|igual ao nome da p[áa]gina/i.test(g)){
    var rep=g.match(/repetido\s+(\d+)x/i);
    return "o título do anúncio tá saindo só com o nome “"+emp+"”"+
           (rep?", repetido em "+rep[1]+" anúncios":"")+", sem chamada nenhuma";
  }
  if(/sem t[íi]tulo de link|t[íi]tulo vazio|campos? de t[íi]tulo vazio/i.test(g))
    return "o anúncio tá rodando sem o título embaixo da imagem — aquele texto em negrito que chama pro clique tá em branco";
  if(/mesma chamada|t[íi]tulo id[êe]ntico|criativos id[êe]nticos|mesmo t[íi]tulo|ao mesmo tempo/i.test(g))
    return "tem "+(n?n:"vários")+" anúncios rodando ao mesmo tempo com a mesma chamada — a verba tá dividida entre cópias iguais";
  if(/erro de escrita/i.test(g))
    return "o título do anúncio tá com um erro de digitação"+(q?" (“"+q+"”)":"")+" — e é a primeira coisa que a pessoa lê";
  if(/CAIXA ALTA/i.test(g))
    return "o título do anúncio tá inteiro em maiúsculas"+(q?" (“"+q+"”)":"")+" — no feed isso costuma ser lido como spam e a pessoa passa reto";
  if(/espa[çc]o duplo/i.test(g))

  return null;
}

function observacaoCurta(l){

/* Quem cuida: "a Dra. Ariane" quando o nome da empresa traz o profissional. */
function quemCuida(l){
  var e=String((l&&l.empresa)||"");
  var m=e.match(/\b(dra|dr)\.?\s+([A-Za-zÀ-ÿ][\wÀ-ÿ'.-]*)/i);
  if(!m) return "";
  var t=m[1].toLowerCase()==="dra"?"a Dra.":"o Dr.";
  return t+" "+m[2].replace(/[.,-]+$/,"");
}
function ehFixo(tel){
  var d=String(tel||"").replace(/\D/g,""); if(d.length<10) return false;
  if(d.length===12||d.length===13) d=d.slice(2);
  return /^[2-5]/.test(d.slice(2));
}
/* "o anuncio da Barreto Imoveis", "do Dr. Walter", "do O Imperador", "de voces" (handle) */
function anuncioDa(l){
  var e=String((l&&l.empresa)||"").trim();
  if(!e||(/^[a-z0-9._]+$/.test(e)&&e.indexOf(" ")<0)) return "o anúncio de vocês";
  if(/^(dra\.?|dra)\s/i.test(e)) return "o anúncio da "+e;
  if(/^(dr\.?|dr)\s/i.test(e)) return "o anúncio do "+e;
  if(/^os\s/i.test(e)) return "o anúncio dos "+e.slice(3);
  if(/^as\s/i.test(e)) return "o anúncio das "+e.slice(3);
  if(/^o\s/i.test(e)) return "o anúncio do "+e.slice(2);
  if(/^a\s/i.test(e)) return "o anúncio da "+e.slice(2);
  return "o anúncio da "+e;
}

/* ---------- dados ---------- */
function todosLeads(){
  var out=[];
  STATE.lotes.forEach(function(lote){
    (lote.itens||[]).forEach(function(it){
      out.push(Object.assign({},it,{lote:lote._id,loteData:lote.data}));
    });
  });
  return out;
}
function regDe(vid,leadId){
  var m=STATE.atividade[vid]||{};
  return m[leadId]||null;
}
function statusDe(vid,leadId){var r=regDe(vid,leadId);return r&&r.s?r.s:"novo";}

/* Quem "dona" o registro de um lead: o vendedor dele. O gestor ve tudo,
   e le o registro do vendedor a quem o lead foi distribuido. */
function donoDoLead(l){
  var v=STATE.vend; if(!v) return null;
  return v.gestor ? (l.vend||v.id) : v.id;
}
function meusLeads(){
  var v=STATE.vend; if(!v) return [];
  if(v.gestor) return todosLeads();
  return todosLeads().filter(function(l){return l.vend===v.id;});
}
function ultimaData(){
  var d="";
  STATE.lotes.forEach(function(x){ if(String(x.data||"")>d) d=String(x.data||""); });
  return d;
}
/* Vendedor que saiu continua no cadastro: o historico dele (contatos,
   reunioes, classificacoes) e do time e nao pode sumir do painel. O que
   ele perde e a fila e a entrada. */
function ativos(){
  return STATE.equipe.filter(function(p){return !p.gestor && !p.inativo;});
}
function todosVend(){
  return STATE.equipe.filter(function(p){return !p.gestor;});
}
function exVend(){
  return STATE.equipe.filter(function(p){return !p.gestor && p.inativo;});
}
/* Um lead que trocou de dono pode ja ter sido trabalhado pelo dono antigo.
   Sem este aviso o novo dono abre como primeiro contato e a empresa recebe
   a mesma abordagem duas vezes. */
function historicoOutro(l,dono){
  var achado=null, ids=Object.keys(STATE.atividade||{});
  ids.forEach(function(vid){
    if(achado||vid===dono) return;
    var r=(STATE.atividade[vid]||{})[l.id];
    if(r&&r.s&&r.s!=="novo") achado={vend:vid,reg:r};
  });
  return achado;
}
function nomeVend(id){
  var a=STATE.equipe.filter(function(p){return p.id===id})[0];
  return a?a.nome:id;
}
function ordenar(arr){
  var peso={A:0,B:1,C:2};
  return arr.slice().sort(function(a,b){
    var sa=statusDe(donoDoLead(a),a.id)==="novo"?0:1, sb=statusDe(donoDoLead(b),b.id)==="novo"?0:1;
    if(sa!==sb) return sa-sb;
    var pa=peso[a.prio]!==undefined?peso[a.prio]:3, pb=peso[b.prio]!==undefined?peso[b.prio]:3;
    if(pa!==pb) return pa-pb;
    var wa=a.wa?0:1, wb=b.wa?0:1;
    if(wa!==wb) return wa-wb;
    return String(a.empresa).localeCompare(String(b.empresa),"pt");
  });
}
function precisaFollowup(vid,leadId){
  var r=regDe(vid,leadId); if(!r||!r.d) return false;
  var d=diasDesde(r.d);
  if(r.s==="contatado") return d>=2;
  if(r.s==="fup1") return d>=3;
  if(r.s==="conversa"||r.s==="proposta") return d>=4;
  if(r.s==="fup2") return false;
  return false;
}
function contatadosHoje(vid){
  var m=STATE.atividade[vid]||{},n=0,k;
  for(k in m) if(m[k]&&m[k].d===HOJE) n++;
  return n;
}

/* ---------- persistencia ---------- */
function salvarReg(leadId,patch,vid,semRender){
  var v=STATE.vend; if(!v) return;
  vid=vid||v.id;
  var m=STATE.atividade[vid]||(STATE.atividade[vid]={});
  var atual=m[leadId]||{};
  m[leadId]=Object.assign({},atual,patch);
  gravarLocal(vid);
  enfileirar(vid,leadId,m[leadId]);
  /* so a classificacao (status) vira toque no historico; anotacao nao */
  if(patch && patch.s) registrarToque(vid,leadId,m[leadId]);
  if(!semRender) render();
}
function salvarEquipe(){
  if(!DB) return Promise.reject({code:"sem_banco"});
  return DB.doc("equipe/lista").set({vendedores:STATE.equipe});
}

/* ============================================================
   RENDER
   ============================================================ */
/* NUNCA redesenhe a tela enquanto alguem esta digitando: o campo seria
   destruido e recriado com o valor antigo, e o texto se perderia antes
   do salvamento (que so dispara ao sair do campo). Guardamos o pedido e
   redesenhamos quando o foco sair. */
var RENDER_PEND=false, _rq=null;
function digitando(){
  var a=document.activeElement;
  if(!a) return false;
  var t=(a.tagName||"").toLowerCase();
  return t==="input"||t==="textarea"||t==="select";
}
function render(){
  if(digitando()){ RENDER_PEND=true; return; }
  RENDER_PEND=false;
  var root=document.getElementById("root");
  root.innerHTML="";
  if(!STATE.vend){ root.appendChild(gate()); return; }
  root.appendChild(shell());
}
/* Junta varias atualizacoes do banco num redesenho so. */
function pedirRender(){
  if(_rq) return;
  _rq=setTimeout(function(){ _rq=null; render(); },120);
}
document.addEventListener("focusout",function(){
  setTimeout(function(){ if(RENDER_PEND&&!digitando()) render(); },60);
});

var VERSAO_RADAR="11/09/2026 - scripts v2: observacao do gancho, recepcao, print no follow-up";
/* ---------- gate: quem e voce ---------- */
function entrarComo(p){
  try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(e){}
  STATE.vend=p; try{localStorage.setItem("radar_vend",p.id)}catch(e){}
  STATE.view=p.gestor?"gerencial":"leads";
  STATE.pedindoPin=false;
  render();
  sincronizar();
}

/* A entrada do gestor pede PIN. Nao e cofre: e so pra um vendedor nao
   abrir o painel do Danilo sem querer (ou de proposito). */
function cartaoPin(){
  var erro=el("div",{class:"pinerro",text:""});
  var inp=el("input",{type:"password",inputmode:"numeric",autocomplete:"off",
    class:"pinbox",placeholder:"PIN do gestor",
    onkeydown:function(e){ if(e.key==="Enter"){ e.preventDefault(); tentar(); } }});
  function tentar(){
    var g=STATE.equipe.filter(function(x){return x.gestor})[0];
    if(g && inp.value===PIN_GESTOR){ entrarComo(g); return; }
    erro.textContent="PIN errado. Tente de novo.";
    inp.value=""; inp.focus();
  }
  setTimeout(function(){ try{inp.focus()}catch(e){} },40);
  return el("div",{class:"gate"},[
    el("div",{class:"gatecard"},[
      el("div",{class:"brand",style:"padding-left:0"},[el("span",{class:"dot"}),el("b",{text:"Radar Comercial"})]),
      el("h1",{text:"Painel do gestor"}),
      el("p",{text:"Digite o PIN para abrir o ranking e o acompanhamento do time."}),
      inp, erro,
      el("div",{class:"pinbts"},[
        el("button",{class:"bt",onclick:tentar},[document.createTextNode("Entrar")]),
        el("button",{class:"bt ghost",onclick:function(){
          try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(e){}
          STATE.pedindoPin=false; render();
        }},[document.createTextNode("Voltar")])
      ])
    ])
  ]);
}

function gate(){
  if(STATE.pedindoPin) return cartaoPin();
  var lista=el("div",{class:"people"});
  STATE.equipe.filter(function(p){return !p.inativo;}).forEach(function(p){
    lista.appendChild(el("button",{class:"person",onclick:function(){
      if(p.gestor){ STATE.pedindoPin=true; render(); return; }
      entrarComo(p);
    }},[
      el("span",{class:"av",style:"background:"+corDe(p.id),text:iniciais(p.nome)}),
      el("span",{},[el("div",{class:"nm",text:p.nome}),
        el("div",{class:"rl",text:p.gestor?"Gestor":("Comercial · "+nLeadsDe(p.id)+" leads na fila")})])
    ]));
  });
  if(!STATE.equipe.length) lista.appendChild(el("div",{class:"empty",text:"Equipe ainda nao cadastrada."}));
  return el("div",{class:"gate"},[
    el("div",{class:"gatecard"},[
      el("div",{class:"brand",style:"padding-left:0"},[el("span",{class:"dot"}),el("b",{text:"Radar Comercial"})]),
      el("h1",{text:"Quem esta usando?"}),
      el("p",{text:"Escolha seu nome para carregar a sua fila de hoje."}),
      lista,
      el("div",{class:"vstamp",text:"Versao "+VERSAO_RADAR})
    ])
  ]);
}

/* ---------- transferencia para o Radar novo ----------
   Quando a pagina roda no visualizador do claude.ai ela nao alcanca o banco
   (CSP connect-src 'self'): tudo que o vendedor marca fica preso no
   localStorage desta origem. Antes ele copiava um JSON e mandava por
   WhatsApp para o Danilo colar no sistema. Agora e um clique: o pacote vai
   no #hash da URL para importar.html, no mesmo endereco do radar.html
   (danilobarrocas83-png.github.io), que grava no Supabase, deixa a copia no
   localStorage de la e responde por postMessage para esta aba limpar a fila.
   O hash nunca sai do navegador (nao vai para servidor nenhum). */
var RADAR_NOVO_ORIGEM="https://danilobarrocas83-png.github.io";
var RADAR_NOVO=RADAR_NOVO_ORIGEM+"/radar/radar.html";
var RADAR_IMPORTAR=RADAR_NOVO_ORIGEM+"/radar/importar.html";
var RADAR_NOVO_CURTO="danilobarrocas83-png.github.io/radar/radar.html";

function b64url(s){
  var bin="";
  if(typeof TextEncoder!=="undefined"){
    var bytes=new TextEncoder().encode(s);
    for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  } else bin=unescape(encodeURIComponent(s));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
/* Tudo que este vendedor tem nesta maquina: a fila (o que nunca subiu) e o
   espelho local. Se um lead aparece nos dois, vale a fila, que e mais nova. */
function leadsJaTransferidos(){
  var t=lerTransferencia(), m={};
  ((t&&t.leads)||[]).forEach(function(id){ m[String(id)]=1; });
  return m;
}
function itensParaTransferir(){
  var v=STATE.vend; if(!v||v.gestor) return [];
  var m=STATE.atividade[v.id]||{}, porLead={}, feitos=leadsJaTransferidos();
  Object.keys(m).forEach(function(leadId){
    var r=m[leadId]; if(!r||!r.s||feitos[leadId]) return;
    porLead[leadId]={lead:leadId,s:r.s||null,m:r.m||null,d:r.d||null,o:r.o||null};
  });
  FILA.forEach(function(x){ if(x.vend===v.id && x.s) porLead[x.lead]={lead:x.lead,s:x.s||null,m:x.m||null,d:x.d||null,o:x.o||null}; });
  return Object.keys(porLead).map(function(k){ return porLead[k]; });
}
function payloadFila(){
  var v=STATE.vend||{};
  return JSON.stringify({ r:"radar-fila", v:2, vend:v.id||null, nome:v.nome||"", n:FILA.length, itens:itensParaTransferir() });
}
function urlTransferencia(){
  var v=STATE.vend||{}, itens=itensParaTransferir();
  var pacote={ r:"radar-fila", v:2, vend:v.id, nome:v.nome||"", n:itens.length, itens:itens, de:location.hostname, em:new Date().toISOString() };
  return RADAR_IMPORTAR+"#"+b64url(JSON.stringify(pacote));
}
function lerTransferencia(){
  var v=STATE.vend; if(!v) return null;
  try{ return JSON.parse(localStorage.getItem("radar_transf_"+v.id)||"null"); }catch(e){ return null; }
}
function transferirParaRadarNovo(){
  var v=STATE.vend; if(!v) return;
  if(v.gestor){ window.open(RADAR_NOVO,"_blank"); return; }
  var url=urlTransferencia(), n=itensParaTransferir().length;
  STATE.transfAbrindo={n:n,em:Date.now()};
  var w=null;
  try{ w=window.open(url,"_blank"); }catch(e){ w=null; }
  if(!w){ STATE.popupBloqueado=true; STATE.transfAbrindo=null; toast("O navegador bloqueou a nova aba"); render(); return; }
  render();
  /* se a aba nova nao responder (fechada antes da hora, sem opener...), o
     botao volta para o vendedor poder tentar de novo */
  setTimeout(function(){
    if(STATE.transfAbrindo && Date.now()-STATE.transfAbrindo.em>24000){ STATE.transfAbrindo=null; pedirRender(); }
  },25000);
}
/* importar.html responde quando terminou: ai a fila daqui pode ser limpa. */
window.addEventListener("message",function(ev){
  var d=ev.data; if(!d||d.r!=="radar-importado") return;
  if(ev.origin!==RADAR_NOVO_ORIGEM) return;
  var v=STATE.vend; if(!v||v.gestor||d.vend!==v.id) return;
  var leads={}; (d.leads||[]).forEach(function(id){ leads[String(id)]=1; });
  FILA=FILA.filter(function(x){ return !(x.vend===v.id && leads[x.lead]); });
  gravarFila();
  var antes=leadsJaTransferidos(); Object.keys(leads).forEach(function(id){ antes[id]=1; });
  var reg={n:d.n||0,em:new Date().toISOString(),pendente:!!d.pendente,hora:horaAgora(),leads:Object.keys(antes)};
  try{ localStorage.setItem("radar_transf_"+v.id,JSON.stringify(reg)); }catch(e){}
  STATE.transfAbrindo=null; STATE.transfOk=reg;
  toast(d.n? (d.n+" marcacao(oes) salva(s) no sistema") : "Tudo ja estava salvo no sistema");
  pedirRender();
});

/* Plano B (so aparece se o navegador bloquear a aba nova): o texto de antes,
   para copiar e mandar ao Danilo. */
function caixaResgate(){
  if(!presoNoClaude() || !STATE.popupBloqueado) return null;
  var v = STATE.vend; if(!v || v.gestor) return null;
  var itens=itensParaTransferir(); if(!itens.length) return null;
  var ta = el("textarea",{class:"resgate-txt",readonly:"readonly",
    onclick:function(e){ e.target.select(); }});
  ta.value = payloadFila();
  return el("div",{class:"panel resgate"},[
    el("h2",{text:"Plano B: o navegador nao deixou abrir a aba nova"}),
    el("p",{class:"hint",text:"Tente de novo pelo link abaixo (toque nele). Se ainda assim nao abrir, "
      +"copie o texto e mande para o Danilo no WhatsApp - ele coloca no sistema."}),
    el("p",{style:"margin:6px 0 0"},[el("a",{href:urlTransferencia(),target:"_blank",rel:"opener",
      style:"font-weight:600;color:var(--accent)"},[document.createTextNode("Abrir o Radar novo e salvar minhas "+itens.length+" marcacao(oes)")])]),
    ta,
    el("div",{style:"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"},[
      el("button",{class:"btn-alerta",onclick:function(){
        ta.select();
        var ok=false;
        try{ ok=document.execCommand("copy"); }catch(e){}
        if(!ok && navigator.clipboard){ try{ navigator.clipboard.writeText(ta.value); ok=true; }catch(e){} }
        var m=document.getElementById("resgate-msg");
        if(m) m.textContent = ok ? "Copiado. Agora e so colar no WhatsApp do Danilo."
                                 : "Nao consegui copiar sozinho - selecione o texto e use Ctrl+C.";
      }},[document.createTextNode("Copiar tudo")]),
      el("span",{id:"resgate-msg",style:"font-size:12.5px;color:var(--text-2);align-self:center"})
    ])
  ]);
}

/* ---------- aviso de sincronizacao ----------
   O indicador antigo era um texto cinza minusculo no rodape. Ninguem via.
   Se o que o vendedor marca nao esta chegando no banco, isso tem que
   aparecer na cara dele e do gestor, com o motivo e um botao de resolver. */
/* O visualizador do claude.ai (frame.claudeusercontent.com) proibe qualquer
   conexao externa por politica de seguranca (CSP connect-src 'self').
   Nao ha codigo que contorne isso: nesse endereco a pagina NUNCA grava. */
function presoNoClaude(){
  try{ return /claudeusercontent\.com$|(^|\.)claude\.ai$/.test(location.hostname); }catch(e){ return false; }
}
function avisoSync(){
  if(presoNoClaude()){
    var v=STATE.vend||{};
    if(v.gestor){
      return el("div",{class:"alerta"},[
        el("div",{style:"min-width:0"},[
          el("b",{text:"Este link do claude.ai nao consegue ler nem gravar no banco. Nao e a sua internet: o claude.ai bloqueia a conexao."}),
          el("div",{class:"det",text:"Os numeros do time aparecem no arquivo do Radar no seu computador ou no Radar novo: "+RADAR_NOVO_CURTO})
        ]),
        el("button",{class:"btn-alerta",onclick:transferirParaRadarNovo},[document.createTextNode("Abrir o Radar novo")])
      ]);
    }
    var itens=itensParaTransferir(), n=itens.length, t=STATE.transfOk||lerTransferencia();
    if(STATE.transfAbrindo){
      return el("div",{class:"alerta"},[
        el("div",{style:"min-width:0"},[
          el("b",{text:"Abrindo o Radar novo em outra aba..."}),
          el("div",{class:"det",text:(STATE.transfAbrindo.n? "Ele esta salvando suas "+STATE.transfAbrindo.n+" marcacao(oes) no sistema e avisa aqui quando terminar. " : "")
            +"Se a aba nao apareceu, o navegador bloqueou: clique de novo."})
        ]),
        el("button",{class:"btn-alerta",onclick:transferirParaRadarNovo},[document.createTextNode("Abrir de novo")])
      ]);
    }
    if(!n && t){
      return el("div",{class:"alerta",style:"background:var(--ok-soft);border-color:var(--ok)"},[
        el("div",{style:"min-width:0"},[
          el("b",{style:"color:var(--ok)",text:(t.pendente? "Suas marcacoes ja estao no Radar novo, que salva no sistema sozinho" : "Suas marcacoes ja estao salvas no sistema")+(t.hora?(" (as "+t.hora+")"):"")+"."}),
          el("div",{class:"det",text:"Este link do claude.ai nao grava no banco. A partir de agora trabalhe so no Radar novo - ele salva sozinho. "
            +"Salve nos favoritos: "+RADAR_NOVO_CURTO})
        ]),
        el("button",{class:"btn-alerta",style:"background:var(--ok)",onclick:transferirParaRadarNovo},[document.createTextNode("Abrir o Radar novo")])
      ]);
    }
    return el("div",{class:"alerta"},[
      el("div",{style:"min-width:0"},[
        el("b",{text:"Este link do claude.ai nao consegue gravar no banco. Nao e a sua internet: o claude.ai bloqueia a conexao."}),
        el("div",{class:"det",text:(n? "Suas "+n+" marcacao(oes) feitas aqui estao guardadas neste aparelho. Nada se perdeu: clique no botao, o Radar novo abre em outra aba e salva tudo no sistema sozinho. "
                                      : "Nada do que voce marcar aqui chega no painel do Danilo. ")
          +"Depois continue trabalhando la e salve o endereco nos favoritos: "+RADAR_NOVO_CURTO})
      ]),
      el("button",{class:"btn-alerta",onclick:transferirParaRadarNovo},[document.createTextNode(n? "Salvar "+n+" marcacao(oes) e abrir o Radar novo" : "Abrir o Radar novo")])
    ]);
  }
  var travado = (DIAG.leituraOk===false) || (DIAG.escritaOk===false) || FILA.length>0;
  if(!travado) return null;
  var det=[];
  if(FILA.length) det.push(FILA.length+" marcacao(oes) ainda nao subiram");
  if(DIAG.escritaErro) det.push("ao salvar: "+DIAG.escritaErro);
  if(DIAG.leituraErro) det.push("ao ler: "+DIAG.leituraErro);
  return el("div",{class:"alerta"},[
    el("div",{style:"min-width:0"},[
      el("b",{text:"O que voce marcar nao esta chegando no painel do Danilo."}),
      el("div",{class:"det",text:det.join(" · ") || "sem resposta do banco"})
    ]),
    el("button",{class:"btn-alerta",onclick:function(){
      var n=reenviarTudo();
      if(window.console) console.log("[radar] reenviando "+n+" registros");
    }},[document.createTextNode("Reenviar agora")])
  ]);
}

/* ---------- aviso: tabela "leads" da nuvem atrasada ----------
   Quem pode agir nisso e o gestor (limpar ou atualizar a tabela), entao so ele
   ve o aviso. O vendedor nao precisa saber: a fila dele ja vem certa pela uniao.
   O que nao pode e a nuvem trocar a lista em silencio, como acontecia. */
function avisoLeads(){
  if(!STATE.vend || !STATE.vend.gestor) return null;
  if(DIAG.leadsFonte==="erro"){
    return el("div",{class:"alerta"},[
      el("div",{style:"min-width:0"},[
        el("b",{text:"Nao consegui ler a tabela de leads da nuvem."}),
        el("div",{class:"det",text:(DIAG.leadsErro||"sem resposta")+
          " \u00b7 a lista publicada no artifact esta valendo"})
      ])
    ]);
  }
  if(DIAG.leadsFonte!=="nuvem+embutida") return null;
  if(!DIAG.leadsNuvemData || !DIAG.leadsEmbutidaData) return null;
  if(!(DIAG.leadsNuvemData < DIAG.leadsEmbutidaData)) return null;
  return el("div",{class:"alerta"},[
    el("div",{style:"min-width:0"},[
      el("b",{text:"A tabela \"leads\" da nuvem esta atrasada."}),
      el("div",{class:"det",text:
        "Ultima remessa na nuvem: "+DIAG.leadsNuvemData+
        " \u00b7 no artifact: "+DIAG.leadsEmbutidaData+
        " \u00b7 "+DIAG.leadsNuvemLinhas+" linha(s) lidas, "+DIAG.leadsSoDaNuvem+
        " so existem la. A lista do artifact esta valendo. Esvaziar a tabela na nuvem faz este aviso sumir."})
    ])
  ]);
}

/* ---------- aviso ao VENDEDOR: a pagina aberta e de um dia anterior ----------
   Duas coisas fazem isso acontecer: o pin da versao compartilhada nao foi
   movido, ou o navegador serviu o JS do cache. Nos dois casos o vendedor via
   uma lista velha e nao tinha como saber - em 09/09 isso custou uma manha.
   Agora quem esta com a tela errada e avisado na propria tela, com a saida. */
function avisoListaVelha(){
  if(!STATE.vend || STATE.vend.gestor) return null;
  var d = new Date(), dia = d.getDay();      /* 0=domingo, 6=sabado */
  if(dia===0 || dia===6) return null;        /* fim de semana nao tem remessa */
  var ult = ultimaData();
  if(!ult || ult >= dataLocal()) return null;
  return el("div",{class:"alerta"},[
    el("div",{style:"min-width:0"},[
      el("b",{text:"Esta lista e do dia "+ult.split("-").reverse().join("/")+", nao e a de hoje."}),
      el("div",{class:"det",text:"Se a remessa de hoje ja saiu, voce esta com uma versao antiga da pagina. "+
        "Recarregue segurando Ctrl e Shift e apertando R (no celular, feche a aba e abra de novo). "+
        "Se continuar assim depois de recarregar, avise o Danilo: pode ser o pin da versao compartilhada."})
    ])
  ]);
}

/* ---------- painel de diagnostico (so o gestor ve) ---------- */
function painelDiagnostico(main){
  var p=el("div",{class:"panel"},[
    el("h2",{text:"Sincronizacao"}),
    el("p",{class:"hint",text:"Se o numero de registros lidos do banco estiver em zero enquanto o time trabalha, o problema e aqui - nao e o time."})
  ]);
  function linha(rot,val,tom){
    p.appendChild(el("div",{style:"display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line-soft)"},[
      el("span",{text:rot,style:"color:var(--text-2)"}),
      el("span",{class:"mono",text:val,style:tom?("color:"+tom+";font-weight:600"):""})
    ]));
  }
  var okc="var(--ok)", ruim="var(--quente)";
  linha("Leitura do banco",
        DIAG.leituraOk===null?"ainda nao tentou":(DIAG.leituraOk?("ok as "+DIAG.lidoAs):("FALHOU - "+DIAG.leituraErro)),
        DIAG.leituraOk===null?"":(DIAG.leituraOk?okc:ruim));
  linha("Registros vindos do banco", String(DIAG.linhas), DIAG.linhas?okc:ruim);
  linha("Ultimo envio",
        DIAG.escritaOk===null?"nada enviado nesta sessao":(DIAG.escritaOk?("ok as "+DIAG.enviadoAs):("FALHOU - "+DIAG.escritaErro)),
        DIAG.escritaOk===null?"":(DIAG.escritaOk?okc:ruim));
  linha("Na fila para subir", String(FILA.length), FILA.length?ruim:okc);
  linha("Historico de toques (tabela historico)",
        HIST.ok===null?"le ao abrir a aba Historico":(HIST.ok?((HIST.linhas||[]).length+" registros, lido as "+HIST.lidoAs):("FALHOU - "+HIST.erro)),
        HIST.ok===null?"":(HIST.ok?okc:ruim));
  linha("Ultimo registro de toque",
        DIAG.histEscritaOk===null?"nenhum toque nesta sessao":(DIAG.histEscritaOk?("ok as "+DIAG.histEnviadoAs):("FALHOU - "+DIAG.histEscritaErro)),
        DIAG.histEscritaOk===null?"":(DIAG.histEscritaOk?okc:ruim));
  linha("Toques na fila", String(FILA_H.length), FILA_H.length?ruim:okc);
  linha("Versao desta pagina", VERSAO_RADAR);

  var porV=el("div",{style:"margin-top:12px"});
  porV.appendChild(el("div",{class:"eyebrow",text:"Registros por vendedor",style:"margin-bottom:6px"}));
  STATE.equipe.forEach(function(pp){
    if(pp.gestor) return;
    var m=STATE.atividade[pp.id]||{};
    var tot=0,hoje=0,k;
    for(k in m){ if(m[k]&&m[k].s){ tot++; if(m[k].d===HOJE) hoje++; } }
    porV.appendChild(el("div",{style:"display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line-soft)"},[
      el("span",{text:pp.nome+(pp.inativo?" (fora do time)":"")}),
      el("span",{class:"mono",text:hoje+" hoje · "+tot+" no total",style:tot?"":"color:var(--text-3)"})
    ]));
  });
  p.appendChild(porV);

  p.appendChild(el("div",{style:"display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"},[
    el("button",{class:"btn-alerta",onclick:function(){ sincronizar().then(function(){ render(); }); }},
      [document.createTextNode("Reler o banco agora")]),
    el("button",{class:"btn-alerta",onclick:function(){ reenviarTudo(); }},
      [document.createTextNode("Reenviar tudo que esta nesta maquina")])
  ]));
  main.appendChild(p);

  /* receber o que um vendedor exportou de uma pagina sem acesso ao banco */
  var imp = el("textarea",{class:"resgate-txt",placeholder:"Cole aqui o texto que o vendedor mandou..."});
  var msg = el("div",{style:"font-size:12.5px;color:var(--text-2);margin-top:8px"});
  var pi = el("div",{class:"panel"},[
    el("h2",{text:"Receber marcacoes de um vendedor"}),
    el("p",{class:"hint",text:"Quando a pagina do vendedor nao alcanca o banco, ele copia um texto e manda para voce. Cole aqui e as marcacoes entram no sistema no nome dele."}),
    imp,
    el("div",{style:"margin-top:10px"},[
      el("button",{class:"btn-alerta",onclick:function(){
        var t=(imp.value||"").trim();
        if(!t){ msg.textContent="Cole o texto primeiro."; return; }
        var dados=null;
        try{ dados=JSON.parse(t); }catch(e){ msg.textContent="Texto invalido - peca para ele copiar de novo, inteiro."; return; }
        var itens = dados && dados.itens ? dados.itens : (dados instanceof Array ? dados : null);
        if(!itens || !itens.length){ msg.textContent="Nao achei marcacoes nesse texto."; return; }
        var n=0;
        itens.forEach(function(x){
          if(!x || !x.vend || !x.lead) return;
          var m = STATE.atividade[x.vend] || (STATE.atividade[x.vend]={});
          m[x.lead] = { s:x.s||null, m:x.m||null, d:x.d||null, o:x.o||null };
          espelhoLocal(x.vend);
          FILA = FILA.filter(function(y){ return !(y.vend===x.vend && y.lead===x.lead); });
          FILA.push({ vend:x.vend, lead:x.lead, s:x.s||null, m:x.m||null, d:x.d||null, o:x.o||null });
          n++;
        });
        gravarFila(); escoar();
        msg.textContent = n+" marcacao(oes) recebidas e enviadas para o banco. Confira acima em alguns segundos.";
        imp.value="";
      }},[document.createTextNode("Receber e enviar ao banco")])
    ]),
    msg
  ]);
  main.appendChild(pi);
}

/* ---------- shell ---------- */
function shell(){
  var v=STATE.vend;
  var meus=meusLeads();
  var nFup=meus.filter(function(l){return precisaFollowup(donoDoLead(l),l.id)}).length;
  var nNovos=meus.filter(function(l){return statusDe(donoDoLead(l),l.id)==="novo"}).length;

  var abas=[
    ["leads",v.gestor?"Todos os leads":"Meus leads",nNovos],
    ["followups","Follow-ups",nFup],
    v.gestor?["ranking","Ranking",null]:["resumo","Resumo do dia",null],
    ["scripts","Scripts",null]
  ];
  if(v.gestor){ abas.push(["gerencial","Gerencial",null]); abas.push(["historico","Histórico",null]); }

  var nav=el("nav",{class:"rail"},[
    el("div",{class:"brand"},[el("span",{class:"dot"}),el("b",{text:"Radar Comercial"})])
  ]);
  abas.forEach(function(a){
    nav.appendChild(el("button",{class:"navbtn","aria-current":STATE.view===a[0]?"true":"false",
      onclick:function(){STATE.view=a[0];STATE.aberto=null;render();window.scrollTo(0,0);}},[
      el("span",{class:"ic",html:ICONES[a[0]]||""}),
      el("span",{text:a[1]}),
      a[2]?el("span",{class:"n",text:String(a[2])}):null
    ]));
  });
  nav.appendChild(el("div",{class:"rail-foot"},[
    el("div",{class:"syncbar"},[
      el("span",{class:"syncdot"}),
      el("span",{id:"sync",text:"tudo salvo","data-s":STATE.sync})
    ]),
    el("button",{class:"whoami",title:"Trocar de usuario",onclick:function(){
      STATE.vend=null;try{localStorage.removeItem("radar_vend")}catch(e){}render();
    }},[
      el("span",{class:"av",style:"background:"+corDe(v.id),text:iniciais(v.nome)}),
      el("span",{style:"min-width:0"},[el("div",{class:"nm",text:v.nome}),
        el("div",{class:"rl",text:v.gestor?"Gestor · trocar":"Comercial · trocar"})])
    ])
  ]));

  var main=el("main");
  var aviso=avisoSync(); if(aviso) main.appendChild(aviso);
  var avLeads=avisoLeads(); if(avLeads) main.appendChild(avLeads);
  var avVelha=avisoListaVelha(); if(avVelha) main.appendChild(avVelha);
  var resg=caixaResgate(); if(resg) main.appendChild(resg);

  if(STATE.view==="leads") viewLeads(main);
  else if(STATE.view==="followups") viewFollowups(main);
  else if(STATE.view==="ranking") viewRanking(main);
  else if(STATE.view==="scripts") viewScripts(main);
  else if(STATE.view==="resumo") viewResumo(main);
  else if(STATE.view==="gerencial"){ viewGerencial(main); painelDiagnostico(main); }
  else if(STATE.view==="historico"){ if(v.gestor) viewHistorico(main); else viewLeads(main); }
  else if(STATE.view==="admin") viewAdmin(main);

  return el("div",{id:"app"},[nav,main]);
}

/* ---------- VIEW: meus leads ---------- */
function viewLeads(main){
  var v=STATE.vend, meus=meusLeads();
  var reps=ativos();
  var cota, feitos;
  if(v.gestor){
    cota=reps.reduce(function(a,p){return a+(p.cota||50)},0)||1;
    feitos=reps.reduce(function(a,p){return a+contatadosHoje(p.id)},0);
  } else {
    cota=v.cota||50;
    feitos=contatadosHoje(v.id);
  }
  var pct=Math.min(100,Math.round(feitos/cota*100));
  var hoje=ultimaData();
  var novosHoje=meus.filter(function(l){
    return String(l.loteData||"")===hoje && statusDe(donoDoLead(l),l.id)==="novo"; }).length;

  main.appendChild(el("div",{class:"page-head"},[
    el("div",{},[
      el("h1",{text:v.gestor?"Todos os leads":"Meus leads"}),
      el("p",{text:v.gestor
        ? ("Visão do time inteiro. Remessa de hoje: "+novosHoje+" leads ainda não trabalhados, de "+meus.length+" na base. O nome do vendedor responsável aparece em cada linha.")
        : ("Remessa de hoje: "+novosHoje+" leads novos. Seu objetivo em cada um é marcar 20 minutinhos entre o dono e o Danilo — você não apresenta valor.")})
    ]),
    el("div",{class:"quota"},[
      el("div",{},[el("div",{class:"eyebrow",text:"Hoje"}),
        el("div",{class:"big"},[document.createTextNode(String(feitos)),el("s",{text:" / "+cota})])]),
      el("div",{class:"bar"},[el("i",{class:pct>=100?"done":"",style:"width:"+pct+"%"})])
    ])
  ]));

  var filtros=[["hoje","Remessa de hoje"],["novo","Não contatados"],["A","Quentes"],
               ["andamento","Em andamento"],["reuniao","Reuniões"],["todos","Todos"]];
  var fr=el("div",{class:"filters"});
  filtros.forEach(function(f){
    fr.appendChild(el("button",{class:"chip","aria-pressed":STATE.filtro===f[0]?"true":"false",
      onclick:function(){STATE.filtro=f[0];render()}},[document.createTextNode(f[1])]));
  });
  fr.appendChild(el("input",{class:"search",type:"text",placeholder:"Buscar empresa ou nicho…",
    value:STATE.busca,oninput:function(e){STATE.busca=e.target.value;desenharLista(lista,v);}}));
  main.appendChild(fr);

  var lista=el("div",{class:"rows"});
  main.appendChild(lista);
  desenharLista(lista,v);
}

function filtrar(arr){
  var f=STATE.filtro,b=STATE.busca.trim().toLowerCase(),hoje=ultimaData();
  return arr.filter(function(l){
    /* o lead aberto continua visivel mesmo depois de classificado,
       para o vendedor ver a confirmacao antes de fechar */
    if(l.id===STATE.aberto) return true;
    var s=statusDe(donoDoLead(l),l.id);
    if(f==="hoje"&&(String(l.loteData||"")!==hoje||s!=="novo")) return false;
    if(f==="novo"&&s!=="novo") return false;
    if(f==="A"&&l.prio!=="A") return false;
    if(f==="andamento"&&ABERTOS.indexOf(s)<0) return false;
    if(f==="reuniao"&&s!=="reuniao"&&s!=="fechado") return false;
    if(b){
      var hay=(l.empresa+" "+(l.nicho||"")+" "+(l.cidade||"")).toLowerCase();
      if(hay.indexOf(b)<0) return false;
    }
    return true;
  });
}
function desenharLista(cont,v){
  cont.innerHTML="";
  var arr=ordenar(filtrar(meusLeads()));
  if(!arr.length){
    var msg="Nenhum lead com esse filtro. Troque o filtro acima.";
    if(STATE.filtro==="hoje") msg="Você já trabalhou toda a remessa de hoje. Vá para Follow-ups, ou mude o filtro para “Não contatados” e pegue leads dos dias anteriores.";
    cont.appendChild(el("div",{class:"empty",text:msg}));
    return;
  }
  arr.slice(0,200).forEach(function(l){cont.appendChild(linha(l,v));});
  if(arr.length>200) cont.appendChild(el("div",{class:"empty",
    text:"Mostrando 200 de "+arr.length+". Use a busca ou os filtros para achar o resto."}));
}

function linha(l,v){
  var dono=donoDoLead(l);
  var st=statusDe(dono,l.id), aberto=STATE.aberto===l.id;
  var reg=regDe(dono,l.id)||{};
  var mot=reg.m?MOTIVO_POR_ID[reg.m]:null;
  var feito=st!=="novo";
  var row=el("div",{class:"row "+(l.prio||"C")+(feito&&!aberto?" feito":"")});

  var meta=(l.nicho||"")+(l.cidade?" · "+l.cidade:"");
  if(v.gestor) meta+=" · "+nomeVend(dono);
  var herd=historicoOutro(l,dono);
  if(herd) meta+=" · JA TRABALHADO POR "+nomeVend(herd.vend).toUpperCase();
  var venc=vencimento(reg);
  if(reg.d){
    meta+=" · falou dia "+dataBR(reg.d);
    if(venc) meta+=(diasDesde(venc)>=0?" · FOLLOW-UP VENCEU "+dataBR(venc)
                                      :" · próximo toque "+dataBR(venc));
  }

  row.appendChild(el("button",{class:"rhead","aria-expanded":aberto?"true":"false",
    onclick:function(){STATE.aberto=aberto?null:l.id;render();}},[
    el("div",{style:"min-width:0"},[
      el("div",{class:"rtitle"},[
        el("b",{text:l.empresa}),
        el("span",{class:"meta",text:meta})
      ]),
      el("div",{class:"gancho",text:l.gancho||""})
    ]),
    el("div",{class:"rside"},[
      mot?el("span",{class:"tagmot",text:mot.rot}):null,
      el("span",{class:"tag "+(l.prio||"C"),text:l.prio==="A"?"Quente":l.prio==="B"?"Morno":"Frio"}),
      el("span",{class:"pill "+STATUS[st].k,text:STATUS[st].r})
    ])
  ]));

  if(aberto) row.appendChild(corpo(l,dono,st));
  return row;
}

/* ---------- VIEW: ranking ---------- */
function estatVend(p){
  var m=STATE.atividade[p.id]||{}, k, r;
  var s={contatados:0,hoje:0,respostas:0,reunioes:0,fechados:0,abertos:0};
  for(k in m){ r=m[k]; if(!r||!r.s||r.s==="novo") continue;
    s.contatados++;
    if(r.d===HOJE) s.hoje++;
    if(["conversa","reuniao","proposta","fechado"].indexOf(r.s)>=0) s.respostas++;
    if(r.s==="reuniao") s.reunioes++;
    if(r.s==="fechado") s.fechados++;
    if(ABERTOS.indexOf(r.s)>=0) s.abertos++;
  }
  s.taxa=s.contatados?s.respostas/s.contatados:0;
  s.conv=s.contatados?s.fechados/s.contatados:0;
  return s;
}
function viewRanking(main){
  main.appendChild(el("div",{class:"page-head"},[el("div",{},[

    el("p",{text:"Ordenado por reuniões marcadas — é isso que o vendedor entrega. Volume de mensagem sozinho não sobe ninguém aqui."})
  ])]));
  var reps=ativos();
  var linhas=reps.map(function(p){return {p:p,s:estatVend(p)}});
  linhas.sort(function(a,b){

function viewGerencial(main){
  main.appendChild(el("div",{class:"page-head"},[el("div",{},[
    el("h1",{text:"Painel gerencial"}),
    el("p",{text:"Visao consolidada do time: onde o pipeline esta parado e quais nichos estao respondendo."})
  ])]));

  var leads=todosLeads();
  /* inclui quem saiu: o lead que ele trabalhou nao pode voltar a contar
     como "novo" so porque a pessoa deixou o time */
  var reps=todosVend();
  var agreg={}, k, kk;
  ORDEM_ST.forEach(function(s){agreg[s]=0});
  var porNicho={};
  leads.forEach(function(l){
    var st="novo", i;
    for(i=0;i<reps.length;i++){ var r=regDe(reps[i].id,l.id); if(r&&r.s){st=r.s;break;} }
    agreg[st]=(agreg[st]||0)+1;
    var n=l.nicho||"Outros";
    if(!porNicho[n])porNicho[n]={t:0,c:0,resp:0,f:0};
    porNicho[n].t++;
    if(st!=="novo")porNicho[n].c++;
    if(st==="fechado")porNicho[n].f++;
    if(["conversa","reuniao","proposta","fechado"].indexOf(st)>=0)porNicho[n].resp++;
  });

  var emAberto=agreg.conversa+agreg.reuniao+agreg.proposta;
  var contatados=0; ORDEM_ST.forEach(function(s){if(s!=="novo")contatados+=agreg[s]});

  main.appendChild(el("div",{class:"stats"},[
    stat("Base disponivel",String(leads.length),"leads com anuncio ativo"),
    stat("Ja trabalhados",String(contatados),leads.length?Math.round(contatados/leads.length*100)+"% da base":"—"),
    stat("Pipeline aberto",String(emAberto),"R$ "+(emAberto*TICKET).toLocaleString("pt-BR")+" se todos fecharem"),
    stat("Fechados",String(agreg.fechado),"R$ "+(agreg.fechado*TICKET).toLocaleString("pt-BR")+"/mes recorrente")
  ]));

  var pf=el("div",{class:"panel"},[
    el("h2",{text:"Funil"}),
    el("p",{class:"hint",text:"Onde os leads estao parados. Um numero alto em '1o contato feito' com pouco em 'Em conversa' significa que a mensagem de abertura precisa mudar."})
  ]);
  var maxv=Math.max.apply(null,ORDEM_ST.map(function(s){return agreg[s]}).concat([1]));
  ORDEM_ST.forEach(function(s){
    if(!agreg[s]&&s!=="novo") return;
    pf.appendChild(el("div",{style:"display:grid;grid-template-columns:132px 1fr 44px;gap:10px;align-items:center;margin-bottom:5px"},[
      el("span",{style:"font-size:12.5px;color:var(--text-2)",text:STATUS[s].r}),
      el("div",{class:"trackbar",style:"height:14px;border-radius:3px"},[
        el("i",{style:"width:"+Math.round(agreg[s]/maxv*100)+"%;background:"+
          (s==="fechado"?"var(--ok)":s==="perdido"||s==="bloqueado"?"var(--text-3)":"var(--accent)")})]),
      el("span",{class:"mono",style:"font-size:12.5px;text-align:right",text:String(agreg[s])})
    ]));
  });
  main.appendChild(pf);

  var nichos=Object.keys(porNicho).map(function(n){return [n,porNicho[n]]})
    .filter(function(x){return x[1].c>0}).sort(function(a,b){return b[1].resp/b[1].c-a[1].resp/a[1].c});
  var pn=el("div",{class:"panel"},[
    el("h2",{text:"Quais nichos estao respondendo"}),
    el("p",{class:"hint",text:"So aparecem nichos ja trabalhados. Concentre a proxima remessa nos tres do topo."})
  ]);
  if(!nichos.length){
    pn.appendChild(el("div",{class:"empty",text:"Ninguem contatou ninguem ainda. Volte quando o time comecar."}));
  } else {
    var tb=el("table");
    tb.appendChild(el("thead",{},[el("tr",{},[el("th",{text:"Nicho"}),
      el("th",{class:"num",text:"Base"}),el("th",{class:"num",text:"Trabalhados"}),
      el("th",{class:"num",text:"Avancaram"}),el("th",{class:"num",text:"Fechados"})])]));
    var tbd=el("tbody");
    nichos.slice(0,14).forEach(function(x){
      tbd.appendChild(el("tr",{},[el("td",{text:x[0]}),
        el("td",{class:"num",text:String(x[1].t)}),el("td",{class:"num",text:String(x[1].c)}),
        el("td",{class:"num",text:String(x[1].resp)}),
        el("td",{class:"num",style:x[1].f?"color:var(--ok);font-weight:600":"",text:String(x[1].f)})]));
    });
    tb.appendChild(tbd);
    pn.appendChild(el("div",{class:"tablewrap"},[tb]));
  }
  main.appendChild(pn);

  /* ----- Por que os leads nao avancam: o relatorio de objecoes ----- */
  var cont={}, totalClass=0;
  STATE.equipe.forEach(function(p){
    var mm=STATE.atividade[p.id]||{}, k, r;
    for(k in mm){ r=mm[k]; if(r&&r.m){ cont[r.m]=(cont[r.m]||0)+1; totalClass++; } }
  });
  var objs=MOTIVOS.filter(function(m){return m.g==="Objeção"&&cont[m.id];})
                  .sort(function(a,b){return cont[b.id]-cont[a.id];});
  var totalObj=objs.reduce(function(a,m){return a+cont[m.id]},0);

  var po=el("div",{class:"panel"},[
    el("h2",{text:"Por que os leads não avançam"}),
    el("p",{class:"hint",text:"Cada vez que um vendedor classifica um contato, entra aqui. No fim do mês isso te diz onde a operação está travando: se é preço, se é o lead que não responde, ou se estão pedindo algo que você ainda não vende."})
  ]);

  if(!totalClass){
    po.appendChild(el("div",{class:"empty",
      text:"Nenhum contato classificado ainda. Assim que o time começar a marcar os botões, o retrato aparece aqui."}));
  } else {
    if(objs.length){
      po.appendChild(el("div",{class:"stats",style:"margin-bottom:14px"},[
        stat("Principal objeção",objs[0].rot,
          cont[objs[0].id]+" de "+totalObj+" objeções ("+Math.round(cont[objs[0].id]/totalObj*100)+"%)"),
        stat("Contatos classificados",String(totalClass),"em "+mesAtual()),
        stat("Viraram objeção",totalClass?Math.round(totalObj/totalClass*100)+"%":"—",
          totalObj+" de "+totalClass+" contatos")
      ]));
    }
    var maxc=Math.max.apply(null,MOTIVOS.map(function(m){return cont[m.id]||0}).concat([1]));
    var barras=el("div",{class:"barras"});
    GRUPOS_MOTIVO.forEach(function(g){
      var doG=MOTIVOS.filter(function(m){return m.g===g&&cont[m.id];})
                     .sort(function(a,b){return cont[b.id]-cont[a.id];});
      if(!doG.length) return;
      barras.appendChild(el("div",{class:"eyebrow",style:"margin-top:9px",text:g}));
      doG.forEach(function(m){
        var c=m.g==="Ganhou"?"var(--ok)":m.g==="Objeção"?"var(--morno)":
              m.g==="Descarte"?"var(--text-3)":"var(--accent)";
        barras.appendChild(el("div",{class:"barra"},[
          el("span",{text:m.rot}),
          el("div",{class:"trackbar",style:"height:13px;border-radius:3px"},[
            el("i",{style:"width:"+Math.round(cont[m.id]/maxc*100)+"%;background:"+c})]),
          el("span",{text:String(cont[m.id])})
        ]));
      });
    });
    po.appendChild(barras);
    if(cont.pediu_site) po.appendChild(el("div",{class:"porque",style:"margin-top:14px"},[
      el("b",{text:"Sinal de oportunidade"}),
      el("span",{text:cont.pediu_site+" lead(s) pediram site ou landing page. Se isso continuar subindo, vale considerar vender isso junto — o lead já está com a carteira aberta e você está mandando ele pra outro fornecedor."})
    ]));
  }
  main.appendChild(po);

  /* ----- Passagem de bastao -----
     Vale para qualquer troca de dono, nao so para quem saiu do time: todo
     remanejo deixa leads que o dono anterior ja tinha trabalhado, e sem
     esta lista a empresa recebe a mesma abordagem de duas pessoas. */
  var idsFora={}; exVend().forEach(function(p){ idsFora[p.id]=true; });
  var herdados=[];
  leads.forEach(function(l){
    Object.keys(STATE.atividade||{}).forEach(function(vid){
      if(vid===l.vend || vid==="gestor") return;
      var r=(STATE.atividade[vid]||{})[l.id];
      if(r&&r.s&&r.s!=="novo")
        herdados.push({l:l,de:nomeVend(vid),saiu:!!idsFora[vid],reg:r});
    });
  });
  if(herdados.length){
    herdados.sort(function(a,b){
      var pa=ABERTOS.indexOf(a.reg.s)>=0?0:1, pb=ABERTOS.indexOf(b.reg.s)>=0?0:1;
      if(pa!==pb) return pa-pb;
      return String(a.l.empresa).localeCompare(String(b.l.empresa),"pt");
    });
    var abertosH=herdados.filter(function(x){return ABERTOS.indexOf(x.reg.s)>=0;}).length;
    var porNovoDono={};
    herdados.forEach(function(x){ var n=nomeVend(x.l.vend);
      porNovoDono[n]=(porNovoDono[n]||0)+1; });
    var topDono=Object.keys(porNovoDono).sort(function(a,b){
      return porNovoDono[b]-porNovoDono[a]; })[0];

    var ph=el("div",{class:"panel"},[
      el("h2",{text:"Passagem de bastao"}),
      el("p",{class:"hint",text:"Leads que trocaram de dono depois de ja terem sido trabalhados. O novo vendedor ve um aviso no cartao antes de mandar mensagem, mas quem estava em conversa ou com reuniao marcada merece um alinhamento seu antes do proximo toque."})
    ]);
    ph.appendChild(el("div",{class:"stats",style:"margin-bottom:14px"},[
      stat("Leads herdados",String(herdados.length),"trocaram de dono ja trabalhados"),
      stat("Ainda em aberto",String(abertosH),"precisam de alinhamento antes do proximo toque"),
      stat("Quem mais herdou",topDono||"—",porNovoDono[topDono]+" leads na fila dele(a)")
    ]));
    var th=el("table");
    th.appendChild(el("thead",{},[el("tr",{},[
      el("th",{text:"Empresa"}),el("th",{text:"Quem trabalhou"}),el("th",{text:"Situacao"}),
      el("th",{text:"Fila de agora"}),el("th",{text:"Ultimo toque"})
    ])]));
    var tbh=el("tbody");
    herdados.slice(0,80).forEach(function(x){
      tbh.appendChild(el("tr",{},[
        el("td",{},[el("div",{style:"font-weight:600",text:x.l.empresa}),
          el("div",{style:"font-size:11px;color:var(--text-3)",text:x.l.nicho||""})]),
        el("td",{},[el("div",{text:x.de}),
          x.saiu?el("div",{style:"font-size:11px;color:var(--text-3)",text:"saiu do time"}):null]),
        el("td",{},[el("span",{class:"pill "+STATUS[x.reg.s].k,text:STATUS[x.reg.s].r})]),
        el("td",{text:nomeVend(x.l.vend)}),
        el("td",{class:"mono",style:"font-size:12px",text:x.reg.d?dataBR(x.reg.d):"—"})
      ]));
    });
    th.appendChild(tbh);
    ph.appendChild(el("div",{class:"tablewrap"},[th]));
    if(herdados.length>80) ph.appendChild(el("p",{class:"hint",

    main.appendChild(ph);
  }
}

/* Uma chave recusada nao pode derrubar o time: tenta a outra uma vez. */
function sbPedir(caminho, opts){

   marcacoes ficaram presas aqui e nunca chegaram no painel do gestor. */
function reenviarTudo(){
  var v = STATE.vend; if(!v) return 0;
  var alvos = v.gestor ? Object.keys(STATE.atividade||{}) : [v.id];
  var n = 0;
  alvos.forEach(function(vid){
    var m = STATE.atividade[vid] || {};
    Object.keys(m).forEach(function(leadId){
      var r = m[leadId]; if(!r || !r.s) return;
      FILA = FILA.filter(function(x){ return !(x.vend===vid && x.lead===leadId); });
      FILA.push({ vend:vid, lead:leadId, s:r.s||null, m:r.m||null, d:r.d||null, o:r.o||null });
      n++;
    });
  });
  gravarFila();
  escoar();
  pedirRender();
  return n;
}

var ESCOANDO = false;
function escoar(){
  if(ESCOANDO || !FILA.length) return;
  if(!sbConfigurado()){ STATE.sync = "offline"; pintarSync(); return; }
  if(typeof navigator !== "undefined" && navigator.onLine === false){
    STATE.sync = "pendente"; pintarSync(); return;
  }
  ESCOANDO = true;
  var lote = FILA.slice(0, 50);
  STATE.sync = "enviando"; pintarSync();
  sbPedir("atividade", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(lote)
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + " " + t); });
    var chaves = {};
    lote.forEach(function(x){ chaves[x.vend+" "+x.lead] = 1; });
    FILA = FILA.filter(function(x){ return !chaves[x.vend+" "+x.lead]; });
    gravarFila();
    ESCOANDO = false;
    DIAG.escritaOk = true; DIAG.escritaErro = ""; DIAG.enviadoAs = horaAgora();
    STATE.sync = FILA.length ? "pendente" : "ok";
    pintarSync();
    if(FILA.length) escoar();
  }).catch(function(e){
    ESCOANDO = false;
    DIAG.escritaOk = false; DIAG.escritaErro = e.message;
    STATE.sync = "pendente"; pintarSync();
    if(window.console && console.warn) console.warn("[radar] nao consegui enviar agora: " + e.message);
  });
}

function carregarNuvem(){
  if(!sbConfigurado()) return Promise.resolve(false);
  /* paginado: o Supabase corta em 1000 linhas por pedido */
  return sbTudo("atividade?select=vend,lead,s,m,d,o&order=vend.asc,lead.asc")
    .then(function(linhas){
      var mapa = {};
      /* comeca do que ja existe na maquina: o banco COMPLETA, nunca apaga.
         Sem isto, um registro que nunca subiu some da tela na primeira
         leitura da nuvem e o vendedor perde o trabalho do dia. */
      Object.keys(STATE.atividade||{}).forEach(function(vid){
        mapa[vid] = Object.assign({}, STATE.atividade[vid]);
      });
      (linhas||[]).forEach(function(x){
        var m = mapa[x.vend] || (mapa[x.vend] = {});
        m[x.lead] = linhaParaReg(x);
      });
      /* o que ainda esta na fila e mais novo que o banco: preserva */
      FILA.forEach(function(x){
        var m = mapa[x.vend] || (mapa[x.vend] = {});
        m[x.lead] = linhaParaReg(x);
      });
      STATE.atividade = mapa;
      Object.keys(mapa).forEach(function(vid){ espelhoLocal(vid); });
      DIAG.leituraOk = true; DIAG.leituraErro = "";
      DIAG.linhas = (linhas||[]).length; DIAG.lidoAs = horaAgora();
      STATE.sync = FILA.length ? "pendente" : "ok";
      return true;
    })
    .catch(function(e){
      STATE.sync = "pendente";
      DIAG.leituraOk = false; DIAG.leituraErro = e.message; DIAG.lidoAs = horaAgora();
      if(window.console && console.warn) console.warn("[radar] leitura falhou, usando copia local: " + e.message);
      return false;
    });
}

function carregarLeadsNuvem(){
  if(!sbConfigurado()) return Promise.resolve(false);
  return sbPedir("leads?select=*&order=remessa.desc")
    .then(function(r){ if(!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(function(linhas){
      DIAG.leadsNuvemLinhas = (linhas||[]).length;
      if(!linhas || !linhas.length){ DIAG.leadsFonte="embutida"; return false; }
      var daNuvem = linhas.map(function(x){
        return { id:x.id, empresa:x.empresa, nicho:x.nicho, cidade:x.cidade,
                 ig:x.ig, wa:x.wa, pageId:x.page_id, gancho:x.gancho,
                 prio:x.prio, oferta:x.oferta, vend:x.vend,
                 loteData: String(x.remessa||"").slice(0,10) };
      });
      function maiorData(arr){
        var d=""; (arr||[]).forEach(function(l){
          var v=String((l&&l.loteData)||""); if(v>d) d=v; }); return d;
      }
      DIAG.leadsNuvemData    = maiorData(daNuvem);
      DIAG.leadsEmbutidaData = maiorData(LEADS_EMBUTIDOS);
      /* O banco COMPLETA a lista embutida, nunca a substitui - a mesma regra
         que ja vale para a atividade. Antes ele substituia: uma tabela "leads"
         atrasada apagava a remessa recem-publicada e o time abria o dia com
         zero lead novo, sem nenhum aviso na tela. */
      var idsEmb={}; LEADS_EMBUTIDOS.forEach(function(l){ if(l&&l.id) idsEmb[l.id]=1; });
      var so=0; daNuvem.forEach(function(l){ if(l&&l.id&&!idsEmb[l.id]) so++; });
      DIAG.leadsSoDaNuvem = so;
      var porId={}, ordem=[];
      function juntar(l){
        if(!l || !l.id) return;
        if(!(l.id in porId)) ordem.push(l.id);
        porId[l.id]=l;
      }
      daNuvem.forEach(juntar);          /* primeiro o que veio da nuvem */
      LEADS_EMBUTIDOS.forEach(juntar);  /* o embutido vence quando o id se repete */
      DIAG.leadsFonte = "nuvem+embutida";
      montarLotes(aplicarRemanejo(ordem.map(function(id){ return porId[id]; })));
      return true;
    })
    .catch(function(e){
      DIAG.leadsFonte="erro"; DIAG.leadsErro=e.message;
      if(window.console && console.warn) console.warn("[radar] tabela leads: "+e.message);
      return false;
    });
}

   como semente pela data da ultima marcacao (11/09/2026), e o que chega
   por outro caminho (importar.html) e completado pela mesma regra.
   ============================================================ */
var FILA_H = [];
var FILA_H_MAX = 5000;
function lerFilaH(){
  try{ FILA_H = JSON.parse(localStorage.getItem("radar_fila_h")||"[]") || []; }catch(e){ FILA_H = []; }
}
function gravarFilaH(){
  if(FILA_H.length > FILA_H_MAX) FILA_H = FILA_H.slice(FILA_H.length - FILA_H_MAX);
  try{ localStorage.setItem("radar_fila_h", JSON.stringify(FILA_H)); }catch(e){}
}
function idEvento(vid, leadId){
  return vid + ":" + leadId + ":" + Date.now().toString(36) + ":" + Math.random().toString(36).slice(2,8);
}
/* Chamado a cada classificacao (salvarReg com status). Um clique = um toque. */
function registrarToque(vid, leadId, reg){
  if(presoNoClaude()) return;          /* nesse endereco nada chega ao banco */
  if(!reg || !reg.s) return;
  FILA_H.push({ ev:idEvento(vid,leadId), vend:vid, lead:leadId,
                s:reg.s||null, m:reg.m||null, d:reg.d||HOJE,
                ts:new Date().toISOString() });
  gravarFilaH();
  escoarH();
}
var ESCOANDO_H = false;
function escoarH(){
  if(ESCOANDO_H || !FILA_H.length) return;
  if(!sbConfigurado()) return;
  if(typeof navigator !== "undefined" && navigator.onLine === false) return;
  ESCOANDO_H = true;
  var lote = FILA_H.slice(0, 50);
  sbPedir("historico?on_conflict=ev", {
    method: "POST",
    headers: { "Prefer": "resolution=ignore-duplicates,return=minimal" },
    body: JSON.stringify(lote)
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + " " + t); });
    var ids = {}; lote.forEach(function(x){ ids[x.ev] = 1; });
    FILA_H = FILA_H.filter(function(x){ return !ids[x.ev]; });
    gravarFilaH();
    ESCOANDO_H = false;
    DIAG.histEscritaOk = true; DIAG.histEscritaErro = ""; DIAG.histEnviadoAs = horaAgora();
    if(FILA_H.length) escoarH();
  }).catch(function(e){
    ESCOANDO_H = false;
    DIAG.histEscritaOk = false; DIAG.histEscritaErro = e.message;
    if(window.console && console.warn) console.warn("[radar] historico: nao consegui registrar agora: " + e.message);
  });
}

/* O Supabase devolve no maximo 1000 linhas por pedido. Sem paginar, a
   partir da milesima marcacao o painel passaria a mostrar menos do que
   existe, sem nenhum aviso. */
function sbTudo(caminho, passo){
  passo = passo || 1000;
  var tudo = [];
  function pagina(ini){
    var fim = ini + passo - 1;
    return sbPedir(caminho, { headers: { "Range-Unit":"items", "Range": ini+"-"+fim } })
      .then(function(r){
        if(r.status === 416) return tudo;
        if(!r.ok) throw new Error(String(r.status));
        return r.json().then(function(linhas){
          linhas = linhas || [];
          tudo = tudo.concat(linhas);
          if(linhas.length < passo) return tudo;
          return pagina(ini + passo);
        });
      });
  }
  return pagina(0);
}

/* ---------- leitura do historico (so o gestor precisa) ---------- */
var HIST = { linhas:null, ok:null, erro:"", lidoAs:"", carregando:false };
function carregarHistorico(){
  if(!sbConfigurado()){ HIST.ok=false; HIST.erro="sem banco configurado"; if(HIST.linhas===null) HIST.linhas=[]; return Promise.resolve(false); }
  if(HIST.carregando) return Promise.resolve(false);
  HIST.carregando = true;
  return sbTudo("historico?select=vend,lead,s,m,d,ts&order=id.asc")
    .then(function(linhas){
      HIST.linhas = linhas || []; HIST.ok = true; HIST.erro = ""; HIST.lidoAs = horaAgora();
      HIST.carregando = false; return true;
    })
    .catch(function(e){
      HIST.carregando = false; HIST.ok = false; HIST.erro = e.message; HIST.lidoAs = horaAgora();
      if(HIST.linhas === null) HIST.linhas = [];
      if(window.console && console.warn) console.warn("[radar] historico: leitura falhou: " + e.message);
      return false;
    });
}

/* Junta os toques registrados com o estado atual da "atividade": marcacao
   sem registro (feita antes da tabela existir, ou vinda do importar.html)
   entra pela data da ultima marcacao. A chave vend|lead|data|status evita
   contar duas vezes. */
function eventosHistorico(){
  var evs = [], chave = {};
  (HIST.linhas||[]).forEach(function(x){
    if(!x || !x.vend || !x.lead || !x.s) return;
    var d = String(x.d||"").slice(0,10) || String(x.ts||"").slice(0,10);
    if(!d) return;
    evs.push({ vend:x.vend, lead:x.lead, s:x.s, m:x.m||null, d:d, ts:x.ts||"", real:true });
    chave[x.vend+"|"+x.lead+"|"+d+"|"+x.s] = 1;
  });
  Object.keys(STATE.atividade||{}).forEach(function(vid){
    var m = STATE.atividade[vid]||{};
    Object.keys(m).forEach(function(leadId){
      var r = m[leadId]; if(!r || !r.s || !r.d) return;
      if(chave[vid+"|"+leadId+"|"+r.d+"|"+r.s]) return;
      evs.push({ vend:vid, lead:leadId, s:r.s, m:r.m||null, d:r.d, ts:"", real:false });
    });
  });
  return evs;
}

/* ---------- periodos ---------- */
var HV = { periodo:"semana", ini:"", fim:"", grupo:"", metrica:"toques" };
function somaDiasLocal(iso, n){ var d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return dataLocal(d); }
function inicioSemana(iso){ var d=new Date(iso+"T12:00:00"); var dia=(d.getDay()+6)%7; d.setDate(d.getDate()-dia); return dataLocal(d); }
function inicioMes(iso){ return iso.slice(0,7)+"-01"; }
function fimMes(iso){ return dataLocal(new Date(+iso.slice(0,4), +iso.slice(5,7), 0, 12)); }
function diasEntre(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000)+1; }
var PERIODOS=[
  ["hoje","Hoje"],["ontem","Ontem"],["semana","Esta semana"],["semana_passada","Semana passada"],
  ["mes","Este mês"],["mes_passado","Mês passado"],["total","Total"],["custom","De / até"]
];
function periodoAtual(evs){
  var p = HV.periodo, ini, fim = HOJE, t;
  if(p==="hoje"){ ini=HOJE; }
  else if(p==="ontem"){ ini=fim=somaDiasLocal(HOJE,-1); }
  else if(p==="semana"){ ini=inicioSemana(HOJE); }
  else if(p==="semana_passada"){ fim=somaDiasLocal(inicioSemana(HOJE),-1); ini=somaDiasLocal(fim,-6); }
  else if(p==="mes"){ ini=inicioMes(HOJE); }
  else if(p==="mes_passado"){ fim=somaDiasLocal(inicioMes(HOJE),-1); ini=inicioMes(fim); }
  else if(p==="total"){ ini=""; evs.forEach(function(e){ if(e.d && (!ini || e.d<ini)) ini=e.d; }); if(!ini) ini=HOJE; }
  else { ini=HV.ini||somaDiasLocal(HOJE,-6); fim=HV.fim||HOJE; if(ini>fim){ t=ini; ini=fim; fim=t; } }
  return { ini:ini, fim:fim };
}
function grupoAuto(ini,fim){
  var n=diasEntre(ini,fim);
  return n<=31?"dia":(n<=140?"semana":"mes");
}
function chaveBucket(d, grupo){
  if(grupo==="mes") return d.slice(0,7);
  if(grupo==="semana") return inicioSemana(d);
  return d;
}
var MESES_CURTO=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var DIAS_CURTO=["dom","seg","ter","qua","qui","sex","sáb"];
function rotuloBucket(k, grupo){
  if(grupo==="mes") return MESES_CURTO[+k.slice(5,7)-1]+"/"+k.slice(2,4);
  if(grupo==="semana") return "sem. "+dataBR(k);
  return DIAS_CURTO[new Date(k+"T12:00:00").getDay()]+" "+dataBR(k);
}
function listaBuckets(ini, fim, grupo){
  var out=[], cur, guard=0;
  if(grupo==="mes"){ cur=inicioMes(ini); while(cur<=fim && guard++<120){ out.push(cur.slice(0,7)); cur=somaDiasLocal(fimMes(cur),1); } }
  else if(grupo==="semana"){ cur=inicioSemana(ini); while(cur<=fim && guard++<400){ out.push(cur); cur=somaDiasLocal(cur,7); } }
  else { cur=ini; while(cur<=fim && guard++<400){ out.push(cur); cur=somaDiasLocal(cur,1); } }
  return out;
}
var RESPOSTA=["conversa","reuniao","proposta","fechado"];
var METRICAS=[
  ["toques","Toques"],["leads","Leads distintos"],["contatos","1º contato"],
  ["respostas","Respostas"],["reunioes","Reuniões"],["fechados","Fechados"]
];
function contadorVazio(){ return {toques:0,contatos:0,followups:0,respostas:0,reunioes:0,fechados:0,perdidos:0,_leads:{},_dias:{}}; }
function somarEvento(c, e){
  c.toques++;
  c._leads[e.lead]=1; c._dias[e.d]=1;
  if(e.s==="contatado" && e.m!=="recepcao") c.contatos++;
  if(e.s==="fup1"||e.s==="fup2") c.followups++;
  if(RESPOSTA.indexOf(e.s)>=0) c.respostas++;
  if(e.s==="reuniao") c.reunioes++;
  if(e.s==="fechado") c.fechados++;
  if(e.s==="perdido"||e.s==="bloqueado") c.perdidos++;
}
function fecharContador(c){
  c.leads=Object.keys(c._leads).length; c.dias=Object.keys(c._dias).length;
  c.mediaDia=c.dias?c.toques/c.dias:0;
  return c;
}

  var pf = el("div",{class:"panel"});
  pf.appendChild(el("p",{class:"hint",style:"margin:0",html:
    "<b>De onde vem o número:</b> "+reais+" toque(s) registrado(s) na tabela de histórico"+(desde?" desde "+dataBR(desde.slice(0,10)):"")+
    (sint?", mais "+sint+" marcação(ões) sem registro contadas pela data da última marcação":"")+
    ". Cada clique de classificação vira um registro novo; nada é sobrescrito."+
    (HIST.lidoAs?" Lido às "+HIST.lidoAs+".":"")+(FILA_H.length?" <b>"+FILA_H.length+" toque(s) desta máquina ainda não subiram.</b>":"")}));
  pf.appendChild(el("div",{class:"acts",style:"margin-top:10px"},[
    el("button",{class:"btn",onclick:function(){ HIST.linhas=null; escoarH(); sincronizar().then(function(){ render(); }); }},[document.createTextNode("Reler agora")])
  ]));
  main.appendChild(pf);
}

/* ---------- boot ---------- */
READY = true;
lerFila();
lerFilaH();
lerEspelho();

function restaurarVend(){
  var id=null; try{ id = localStorage.getItem("radar_vend"); }catch(e){}
  if(!id) return;
  var achado = STATE.equipe.filter(function(p){ return p.id===id; })[0];
  if(achado && achado.inativo){
    try{ localStorage.removeItem("radar_vend"); }catch(e){}
    return;
  }
  if(achado) STATE.vend = achado;
}
restaurarVend();
render();

function sincronizar(){
  var hist = (STATE.vend && STATE.vend.gestor && STATE.view==="historico") ? carregarHistorico() : Promise.resolve(false);
  return Promise.all([carregarNuvem(), hist]).then(function(r){
    var ok = r[0];
    if((ok || r[1]) && !digitando()) render(); else pintarSync();
    return ok;
  });
}
carregarLeadsNuvem().then(function(trocou){
  if(trocou && !digitando()) render();
  return sincronizar();
});

if(typeof window !== "undefined"){
  window.addEventListener("online", function(){ escoar(); escoarH(); });
  setInterval(function(){ if(FILA.length) escoar(); if(FILA_H.length) escoarH(); }, 20000);
  /* se a pagina passar a virada do dia aberta, o contador de hoje vira junto */
  setInterval(function(){
    var h = dataLocal();
    if(h !== HOJE){ HOJE = h; pedirRender(); }
  }, 60000);
  setInterval(function(){ if(!digitando()) sincronizar(); }, 30000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) sincronizar();
  });
}

/* ---------- resumo do dia para mandar no grupo ---------- */
function resumoDoDia(){
  var v = STATE.vend; if(!v) return "";
  var m = STATE.atividade[v.id] || {}, k, r;
  var hoje = { enviadas:0, responderam:0, reunioes:0, semInteresse:0, followups:0 };
  var nomes = { reuniao:[], conversa:[] };
  var mapa = {};
  todosLeads().forEach(function(l){ mapa[l.id] = l.empresa; });
  for(k in m){
    r = m[k]; if(!r || r.d !== HOJE) continue;
    hoje.enviadas++;
    if(["conversa","reuniao","proposta","fechado"].indexOf(r.s) >= 0) hoje.responderam++;
    if(r.s === "reuniao"){ hoje.reunioes++; nomes.reuniao.push(mapa[k]||k); }
    if(r.s === "conversa"){ nomes.conversa.push(mapa[k]||k); }
    if(r.s === "perdido" || r.s === "bloqueado") hoje.semInteresse++;
    if(r.s === "fup1" || r.s === "fup2") hoje.followups++;
  }
  var d = HOJE.split("-");
  var t = "*Resumo do dia — " + v.nome + "*\n" + d[2] + "/" + d[1] + "\n\n";
  t += "Mensagens enviadas: " + hoje.enviadas + "\n";
  t += "Responderam: " + hoje.responderam + "\n";
  t += "Follow-ups feitos: " + hoje.followups + "\n";
  t += "*Reuniões marcadas: " + hoje.reunioes + "*\n";
  t += "Sem interesse: " + hoje.semInteresse + "\n";
  if(nomes.reuniao.length) t += "\n*Reuniões:* " + nomes.reuniao.join(", ") + "\n";
  if(nomes.conversa.length) t += "*Em conversa:* " + nomes.conversa.join(", ") + "\n";
  return t;
}
