<title>Radar Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F4; --surface-3:#E2E8ED;
  --line:#D3DBE2; --line-soft:#E5EAEF;
  --text:#101820; --text-2:#48586A; --text-3:#77879A;
  --accent:#0E6F78; --accent-ink:#0A545B; --accent-soft:#DCEDEF;
  --quente:#C4342F; --quente-soft:#FBE4E2;
  --morno:#9A6608; --morno-soft:#FAEEDA;
  --frio:#5F7288; --frio-soft:#E8ECF1;
  --ok:#186B42; --ok-soft:#DCEFE4;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 14px rgba(16,24,32,.05);
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D141B; --surface:#141D26; --surface-2:#1B2732; --surface-3:#24323F;
    --line:#2D3D4C; --line-soft:#223040;
    --text:#E8EEF4; --text-2:#9DAEBF; --text-3:#728499;
    --accent:#3FB0BA; --accent-ink:#6FCBD3; --accent-soft:#173238;
    --quente:#F0716B; --quente-soft:#3A1E1D;
    --morno:#DFA83F; --morno-soft:#352A15;
    --frio:#93A6BA; --frio-soft:#212D3A;
    --ok:#4FBF87; --ok-soft:#14301F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D141B; --surface:#141D26; --surface-2:#1B2732; --surface-3:#24323F;
  --line:#2D3D4C; --line-soft:#223040;
  --text:#E8EEF4; --text-2:#9DAEBF; --text-3:#728499;
  --accent:#3FB0BA; --accent-ink:#6FCBD3; --accent-soft:#173238;
  --quente:#F0716B; --quente-soft:#3A1E1D;
  --morno:#DFA83F; --morno-soft:#352A15;
  --frio:#93A6BA; --frio-soft:#212D3A;
  --ok:#4FBF87; --ok-soft:#14301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Archivo,-apple-system,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:Archivo;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
@media(max-width:820px){#app{grid-template-columns:1fr}}

.rail{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:16px 10px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
@media(max-width:820px){
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;
    border-right:none;border-bottom:1px solid var(--line);padding:10px}
}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--quente);
  box-shadow:0 0 0 4px var(--quente-soft);flex:none}
.brand b{font-family:Archivo;font-size:14.5px;font-weight:700;letter-spacing:-.02em}
@media(max-width:820px){.brand{width:100%;padding-bottom:8px}}

.navbtn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);
  color:var(--text-2);font-size:13.5px;font-weight:500;text-align:left;width:100%;
  transition:background .12s,color .12s}
.navbtn:hover{background:var(--surface-2);color:var(--text)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navbtn .ic{width:16px;flex:none;opacity:.85;display:grid;place-items:center}
.navbtn .n{margin-left:auto;font-size:11px;font-family:"IBM Plex Mono",monospace;
  color:var(--text-3);font-variant-numeric:tabular-nums}
.navbtn[aria-current="true"] .n{color:var(--accent-ink)}
@media(max-width:820px){.navbtn{width:auto}.navbtn .n{margin-left:6px}}

.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft)}
@media(max-width:820px){.rail-foot{margin-top:0;width:100%;border-top:none;padding-top:6px}}
.whoami{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r);width:100%}
.whoami:hover{background:var(--surface-2)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:Archivo;font-weight:700;font-size:11px;color:#fff;letter-spacing:.01em}
.whoami .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoami .rl{font-size:10.5px;color:var(--text-3)}

main{padding:22px 26px 60px;min-width:0;max-width:1180px}
@media(max-width:600px){main{padding:16px 14px 50px}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:22px;font-weight:700}
.page-head p{margin:3px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}

/* ---------- Quota meter ---------- */
.quota{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:9px 14px;box-shadow:var(--shadow)}
.quota .big{font-family:Archivo;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.quota .big s{text-decoration:none;color:var(--text-3);font-size:13px;font-weight:500}
.bar{width:104px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar i.done{background:var(--ok)}

/* ---------- Filters ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;font-weight:500;color:var(--text-2);transition:.12s}
.chip:hover{border-color:var(--text-3)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--ground);font-weight:600}
.search{flex:1;min-width:150px;max-width:270px;padding:6px 11px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13px}
.search::placeholder{color:var(--text-3)}

/* ---------- Lead rows ---------- */
.rows{display:flex;flex-direction:column;gap:6px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  border-left-width:3px;box-shadow:var(--shadow);overflow:hidden}
.row.A{border-left-color:var(--quente)} .row.B{border-left-color:var(--morno)} .row.C{border-left-color:var(--frio)}
.row.feito{opacity:.62}
.rhead{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 14px;
  align-items:center;width:100%;text-align:left}
.rhead:hover{background:var(--surface-2)}
.rtitle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.rtitle b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.rtitle .meta{font-size:12px;color:var(--text-3)}
.gancho{font-size:12.5px;color:var(--text-2);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rside{display:flex;align-items:center;gap:8px;flex:none}

.tag{font-family:Archivo;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 7px;border-radius:4px}
.tag.A{background:var(--quente-soft);color:var(--quente)}
.tag.B{background:var(--morno-soft);color:var(--morno)}
.tag.C{background:var(--frio-soft);color:var(--frio)}

.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.pill.novo{background:var(--surface-3);color:var(--text-3)}
.pill.andamento{background:var(--accent-soft);color:var(--accent-ink)}
.pill.ganho{background:var(--ok-soft);color:var(--ok)}
.pill.perdido{background:var(--surface-2);color:var(--text-3);text-decoration:line-through}

/* ---------- Expanded panel ---------- */
.rbody{border-top:1px solid var(--line-soft);padding:15px 14px;background:var(--surface-2);
  display:grid;gap:15px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}

/* ---------- dados ---------- */
function todosLeads(){
  var out=[];
  STATE.lotes.forEach(function(lote){
    (lote.itens||[]).forEach(function(it){
      out.push(Object.assign({},it,{lote:lote._id,loteData:lote.data}));
    });
  });
  return out;
}
function regDe(vid,leadId){
  var m=STATE.atividade[vid]||{};
  return m[leadId]||null;
}
function statusDe(vid,leadId){var r=regDe(vid,leadId);return r&&r.s?r.s:"novo";}

/* Quem "dona" o registro de um lead: o vendedor dele. O gestor ve tudo,
   e le o registro do vendedor a quem o lead foi distribuido. */
function donoDoLead(l){
  var v=STATE.vend; if(!v) return null;
  return v.gestor ? (l.vend||v.id) : v.id;
}
function meusLeads(){
  var v=STATE.vend; if(!v) return [];
  if(v.gestor) return todosLeads();
  return todosLeads().filter(function(l){return l.vend===v.id;});
}
function ultimaData(){
  var d="";
  STATE.lotes.forEach(function(x){ if(String(x.data||"")>d) d=String(x.data||""); });
  return d;
}
/* Vendedor que saiu continua no cadastro: o historico dele (contatos,
   reunioes, classificacoes) e do time e nao pode sumir do painel. O que
   ele perde e a fila e a entrada. */
function ativos(){
  return STATE.equipe.filter(function(p){return !p.gestor && !p.inativo;});
}
function todosVend(){
  return STATE.equipe.filter(function(p){return !p.gestor;});
}
function exVend(){
  return STATE.equipe.filter(function(p){return !p.gestor && p.inativo;});
}
/* Um lead que trocou de dono pode ja ter sido trabalhado pelo dono antigo.
   Sem este aviso o novo dono abre como primeiro contato e a empresa recebe
   a mesma abordagem duas vezes. */
function historicoOutro(l,dono){
  var achado=null, ids=Object.keys(STATE.atividade||{});
  ids.forEach(function(vid){
    if(achado||vid===dono) return;
    var r=(STATE.atividade[vid]||{})[l.id];
    if(r&&r.s&&r.s!=="novo") achado={vend:vid,reg:r};
  });
  return achado;
}
function nomeVend(id){
  var a=STATE.equipe.filter(function(p){return p.id===id})[0];
  return a?a.nome:id;
}
function ordenar(arr){
  var peso={A:0,B:1,C:2};
  return arr.slice().sort(function(a,b){
    var sa=statusDe(donoDoLead(a),a.id)==="novo"?0:1, sb=statusDe(donoDoLead(b),b.id)==="novo"?0:1;
    if(sa!==sb) return sa-sb;
    var pa=peso[a.prio]!==undefined?peso[a.prio]:3, pb=peso[b.prio]!==undefined?peso[b.prio]:3;
    if(pa!==pb) return pa-pb;
    var wa=a.wa?0:1, wb=b.wa?0:1;
    if(wa!==wb) return wa-wb;
    return String(a.empresa).localeCompare(String(b.empresa),"pt");
  });
}
function precisaFollowup(vid,leadId){
  var r=regDe(vid,leadId); if(!r||!r.d) return false;
  var d=diasDesde(r.d);
  if(r.s==="contatado") return d>=2;
  if(r.s==="fup1") return d>=3;
  if(r.s==="conversa"||r.s==="proposta") return d>=4;
  if(r.s==="fup2") return false;
  return false;
}
function contatadosHoje(vid){
  var m=STATE.atividade[vid]||{},n=0,k;
  for(k in m) if(m[k]&&m[k].d===HOJE) n++;
  return n;
}

/* ---------- persistencia ---------- */
function salvarReg(leadId,patch,vid,semRender){
  var v=STATE.vend; if(!v) return;
  vid=vid||v.id;
  var m=STATE.atividade[vid]||(STATE.atividade[vid]={});
  var atual=m[leadId]||{};
  m[leadId]=Object.assign({},atual,patch);
  gravarLocal(vid);
  enfileirar(vid,leadId,m[leadId]);
  if(!semRender) render();
}
function salvarEquipe(){
  if(!DB) return Promise.reject({code:"sem_banco"});
  return DB.doc("equipe/lista").set({vendedores:STATE.equipe});
}

   RENDER
   ============================================================ */
/* NUNCA redesenhe a tela enquanto alguem esta digitando: o campo seria
   destruido e recriado com o valor antigo, e o texto se perderia antes
   do salvamento (que so dispara ao sair do campo). Guardamos o pedido e
   redesenhamos quando o foco sair. */
var RENDER_PEND=false, _rq=null;
function digitando(){
  var a=document.activeElement;
  if(!a) return false;
  var t=(a.tagName||"").toLowerCase();
  return t==="input"||t==="textarea"||t==="select";
}
function render(){
  if(digitando()){ RENDER_PEND=true; return; }
  RENDER_PEND=false;
  var root=document.getElementById("root");
  root.innerHTML="";
  if(!STATE.vend){ root.appendChild(gate()); return; }
  root.appendChild(shell());
}
/* Junta varias atualizacoes do banco num redesenho so. */
function pedirRender(){
  if(_rq) return;
  _rq=setTimeout(function(){ _rq=null; render(); },120);
}
document.addEventListener("focusout",function(){
  setTimeout(function(){ if(RENDER_PEND&&!digitando()) render(); },60);
});

function entrarComo(p){
  try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(e){}
  STATE.vend=p; try{localStorage.setItem("radar_vend",p.id)}catch(e){}
  STATE.view=p.gestor?"gerencial":"leads";
  STATE.pedindoPin=false;
  render();
  sincronizar();
}

/* ---------- resgate manual ----------
   Quando a pagina roda num lugar que nao alcanca o banco (o visualizador
   do claude.ai bloqueia conexao externa), a fila fica presa na maquina do
   vendedor e nao sobe nunca. Aqui ele copia um texto e manda para o
   gestor, que cola numa copia que alcanca o banco. */
function payloadFila(){
  return JSON.stringify({ r:"radar-fila", v:1, n:FILA.length, itens:FILA });
}
function caixaResgate(){
  if(!FILA.length) return null;
  var v = STATE.vend;
  var ta = el("textarea",{class:"resgate-txt",readonly:"readonly",
    onclick:function(e){ e.target.select(); }});
  ta.value = payloadFila();
  var box = el("div",{class:"panel resgate"},[
    el("h2",{text:"Salvar o seu trabalho"}),
    el("p",{class:"hint",text:"Esta pagina nao consegue falar com o banco, entao suas "
      +FILA.length+" marcacao(oes) estao guardadas so aqui. Nada se perdeu. Clique no texto "
      +"abaixo, copie tudo (Ctrl+C) e mande para o Danilo no WhatsApp - ele coloca no sistema."}),
    ta,
    el("div",{style:"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"},[
      el("button",{class:"btn-alerta",onclick:function(){
        ta.select();
        var ok=false;
        try{ ok=document.execCommand("copy"); }catch(e){}
        if(!ok && navigator.clipboard){ try{ navigator.clipboard.writeText(ta.value); ok=true; }catch(e){} }
        var m=document.getElementById("resgate-msg");
        if(m) m.textContent = ok ? "Copiado. Agora e so colar no WhatsApp do Danilo."
                                 : "Nao consegui copiar sozinho - selecione o texto e use Ctrl+C.";
      }},[document.createTextNode("Copiar tudo")]),
      el("span",{id:"resgate-msg",style:"font-size:12.5px;color:var(--text-2);align-self:center"})
    ])
  ]);
  if(v && !v.gestor) return box;
  return box;
}

/* ---------- aviso de sincronizacao ----------
   O indicador antigo era um texto cinza minusculo no rodape. Ninguem via.
   Se o que o vendedor marca nao esta chegando no banco, isso tem que
   aparecer na cara dele e do gestor, com o motivo e um botao de resolver. */
/* O visualizador do claude.ai (frame.claudeusercontent.com) proibe qualquer
   conexao externa por politica de seguranca (CSP connect-src 'self').
   Nao ha codigo que contorne isso: nesse endereco a pagina NUNCA grava. */
function presoNoClaude(){
  try{ return /claudeusercontent\.com$|(^|\.)claude\.ai$/.test(location.hostname); }catch(e){ return false; }
}
function avisoSync(){
  if(presoNoClaude()){
    return el("div",{class:"alerta"},[
      el("div",{style:"min-width:0"},[
        el("b",{text:"Este link do claude.ai nao consegue gravar no banco. Nao e a sua internet: o claude.ai bloqueia a conexao."}),
        el("div",{class:"det",text:"Feche esta aba e use o link novo: danilobarrocas83-png.github.io/radar/radar.html . "
          +(FILA.length? FILA.length+" marcacao(oes) feitas aqui estao guardadas na caixa logo abaixo - copie e mande para o Danilo." : "Nada do que voce marcar aqui vai aparecer no painel dele.")})
      ])
    ]);
  }
  var travado = (DIAG.leituraOk===false) || (DIAG.escritaOk===false) || FILA.length>0;
  if(!travado) return null;
  var det=[];
  if(FILA.length) det.push(FILA.length+" marcacao(oes) ainda nao subiram");

    el("div",{style:"min-width:0"},[

      el("div",{class:"det",text:det.join(" · ") || "sem resposta do banco"})

/* ---------- aviso: tabela "leads" da nuvem atrasada ----------
   Quem pode agir nisso e o gestor (limpar ou atualizar a tabela), entao so ele
   ve o aviso. O vendedor nao precisa saber: a fila dele ja vem certa pela uniao.
   O que nao pode e a nuvem trocar a lista em silencio, como acontecia. */
function avisoLeads(){

    return el("div",{class:"alerta"},[
      el("div",{style:"min-width:0"},[

/* ---------- aviso ao VENDEDOR: a pagina aberta e de um dia anterior ----------
   Duas coisas fazem isso acontecer: o pin da versao compartilhada nao foi
   movido, ou o navegador serviu o JS do cache. Nos dois casos o vendedor via
   uma lista velha e nao tinha como saber - em 09/09 isso custou uma manha.
   Agora quem esta com a tela errada e avisado na propria tela, com a saida. */
function avisoListaVelha(){
  if(!STATE.vend || STATE.vend.gestor) return null;
  var d = new Date(), dia = d.getDay();      /* 0=domingo, 6=sabado */
  if(dia===0 || dia===6) return null;        /* fim de semana nao tem remessa */
  var ult = ultimaData();
  if(!ult || ult >= dataLocal()) return null;
  return el("div",{class:"alerta"},[
    el("div",{style:"min-width:0"},[
      el("b",{text:"Esta lista e do dia "+ult.split("-").reverse().join("/")+", nao e a de hoje."}),
      el("div",{class:"det",text:"Se a remessa de hoje ja saiu, voce esta com uma versao antiga da pagina. "+
        "Recarregue segurando Ctrl e Shift e apertando R (no celular, feche a aba e abra de novo). "+
        "Se continuar assim depois de recarregar, avise o Danilo: pode ser o pin da versao compartilhada."})
    ])
  ]);
}

    ]));

  linha("Leitura do banco",
        DIAG.leituraOk===null?"ainda nao tentou":(DIAG.leituraOk?("ok as "+DIAG.lidoAs):("FALHOU - "+DIAG.leituraErro)),
        DIAG.leituraOk===null?"":(DIAG.leituraOk?okc:ruim));

        DIAG.escritaOk===null?"":(DIAG.escritaOk?okc:ruim));

  var porV=el("div",{style:"margin-top:12px"});
  porV.appendChild(el("div",{class:"eyebrow",text:"Registros por vendedor",style:"margin-bottom:6px"}));
  STATE.equipe.forEach(function(pp){
    if(pp.gestor) return;
    var m=STATE.atividade[pp.id]||{};

    for(k in m){ if(m[k]&&m[k].s){ tot++; if(m[k].d===HOJE) hoje++; } }
    porV.appendChild(el("div",{style:"display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line-soft)"},[
      el("span",{text:pp.nome+(pp.inativo?" (fora do time)":"")}),

  p.appendChild(el("div",{style:"display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"},[
    el("button",{class:"btn-alerta",onclick:function(){ sincronizar().then(function(){ render(); }); }},
      [document.createTextNode("Reler o banco agora")]),
    el("button",{class:"btn-alerta",onclick:function(){ reenviarTudo(); }},
      [document.createTextNode("Reenviar tudo que esta nesta maquina")])
  ]));
  main.appendChild(p);

  /* receber o que um vendedor exportou de uma pagina sem acesso ao banco */
  var imp = el("textarea",{class:"resgate-txt",placeholder:"Cole aqui o texto que o vendedor mandou..."});
  var msg = el("div",{style:"font-size:12.5px;color:var(--text-2);margin-top:8px"});
  var pi = el("div",{class:"panel"},[
    el("h2",{text:"Receber marcacoes de um vendedor"}),
    el("p",{class:"hint",text:"Quando a pagina do vendedor nao alcanca o banco, ele copia um texto e manda para voce. Cole aqui e as marcacoes entram no sistema no nome dele."}),
    imp,
    el("div",{style:"margin-top:10px"},[
      el("button",{class:"btn-alerta",onclick:function(){
        var t=(imp.value||"").trim();
        if(!t){ msg.textContent="Cole o texto primeiro."; return; }
        var dados=null;
        try{ dados=JSON.parse(t); }catch(e){ msg.textContent="Texto invalido - peca para ele copiar de novo, inteiro."; return; }
        var itens = dados && dados.itens ? dados.itens : (dados instanceof Array ? dados : null);
        if(!itens || !itens.length){ msg.textContent="Nao achei marcacoes nesse texto."; return; }
        var n=0;
        itens.forEach(function(x){
          if(!x || !x.vend || !x.lead) return;
          var m = STATE.atividade[x.vend] || (STATE.atividade[x.vend]={});
          m[x.lead] = { s:x.s||null, m:x.m||null, d:x.d||null, o:x.o||null };
          espelhoLocal(x.vend);
          FILA = FILA.filter(function(y){ return !(y.vend===x.vend && y.lead===x.lead); });
          FILA.push({ vend:x.vend, lead:x.lead, s:x.s||null, m:x.m||null, d:x.d||null, o:x.o||null });
          n++;
        });
        gravarFila(); escoar();
        msg.textContent = n+" marcacao(oes) recebidas e enviadas para o banco. Confira acima em alguns segundos.";
        imp.value="";
      }},[document.createTextNode("Receber e enviar ao banco")])
    ]),
    msg
  ]);
  main.appendChild(pi);
}

/* ---------- VIEW: meus leads ---------- */
function viewLeads(main){
  var v=STATE.vend, meus=meusLeads();
  var reps=ativos();
  var cota, feitos;
  if(v.gestor){
    cota=reps.reduce(function(a,p){return a+(p.cota||50)},0)||1;
    feitos=reps.reduce(function(a,p){return a+contatadosHoje(p.id)},0);
  } else {
    cota=v.cota||50;
    feitos=contatadosHoje(v.id);
  }
  var pct=Math.min(100,Math.round(feitos/cota*100));
  var hoje=ultimaData();
  var novosHoje=meus.filter(function(l){
    return String(l.loteData||"")===hoje && statusDe(donoDoLead(l),l.id)==="novo"; }).length;

  main.appendChild(el("div",{class:"page-head"},[
    el("div",{},[
      el("h1",{text:v.gestor?"Todos os leads":"Meus leads"}),
      el("p",{text:v.gestor
        ? ("Visão do time inteiro. Remessa de hoje: "+novosHoje+" leads ainda não trabalhados, de "+meus.length+" na base. O nome do vendedor responsável aparece em cada linha.")
        : ("Remessa de hoje: "+novosHoje+" leads novos. Seu objetivo em cada um é marcar 20 minutinhos entre o dono e o Danilo — você não apresenta valor.")})
    ]),
    el("div",{class:"quota"},[
      el("div",{},[el("div",{class:"eyebrow",text:"Hoje"}),
        el("div",{class:"big"},[document.createTextNode(String(feitos)),el("s",{text:" / "+cota})])]),
      el("div",{class:"bar"},[el("i",{class:pct>=100?"done":"",style:"width:"+pct+"%"})])
    ])
  ]));

  var filtros=[["hoje","Remessa de hoje"],["novo","Não contatados"],["A","Quentes"],
               ["andamento","Em andamento"],["reuniao","Reuniões"],["todos","Todos"]];
  var fr=el("div",{class:"filters"});
  filtros.forEach(function(f){
    fr.appendChild(el("button",{class:"chip","aria-pressed":STATE.filtro===f[0]?"true":"false",
      onclick:function(){STATE.filtro=f[0];render()}},[document.createTextNode(f[1])]));
  });
  fr.appendChild(el("input",{class:"search",type:"text",placeholder:"Buscar empresa ou nicho…",
    value:STATE.busca,oninput:function(e){STATE.busca=e.target.value;desenharLista(lista,v);}}));
  main.appendChild(fr);

  var lista=el("div",{class:"rows"});
  main.appendChild(lista);
  desenharLista(lista,v);
}

function filtrar(arr){
  var f=STATE.filtro,b=STATE.busca.trim().toLowerCase(),hoje=ultimaData();
  return arr.filter(function(l){
    /* o lead aberto continua visivel mesmo depois de classificado,
       para o vendedor ver a confirmacao antes de fechar */
    if(l.id===STATE.aberto) return true;
    var s=statusDe(donoDoLead(l),l.id);
    if(f==="hoje"&&(String(l.loteData||"")!==hoje||s!=="novo")) return false;
    if(f==="novo"&&s!=="novo") return false;
    if(f==="A"&&l.prio!=="A") return false;
    if(f==="andamento"&&ABERTOS.indexOf(s)<0) return false;
    if(f==="reuniao"&&s!=="reuniao"&&s!=="fechado") return false;
    if(b){
      var hay=(l.empresa+" "+(l.nicho||"")+" "+(l.cidade||"")).toLowerCase();
      if(hay.indexOf(b)<0) return false;
    }
    return true;
  });
}
function desenharLista(cont,v){
  cont.innerHTML="";
  var arr=ordenar(filtrar(meusLeads()));
  if(!arr.length){
    var msg="Nenhum lead com esse filtro. Troque o filtro acima.";
    if(STATE.filtro==="hoje") msg="Você já trabalhou toda a remessa de hoje. Vá para Follow-ups, ou mude o filtro para “Não contatados” e pegue leads dos dias anteriores.";
    cont.appendChild(el("div",{class:"empty",text:msg}));
    return;

function estatVend(p){
  var m=STATE.atividade[p.id]||{}, k, r;
  var s={contatados:0,hoje:0,respostas:0,reunioes:0,fechados:0,abertos:0};
  for(k in m){ r=m[k]; if(!r||!r.s||r.s==="novo") continue;
    s.contatados++;
    if(r.d===HOJE) s.hoje++;
    if(["conversa","reuniao","proposta","fechado"].indexOf(r.s)>=0) s.respostas++;
    if(r.s==="reuniao") s.reunioes++;
    if(r.s==="fechado") s.fechados++;
    if(ABERTOS.indexOf(r.s)>=0) s.abertos++;
  }
  s.taxa=s.contatados?s.respostas/s.contatados:0;
  s.conv=s.contatados?s.fechados/s.contatados:0;
  return s;
}

function contarDe(vid){
  return todosLeads().filter(function(l){return l.vend===vid}).length;

function redistribuir(){
  var reps=ativos();
  if(!reps.length){toast("Cadastre vendedores primeiro");return;}
  if(!DB){toast("Sem banco: nao da pra redistribuir");return;}
  var i=0, mudou=0;
  var novos=STATE.lotes.map(function(lote){
    var itens=(lote.itens||[]).map(function(it){
      var trabalhado=reps.some(function(p){var r=regDe(p.id,it.id);return r&&r.s&&r.s!=="novo"});
      if(trabalhado) return it;
      mudou++;
      var novo=Object.assign({},it,{vend:reps[i%reps.length].id}); i++;
      return novo;
    });
    return Object.assign({},lote,{itens:itens});
  });
  Promise.all(novos.map(function(lote){
    return DB.doc("leads/"+lote._id).set({data:lote.data,total:lote.itens.length,itens:lote.itens});
  })).then(function(){
    STATE.lotes=novos; toast(mudou+" leads redistribuidos"); render();
  }).catch(function(){toast("Nao consegui redistribuir")});
}

    try{ localStorage.setItem("radar_chave", String(SB.i)); }catch(e){}
    return true;
  }
  return false;
}

STATE.equipe = EQUIPE_FIXA.slice();
STATE.sync = "ok";
STATE.pend = 0;

function sbConfigurado(){
  return SB.url.indexOf("http") === 0 && !!sbChave();
}
function sbUrl(caminho){ return SB.url.replace(/\/+$/,"") + "/rest/v1/" + caminho; }
function sbCab(extra){
  var h = { "apikey": sbChave(), "Authorization": "Bearer " + sbChave(),
            "Content-Type": "application/json" };
  if(extra) for(var k in extra) h[k] = extra[k];
  return h;
}
/* Uma chave recusada nao pode derrubar o time: tenta a outra uma vez. */
function sbPedir(caminho, opts){
  opts = opts || {};
  function tentativa(){
    var o = { method: opts.method || "GET", headers: sbCab(opts.headers) };
    if(opts.body) o.body = opts.body;
    return fetch(sbUrl(caminho), o);
  }
  return tentativa().then(function(r){
    if((r.status === 401 || r.status === 403) && sbTrocarChave()) return tentativa();
    return r;
  });
}

/* ---------- espelho local (cache e seguranca contra queda) ---------- */
function espelhoLocal(vid){
  try{ localStorage.setItem("radar_ativ_"+vid, JSON.stringify(STATE.atividade[vid]||{})); }catch(e){}
}
function lerEspelho(){
  STATE.equipe.forEach(function(p){
    var b=null; try{ b = localStorage.getItem("radar_ativ_"+p.id); }catch(e){}
    if(b){ try{ STATE.atividade[p.id] = JSON.parse(b) || {}; }catch(e){} }
  });
}
/* nome antigo, ainda chamado por salvarReg */
function gravarLocal(vid){ espelhoLocal(vid); }

/* ---------- fila de envio ---------- */
var FILA = [];
function lerFila(){
  try{ FILA = JSON.parse(localStorage.getItem("radar_fila")||"[]") || []; }catch(e){ FILA = []; }
  STATE.pend = FILA.length;
}
function gravarFila(){
  try{ localStorage.setItem("radar_fila", JSON.stringify(FILA)); }catch(e){}
  STATE.pend = FILA.length;
}
function enfileirar(vid, leadId, reg){
  FILA = FILA.filter(function(x){ return !(x.vend===vid && x.lead===leadId); });
  FILA.push({
    vend: vid, lead: leadId,
    s: reg.s || null, m: reg.m || null,
    d: reg.d || null, o: reg.o || null
  });
  gravarFila();
  escoar();
}

/* Reempurra para o banco tudo que existe na maquina. Serve quando as
   marcacoes ficaram presas aqui e nunca chegaram no painel do gestor. */
function reenviarTudo(){
  var v = STATE.vend; if(!v) return 0;
  var alvos = v.gestor ? Object.keys(STATE.atividade||{}) : [v.id];
  var n = 0;
  alvos.forEach(function(vid){
    var m = STATE.atividade[vid] || {};
    Object.keys(m).forEach(function(leadId){
      var r = m[leadId]; if(!r || !r.s) return;
      FILA = FILA.filter(function(x){ return !(x.vend===vid && x.lead===leadId); });
      FILA.push({ vend:vid, lead:leadId, s:r.s||null, m:r.m||null, d:r.d||null, o:r.o||null });
      n++;
    });
  });
  gravarFila();
  escoar();
  pedirRender();
  return n;
}

var ESCOANDO = false;
function escoar(){
  if(ESCOANDO || !FILA.length) return;
  if(!sbConfigurado()){ STATE.sync = "offline"; pintarSync(); return; }
  if(typeof navigator !== "undefined" && navigator.onLine === false){
    STATE.sync = "pendente"; pintarSync(); return;
  }
  ESCOANDO = true;
  var lote = FILA.slice(0, 50);
  STATE.sync = "enviando"; pintarSync();
  sbPedir("atividade", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(lote)
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + " " + t); });
    var chaves = {};
    lote.forEach(function(x){ chaves[x.vend+" "+x.lead] = 1; });
    FILA = FILA.filter(function(x){ return !chaves[x.vend+" "+x.lead]; });
    gravarFila();
    ESCOANDO = false;
    DIAG.escritaOk = true; DIAG.escritaErro = ""; DIAG.enviadoAs = horaAgora();
    STATE.sync = FILA.length ? "pendente" : "ok";
    pintarSync();
    if(FILA.length) escoar();
  }).catch(function(e){
    ESCOANDO = false;
    DIAG.escritaOk = false; DIAG.escritaErro = e.message;
    STATE.sync = "pendente"; pintarSync();
    if(window.console && console.warn) console.warn("[radar] nao consegui enviar agora: " + e.message);
  });
}

/* pinta o indicador sem redesenhar a tela inteira */
function pintarSync(){
  var el = document.getElementById("sync");
  if(!el) return;
  var t = { ok: "tudo salvo",
            enviando: "salvando...",
            pendente: "salva sozinho quando a internet voltar (" + FILA.length + ")",
            offline: "modo local" }[STATE.sync] || "";
  el.textContent = t;
  el.setAttribute("data-s", STATE.sync);
}

/* ---------- leitura do banco ---------- */
function linhaParaReg(x){
  var reg = {};
  if(x.s) reg.s = x.s;
  if(x.m) reg.m = x.m;
  if(x.d) reg.d = String(x.d).slice(0,10);
  if(x.o) reg.o = x.o;
  return reg;
}
function carregarNuvem(){
  if(!sbConfigurado()) return Promise.resolve(false);
  return sbPedir("atividade?select=vend,lead,s,m,d,o")
    .then(function(r){ if(!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(function(linhas){
      var mapa = {};
      /* comeca do que ja existe na maquina: o banco COMPLETA, nunca apaga.
         Sem isto, um registro que nunca subiu some da tela na primeira
         leitura da nuvem e o vendedor perde o trabalho do dia. */
      Object.keys(STATE.atividade||{}).forEach(function(vid){
        mapa[vid] = Object.assign({}, STATE.atividade[vid]);
      });
      (linhas||[]).forEach(function(x){
        var m = mapa[x.vend] || (mapa[x.vend] = {});
        m[x.lead] = linhaParaReg(x);
      });
      /* o que ainda esta na fila e mais novo que o banco: preserva */
      FILA.forEach(function(x){
        var m = mapa[x.vend] || (mapa[x.vend] = {});
        m[x.lead] = linhaParaReg(x);
      });
      STATE.atividade = mapa;
      Object.keys(mapa).forEach(function(vid){ espelhoLocal(vid); });
      DIAG.leituraOk = true; DIAG.leituraErro = "";
      DIAG.linhas = (linhas||[]).length; DIAG.lidoAs = horaAgora();
      STATE.sync = FILA.length ? "pendente" : "ok";
      return true;
    })
    .catch(function(e){
      STATE.sync = "pendente";
      DIAG.leituraOk = false; DIAG.leituraErro = e.message; DIAG.lidoAs = horaAgora();
      if(window.console && console.warn) console.warn("[radar] leitura falhou, usando copia local: " + e.message);
      return false;
    });
}

function carregarLeadsNuvem(){
  if(!sbConfigurado()) return Promise.resolve(false);
  return sbPedir("leads?select=*&order=remessa.desc")
    .then(function(r){ if(!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(function(linhas){
      DIAG.leadsNuvemLinhas = (linhas||[]).length;
      if(!linhas || !linhas.length){ DIAG.leadsFonte="embutida"; return false; }
      var daNuvem = linhas.map(function(x){
        return { id:x.id, empresa:x.empresa, nicho:x.nicho, cidade:x.cidade,
                 ig:x.ig, wa:x.wa, pageId:x.page_id, gancho:x.gancho,
                 prio:x.prio, oferta:x.oferta, vend:x.vend,
                 loteData: String(x.remessa||"").slice(0,10) };
      });
      function maiorData(arr){
        var d=""; (arr||[]).forEach(function(l){
          var v=String((l&&l.loteData)||""); if(v>d) d=v; }); return d;
      }
      DIAG.leadsNuvemData    = maiorData(daNuvem);
      DIAG.leadsEmbutidaData = maiorData(LEADS_EMBUTIDOS);
      /* O banco COMPLETA a lista embutida, nunca a substitui - a mesma regra
         que ja vale para a atividade. Antes ele substituia: uma tabela "leads"
         atrasada apagava a remessa recem-publicada e o time abria o dia com
         zero lead novo, sem nenhum aviso na tela. */
      var idsEmb={}; LEADS_EMBUTIDOS.forEach(function(l){ if(l&&l.id) idsEmb[l.id]=1; });
      var so=0; daNuvem.forEach(function(l){ if(l&&l.id&&!idsEmb[l.id]) so++; });
      DIAG.leadsSoDaNuvem = so;
      var porId={}, ordem=[];
      function juntar(l){
        if(!l || !l.id) return;
        if(!(l.id in porId)) ordem.push(l.id);
        porId[l.id]=l;
      }
      daNuvem.forEach(juntar);          /* primeiro o que veio da nuvem */
      LEADS_EMBUTIDOS.forEach(juntar);  /* o embutido vence quando o id se repete */
      DIAG.leadsFonte = "nuvem+embutida";
      montarLotes(aplicarRemanejo(ordem.map(function(id){ return porId[id]; })));
      return true;
    })
    .catch(function(e){
      DIAG.leadsFonte="erro"; DIAG.leadsErro=e.message;
      if(window.console && console.warn) console.warn("[radar] tabela leads: "+e.message);
      return false;
    });
}

  (lista||[]).forEach(function(l){ var v=REMANEJO[l.id]; if(v) l.vend=v; });

}
function nLeadsDe(vid){
  var n=0;
  STATE.lotes.forEach(function(lo){ (lo.itens||[]).forEach(function(it){ if(it.vend===vid) n++; }); });

/* ---------- lotes ---------- */
function montarLotes(lista){
  var porData = {};
  lista.forEach(function(l){
    var d = l.loteData || "";
    (porData[d] = porData[d] || []).push(l);
  });
  STATE.lotes = Object.keys(porData).sort().map(function(d){
    return { _id: "lote-"+d, data: d, itens: porData[d] };
  });
}

  if(achado) STATE.vend = achado;

/* ---------- resumo do dia para mandar no grupo ---------- */
function resumoDoDia(){
  var v = STATE.vend; if(!v) return "";
  var m = STATE.atividade[v.id] || {}, k, r;
  var hoje = { enviadas:0, responderam:0, reunioes:0, semInteresse:0, followups:0 };
  var nomes = { reuniao:[], conversa:[] };
  var mapa = {};
  todosLeads().forEach(function(l){ mapa[l.id] = l.empresa; });
  for(k in m){
    r = m[k]; if(!r || r.d !== HOJE) continue;
    hoje.enviadas++;
    if(["conversa","reuniao","proposta","fechado"].indexOf(r.s) >= 0) hoje.responderam++;
    if(r.s === "reuniao"){ hoje.reunioes++; nomes.reuniao.push(mapa[k]||k); }
    if(r.s === "conversa"){ nomes.conversa.push(mapa[k]||k); }
    if(r.s === "perdido" || r.s === "bloqueado") hoje.semInteresse++;
    if(r.s === "fup1" || r.s === "fup2") hoje.followups++;
  }
  var d = HOJE.split("-");
  var t = "*Resumo do dia — " + v.nome + "*\n" + d[2] + "/" + d[1] + "\n\n";
  t += "Mensagens enviadas: " + hoje.enviadas + "\n";
  t += "Responderam: " + hoje.responderam + "\n";
  t += "Follow-ups feitos: " + hoje.followups + "\n";
  t += "*Reuniões marcadas: " + hoje.reunioes + "*\n";
  t += "Sem interesse: " + hoje.semInteresse + "\n";
  if(nomes.reuniao.length) t += "\n*Reuniões:* " + nomes.reuniao.join(", ") + "\n";
  if(nomes.conversa.length) t += "*Em conversa:* " + nomes.conversa.join(", ") + "\n";
  return t;
}
