<title>Radar Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F4; --surface-3:#E2E8ED;
  --line:#D3DBE2; --line-soft:#E5EAEF;
  --text:#101820; --text-2:#48586A; --text-3:#77879A;
  --accent:#0E6F78; --accent-ink:#0A545B; --accent-soft:#DCEDEF;
  --quente:#C4342F; --quente-soft:#FBE4E2;
  --morno:#9A6608; --morno-soft:#FAEEDA;
  --frio:#5F7288; --frio-soft:#E8ECF1;
  --ok:#186B42; --ok-soft:#DCEFE4;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 14px rgba(16,24,32,.05);
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D141B; --surface:#141D26; --surface-2:#1B2732; --surface-3:#24323F;
    --line:#2D3D4C; --line-soft:#223040;
    --text:#E8EEF4; --text-2:#9DAEBF; --text-3:#728499;
    --accent:#3FB0BA; --accent-ink:#6FCBD3; --accent-soft:#173238;
    --quente:#F0716B; --quente-soft:#3A1E1D;
    --morno:#DFA83F; --morno-soft:#352A15;
    --frio:#93A6BA; --frio-soft:#212D3A;
    --ok:#4FBF87; --ok-soft:#14301F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D141B; --surface:#141D26; --surface-2:#1B2732; --surface-3:#24323F;
  --line:#2D3D4C; --line-soft:#223040;
  --text:#E8EEF4; --text-2:#9DAEBF; --text-3:#728499;
  --accent:#3FB0BA; --accent-ink:#6FCBD3; --accent-soft:#173238;
  --quente:#F0716B; --quente-soft:#3A1E1D;
  --morno:#DFA83F; --morno-soft:#352A15;
  --frio:#93A6BA; --frio-soft:#212D3A;
  --ok:#4FBF87; --ok-soft:#14301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Archivo,-apple-system,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:Archivo;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
@media(max-width:820px){#app{grid-template-columns:1fr}}

.rail{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:16px 10px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
@media(max-width:820px){
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;
    border-right:none;border-bottom:1px solid var(--line);padding:10px}
}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--quente);
  box-shadow:0 0 0 4px var(--quente-soft);flex:none}
.brand b{font-family:Archivo;font-size:14.5px;font-weight:700;letter-spacing:-.02em}
@media(max-width:820px){.brand{width:100%;padding-bottom:8px}}

.navbtn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);
  color:var(--text-2);font-size:13.5px;font-weight:500;text-align:left;width:100%;
  transition:background .12s,color .12s}
.navbtn:hover{background:var(--surface-2);color:var(--text)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navbtn .ic{width:16px;flex:none;opacity:.85;display:grid;place-items:center}
.navbtn .n{margin-left:auto;font-size:11px;font-family:"IBM Plex Mono",monospace;
  color:var(--text-3);font-variant-numeric:tabular-nums}
.navbtn[aria-current="true"] .n{color:var(--accent-ink)}
@media(max-width:820px){.navbtn{width:auto}.navbtn .n{margin-left:6px}}

.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft)}
@media(max-width:820px){.rail-foot{margin-top:0;width:100%;border-top:none;padding-top:6px}}
.whoami{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r);width:100%}
.whoami:hover{background:var(--surface-2)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:Archivo;font-weight:700;font-size:11px;color:#fff;letter-spacing:.01em}
.whoami .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoami .rl{font-size:10.5px;color:var(--text-3)}

main{padding:22px 26px 60px;min-width:0;max-width:1180px}
@media(max-width:600px){main{padding:16px 14px 50px}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:22px;font-weight:700}
.page-head p{margin:3px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}

/* ---------- Quota meter ---------- */
.quota{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:9px 14px;box-shadow:var(--shadow)}
.quota .big{font-family:Archivo;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.quota .big s{text-decoration:none;color:var(--text-3);font-size:13px;font-weight:500}
.bar{width:104px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar i.done{background:var(--ok)}

/* ---------- Filters ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;font-weight:500;color:var(--text-2);transition:.12s}
.chip:hover{border-color:var(--text-3)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--ground);font-weight:600}
.search{flex:1;min-width:150px;max-width:270px;padding:6px 11px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13px}
.search::placeholder{color:var(--text-3)}

/* ---------- Lead rows ---------- */
.rows{display:flex;flex-direction:column;gap:6px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  border-left-width:3px;box-shadow:var(--shadow);overflow:hidden}
.row.A{border-left-color:var(--quente)} .row.B{border-left-color:var(--morno)} .row.C{border-left-color:var(--frio)}
.row.feito{opacity:.62}
.rhead{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 14px;
  align-items:center;width:100%;text-align:left}
.rhead:hover{background:var(--surface-2)}
.rtitle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.rtitle b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.rtitle .meta{font-size:12px;color:var(--text-3)}
.gancho{font-size:12.5px;color:var(--text-2);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rside{display:flex;align-items:center;gap:8px;flex:none}

.tag{font-family:Archivo;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 7px;border-radius:4px}
.tag.A{background:var(--quente-soft);color:var(--quente)}
.tag.B{background:var(--morno-soft);color:var(--morno)}
.tag.C{background:var(--frio-soft);color:var(--frio)}

.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.pill.novo{background:var(--surface-3);color:var(--text-3)}
.pill.andamento{background:var(--accent-soft);color:var(--accent-ink)}
.pill.ganho{background:var(--ok-soft);color:var(--ok)}
.pill.perdido{background:var(--surface-2);color:var(--text-3);text-decoration:line-through}

/* ---------- Expanded panel ---------- */
.rbody{border-top:1px solid var(--line-soft);padding:15px 14px;background:var(--surface-2);
  display:grid;gap:15px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media(max-width:760px){.rbody{grid-template-columns:1fr}}
.block{display:flex;flex-direction:column;gap:7px;min-width:0}
.scriptbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;font-size:13px;white-space:pre-wrap;line-height:1.6;color:var(--text)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:7px 13px;border-radius:6px;font-size:12.5px;font-weight:600;border:1px solid var(--line);
  background:var(--surface);color:var(--text);transition:.12s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--text-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv a{color:var(--accent-ink);font-weight:500}
select,textarea,input[type=text]{font:inherit;font-size:13px;padding:6px 9px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);width:100%}
textarea{resize:vertical;min-height:56px}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;box-shadow:var(--shadow)}
.stat .v{font-family:Archivo;font-size:25px;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums;margin-top:5px;letter-spacing:-.02em}
.stat .sub{font-size:11.5px;color:var(--text-3);margin-top:2px}

/* ---------- Table ---------- */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th{text-align:left;padding:9px 13px;font-family:Archivo;font-size:10.5px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 13px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.trackbar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:64px}
.trackbar i{display:block;height:100%;background:var(--accent)}

/* ---------- Cards / sections ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h2{font-size:14.5px;font-weight:700;margin-bottom:3px}
.panel .hint{font-size:12.5px;color:var(--text-2);margin:0 0 13px;max-width:64ch}
.divide{border-top:1px solid var(--line-soft);margin:15px 0 0;padding-top:15px}

/* ---------- Script library ---------- */
.scriptcard{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:9px;background:var(--surface)}
.scriptcard>summary{padding:11px 14px;cursor:pointer;font-weight:600;font-size:13.5px;
  list-style:none;display:flex;align-items:center;gap:9px}
.scriptcard>summary::-webkit-details-marker{display:none}
.scriptcard>summary::before{content:"+";font-family:"IBM Plex Mono",monospace;color:var(--text-3);font-size:15px}
.scriptcard[open]>summary::before{content:"\2212"}
.scriptcard[open]>summary{border-bottom:1px solid var(--line-soft);background:var(--surface-2)}
.scriptcard .inner{padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.porque{background:var(--accent-soft);border-radius:var(--r);padding:11px 13px;font-size:12.5px;
  line-height:1.55;color:var(--accent-ink)}
.porque b{font-family:Archivo;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;display:block;margin-bottom:4px;opacity:.85}
.regra{background:var(--quente-soft);color:var(--quente);border:1px solid currentColor;
  border-radius:var(--r);padding:12px 14px;font-size:13px;margin-bottom:16px;line-height:1.55}
.regra b{font-family:Archivo;display:block;margin-bottom:3px;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase}

/* ---------- Classificacao do toque ---------- */
.motgrupo{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.motgrupo>span{font-family:Archivo;font-size:9.5px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--text-3)}
.motlinha{display:flex;flex-wrap:wrap;gap:5px}
.mot{padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);
  font-size:12px;font-weight:500;color:var(--text-2);transition:.12s;text-align:left}
.mot:hover{border-color:var(--text-3);background:var(--surface-3)}
.mot.on{background:var(--text);border-color:var(--text);color:var(--ground);font-weight:600}
.mot.ok{border-color:var(--ok);color:var(--ok)}
.mot.ok:hover{background:var(--ok-soft)}
.mot.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mot.al{border-color:var(--morno);color:var(--morno)}
.mot.al:hover{background:var(--morno-soft)}
.mot.al.on{background:var(--morno);border-color:var(--morno);color:#fff}
.mot.fr{color:var(--text-3)}
.mot.fr.on{background:var(--text-3);border-color:var(--text-3);color:var(--ground)}
.tagmot{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;
  background:var(--surface-3);color:var(--text-2);white-space:nowrap}

/* ---------- Roteiro passo a passo ---------- */
.passo{display:grid;grid-template-columns:25px 1fr;gap:10px;margin-bottom:13px;align-items:start}
.passo>i{width:23px;height:23px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-family:Archivo;font-size:11.5px;font-weight:700;
  font-style:normal;margin-top:1px}
.passo .tit{font-size:13.5px;font-weight:600;margin-bottom:3px}
.passo .txt{font-size:12.5px;color:var(--text-2);line-height:1.5}
.se{border-left:3px solid var(--line-soft);padding-left:12px;margin-bottom:11px}
.se.venceu{border-left-color:var(--quente)}
.se.venceu>.q{color:var(--quente)}
.se>.q{font-family:Archivo;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-3);display:block;margin-bottom:5px}

function numeroDe(g){
  var m=String(g||"").match(/(\d+)\s*(anúncio|anuncio|criativo|campo)/i);

  if(!g) return null;
  if(/setup profissional|t[íi]tulo estruturado/i.test(g)) return null;

    return "o anúncio é um post impulsionado e manda a pessoa pro perfil, não pro WhatsApp — ela clica, cai no feed e não tem pra onde ir";

           (rep?", repetido em "+rep[1]+" anúncios":"")+", sem chamada nenhuma";

  if(/sem t[íi]tulo de link|t[íi]tulo vazio|campos? de t[íi]tulo vazio/i.test(g))

/* ---------- reuniao marcada: dia e hora saem da anotacao ----------
   A tabela atividade nao tem coluna pra isso; o vendedor escreve
   "15/09 14h" na anotacao e o Radar le dali. */
function dataReuniao(reg){
  if(!reg||reg.s!=="reuniao") return null;
  var o=String(reg.o||""), m=o.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(!m) return null;
  var dia=parseInt(m[1],10), mes=parseInt(m[2],10);
  if(!dia||!mes||dia>31||mes>12) return null;
  var ano=m[3]?parseInt(m[3].length===2?"20"+m[3]:m[3],10):parseInt(HOJE.slice(0,4),10);
  var iso=ano+"-"+("0"+mes).slice(-2)+"-"+("0"+dia).slice(-2);
  /* sem ano: se ficou mais de 60 dias no passado, e do ano que vem */
  if(!m[3]&&diasDesde(iso)>60) iso=(ano+1)+iso.slice(4);
  var h=o.slice(m.index+m[0].length).match(/(\d{1,2})\s*(?:h|:)\s*(\d{2})?/);
  var hora=h?(h[1]+"h"+(h[2]&&h[2]!=="00"?h[2]:"")):"";
  return {iso:iso,hora:hora};
}

/* ---------- dados ---------- */
function todosLeads(){
  var out=[];
  STATE.lotes.forEach(function(lote){
    (lote.itens||[]).forEach(function(it){
      out.push(Object.assign({},it,{lote:lote._id,loteData:lote.data}));
    });
  });
  return out;
}
function regDe(vid,leadId){
  var m=STATE.atividade[vid]||{};
  return m[leadId]||null;
}
function statusDe(vid,leadId){var r=regDe(vid,leadId);return r&&r.s?r.s:"novo";}

/* Quem "dona" o registro de um lead: o vendedor dele. O gestor ve tudo,
   e le o registro do vendedor a quem o lead foi distribuido. */
function donoDoLead(l){
  var v=STATE.vend; if(!v) return null;
  return v.gestor ? (l.vend||v.id) : v.id;
}
function meusLeads(){
  var v=STATE.vend; if(!v) return [];
  if(v.gestor) return todosLeads();
  return todosLeads().filter(function(l){return l.vend===v.id;});
}
function ultimaData(){
  var d="";
  STATE.lotes.forEach(function(x){ if(String(x.data||"")>d) d=String(x.data||""); });
  return d;
}
/* Vendedor que saiu continua no cadastro: o historico dele (contatos,
   reunioes, classificacoes) e do time e nao pode sumir do painel. O que
   ele perde e a fila e a entrada. */
function ativos(){
  return STATE.equipe.filter(function(p){return !p.gestor && !p.inativo;});
}
function todosVend(){
  return STATE.equipe.filter(function(p){return !p.gestor;});
}
function exVend(){
  return STATE.equipe.filter(function(p){return !p.gestor && p.inativo;});
}
/* Um lead que trocou de dono pode ja ter sido trabalhado pelo dono antigo.
   Sem este aviso o novo dono abre como primeiro contato e a empresa recebe
   a mesma abordagem duas vezes. */
function historicoOutro(l,dono){
  var achado=null, ids=Object.keys(STATE.atividade||{});
  ids.forEach(function(vid){
    if(achado||vid===dono) return;
    var r=(STATE.atividade[vid]||{})[l.id];
    if(r&&r.s&&r.s!=="novo") achado={vend:vid,reg:r};
  });
  return achado;
}
function nomeVend(id){
  var a=STATE.equipe.filter(function(p){return p.id===id})[0];
  return a?a.nome:id;
}
function ordenar(arr){
  var peso={A:0,B:1,C:2};
  return arr.slice().sort(function(a,b){
    var sa=statusDe(donoDoLead(a),a.id)==="novo"?0:1, sb=statusDe(donoDoLead(b),b.id)==="novo"?0:1;
    if(sa!==sb) return sa-sb;
    var pa=peso[a.prio]!==undefined?peso[a.prio]:3, pb=peso[b.prio]!==undefined?peso[b.prio]:3;
    if(pa!==pb) return pa-pb;
    var wa=a.wa?0:1, wb=b.wa?0:1;
    if(wa!==wb) return wa-wb;
    return String(a.empresa).localeCompare(String(b.empresa),"pt");
  });
}
function precisaFollowup(vid,leadId){
  var r=regDe(vid,leadId); if(!r||!r.d) return false;
  var d=diasDesde(r.d);
  if(r.s==="reuniao"){ var dr=dataReuniao(r); if(!dr) return false; var k=diasDesde(dr.iso); return k===-1||k===0; }
  if(r.s==="contatado") return d>=2;
  if(r.s==="fup1") return d>=3;
  if(r.s==="conversa"||r.s==="proposta") return d>=4;
  if(r.s==="fup2") return false;
  return false;
}
function contatadosHoje(vid){
  var m=STATE.atividade[vid]||{},n=0,k;
  for(k in m) if(m[k]&&m[k].d===HOJE) n++;
  return n;
}

function salvarReg(leadId,patch,vid,semRender){
  var v=STATE.vend; if(!v) return;
  vid=vid||v.id;

  var atual=m[leadId]||{};
  m[leadId]=Object.assign({},atual,patch);

  if(patch && patch.s) registrarToque(vid,leadId,m[leadId]);
  if(!semRender) render();

/* NUNCA redesenhe a tela enquanto alguem esta digitando: o campo seria
   destruido e recriado com o valor antigo, e o texto se perderia antes
   do salvamento (que so dispara ao sair do campo). Guardamos o pedido e
   redesenhamos quando o foco sair. */
var RENDER_PEND=false, _rq=null;
function digitando(){
  var a=document.activeElement;
  if(!a) return false;
  var t=(a.tagName||"").toLowerCase();
  return t==="input"||t==="textarea"||t==="select";
}
function render(){
  if(digitando()){ RENDER_PEND=true; return; }
  RENDER_PEND=false;
  var root=document.getElementById("root");
  root.innerHTML="";
  if(!STATE.vend){ root.appendChild(gate()); return; }
  root.appendChild(shell());
}
/* Junta varias atualizacoes do banco num redesenho so. */
function pedirRender(){
  if(_rq) return;
  _rq=setTimeout(function(){ _rq=null; render(); },120);
}
document.addEventListener("focusout",function(){
  setTimeout(function(){ if(RENDER_PEND&&!digitando()) render(); },60);
});

/* ---------- transferencia para o Radar novo ----------
   Quando a pagina roda no visualizador do claude.ai ela nao alcanca o banco
   (CSP connect-src 'self'): tudo que o vendedor marca fica preso no
   localStorage desta origem. Antes ele copiava um JSON e mandava por
   WhatsApp para o Danilo colar no sistema. Agora e um clique: o pacote vai
   no #hash da URL para importar.html, no mesmo endereco do radar.html
   (danilobarrocas83-png.github.io), que grava no Supabase, deixa a copia no
   localStorage de la e responde por postMessage para esta aba limpar a fila.
   O hash nunca sai do navegador (nao vai para servidor nenhum). */
var RADAR_NOVO_ORIGEM="https://danilobarrocas83-png.github.io";
var RADAR_NOVO=RADAR_NOVO_ORIGEM+"/radar/radar.html";
var RADAR_IMPORTAR=RADAR_NOVO_ORIGEM+"/radar/importar.html";
var RADAR_NOVO_CURTO="danilobarrocas83-png.github.io/radar/radar.html";

function b64url(s){
  var bin="";
  if(typeof TextEncoder!=="undefined"){
    var bytes=new TextEncoder().encode(s);
    for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  } else bin=unescape(encodeURIComponent(s));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
/* Tudo que este vendedor tem nesta maquina: a fila (o que nunca subiu) e o
   espelho local. Se um lead aparece nos dois, vale a fila, que e mais nova. */
function leadsJaTransferidos(){
  var t=lerTransferencia(), m={};
  ((t&&t.leads)||[]).forEach(function(id){ m[String(id)]=1; });
  return m;
}
function itensParaTransferir(){
  var v=STATE.vend; if(!v||v.gestor) return [];
  var m=STATE.atividade[v.id]||{}, porLead={}, feitos=leadsJaTransferidos();
  Object.keys(m).forEach(function(leadId){
    var r=m[leadId]; if(!r||!r.s||feitos[leadId]) return;
    porLead[leadId]={lead:leadId,s:r.s||null,m:r.m||null,d:r.d||null,o:r.o||null};
  });
  FILA.forEach(function(x){ if(x.vend===v.id && x.s) porLead[x.lead]={lead:x.lead,s:x.s||null,m:x.m||null,d:x.d||null,o:x.o||null}; });
  return Object.keys(porLead).map(function(k){ return porLead[k]; });
}
function payloadFila(){
  var v=STATE.vend||{};
  return JSON.stringify({ r:"radar-fila", v:2, vend:v.id||null, nome:v.nome||"", n:FILA.length, itens:itensParaTransferir() });
}
function urlTransferencia(){
  var v=STATE.vend||{}, itens=itensParaTransferir();
  var pacote={ r:"radar-fila", v:2, vend:v.id, nome:v.nome||"", n:itens.length, itens:itens, de:location.hostname, em:new Date().toISOString() };
  return RADAR_IMPORTAR+"#"+b64url(JSON.stringify(pacote));
}
function lerTransferencia(){
  var v=STATE.vend; if(!v) return null;
  try{ return JSON.parse(localStorage.getItem("radar_transf_"+v.id)||"null"); }catch(e){ return null; }
}
function transferirParaRadarNovo(){
  var v=STATE.vend; if(!v) return;
  if(v.gestor){ window.open(RADAR_NOVO,"_blank"); return; }
  var url=urlTransferencia(), n=itensParaTransferir().length;
  STATE.transfAbrindo={n:n,em:Date.now()};
  var w=null;
  try{ w=window.open(url,"_blank"); }catch(e){ w=null; }
  if(!w){ STATE.popupBloqueado=true; STATE.transfAbrindo=null; toast("O navegador bloqueou a nova aba"); render(); return; }
  render();
  /* se a aba nova nao responder (fechada antes da hora, sem opener...), o
     botao volta para o vendedor poder tentar de novo */
  setTimeout(function(){
    if(STATE.transfAbrindo && Date.now()-STATE.transfAbrindo.em>24000){ STATE.transfAbrindo=null; pedirRender(); }
  },25000);
}
/* importar.html responde quando terminou: ai a fila daqui pode ser limpa. */
window.addEventListener("message",function(ev){
  var d=ev.data; if(!d||d.r!=="radar-importado") return;
  if(ev.origin!==RADAR_NOVO_ORIGEM) return;
  var v=STATE.vend; if(!v||v.gestor||d.vend!==v.id) return;
  var leads={}; (d.leads||[]).forEach(function(id){ leads[String(id)]=1; });
  FILA=FILA.filter(function(x){ return !(x.vend===v.id && leads[x.lead]); });
  gravarFila();
  var antes=leadsJaTransferidos(); Object.keys(leads).forEach(function(id){ antes[id]=1; });
  var reg={n:d.n||0,em:new Date().toISOString(),pendente:!!d.pendente,hora:horaAgora(),leads:Object.keys(antes)};
  try{ localStorage.setItem("radar_transf_"+v.id,JSON.stringify(reg)); }catch(e){}
  STATE.transfAbrindo=null; STATE.transfOk=reg;
  toast(d.n? (d.n+" marcacao(oes) salva(s) no sistema") : "Tudo ja estava salvo no sistema");
  pedirRender();
});

/* ---------- aviso ao VENDEDOR: a pagina aberta e de um dia anterior ----------
   Duas coisas fazem isso acontecer: o pin da versao compartilhada nao foi
   movido, ou o navegador serviu o JS do cache. Nos dois casos o vendedor via
   uma lista velha e nao tinha como saber - em 09/09 isso custou uma manha.
   Agora quem esta com a tela errada e avisado na propria tela, com a saida. */
function avisoListaVelha(){
  if(!STATE.vend || STATE.vend.gestor) return null;
  var d = new Date(), dia = d.getDay();      /* 0=domingo, 6=sabado */
  if(dia===0 || dia===6) return null;        /* fim de semana nao tem remessa */
  var ult = ultimaData();
  if(!ult || ult >= dataLocal()) return null;
  return el("div",{class:"alerta"},[
    el("div",{style:"min-width:0"},[
      el("b",{text:"Esta lista e do dia "+ult.split("-").reverse().join("/")+", nao e a de hoje."}),
      el("div",{class:"det",text:"Se a remessa de hoje ja saiu, voce esta com uma versao antiga da pagina. "+
        "Recarregue segurando Ctrl e Shift e apertando R (no celular, feche a aba e abra de novo). "+
        "Se continuar assim depois de recarregar, avise o Danilo: pode ser o pin da versao compartilhada."})
    ])
  ]);
}

function filtrar(arr){
  var f=STATE.filtro,b=STATE.busca.trim().toLowerCase(),hoje=ultimaData();
  return arr.filter(function(l){
    /* o lead aberto continua visivel mesmo depois de classificado,
       para o vendedor ver a confirmacao antes de fechar */
    if(l.id===STATE.aberto) return true;
    var s=statusDe(donoDoLead(l),l.id);
    if(f==="hoje"&&(String(l.loteData||"")!==hoje||s!=="novo")) return false;
    if(f==="novo"&&s!=="novo") return false;
    if(f==="A"&&l.prio!=="A") return false;
    if(f==="andamento"&&ABERTOS.indexOf(s)<0) return false;
    if(f==="reuniao"&&s!=="reuniao"&&s!=="fechado") return false;
    if(b){
      var hay=(l.empresa+" "+(l.nicho||"")+" "+(l.cidade||"")).toLowerCase();
      if(hay.indexOf(b)<0) return false;
    }
    return true;
  });
}
function desenharLista(cont,v){
  cont.innerHTML="";
  var arr=ordenar(filtrar(meusLeads()));
  if(!arr.length){
    var msg="Nenhum lead com esse filtro. Troque o filtro acima.";
    if(STATE.filtro==="hoje") msg="Você já trabalhou toda a remessa de hoje. Vá para Follow-ups, ou mude o filtro para “Não contatados” e pegue leads dos dias anteriores.";
    cont.appendChild(el("div",{class:"empty",text:msg}));
    return;
  }
  arr.slice(0,200).forEach(function(l){cont.appendChild(linha(l,v));});
  if(arr.length>200) cont.appendChild(el("div",{class:"empty",
    text:"Mostrando 200 de "+arr.length+". Use a busca ou os filtros para achar o resto."}));
}

function linha(l,v){
  var dono=donoDoLead(l);
  var st=statusDe(dono,l.id), aberto=STATE.aberto===l.id;

/* ---------- VIEW: ranking ---------- */
function estatVend(p){
  var m=STATE.atividade[p.id]||{}, k, r;
  var s={contatados:0,hoje:0,respostas:0,reunioes:0,fechados:0,abertos:0};
  for(k in m){ r=m[k]; if(!r||!r.s||r.s==="novo") continue;
    s.contatados++;
    if(r.d===HOJE) s.hoje++;
    if(["conversa","reuniao","proposta","fechado"].indexOf(r.s)>=0) s.respostas++;
    if(r.s==="reuniao") s.reunioes++;
    if(r.s==="fechado") s.fechados++;
    if(ABERTOS.indexOf(r.s)>=0) s.abertos++;
  }
  s.taxa=s.contatados?s.respostas/s.contatados:0;
  s.conv=s.contatados?s.fechados/s.contatados:0;
  return s;
}

  ]);
  var maxv=Math.max.apply(null,ORDEM_ST.map(function(s){return agreg[s]}).concat([1]));
  ORDEM_ST.forEach(function(s){

    });
    tb.appendChild(tbd);

  /* ----- Por que os leads nao avancam: o relatorio de objecoes ----- */
  var cont={}, totalClass=0;
  STATE.equipe.forEach(function(p){
    var mm=STATE.atividade[p.id]||{}, k, r;
    for(k in mm){ r=mm[k]; if(r&&r.m){ cont[r.m]=(cont[r.m]||0)+1; totalClass++; } }
  });
  var objs=MOTIVOS.filter(function(m){return m.g==="Objeção"&&cont[m.id];})
                  .sort(function(a,b){return cont[b.id]-cont[a.id];});

/* O Supabase devolve no maximo 1000 linhas por pedido. Sem paginar, a
   partir da milesima marcacao o painel passaria a mostrar menos do que
   existe, sem nenhum aviso. */
function sbTudo(caminho, passo){
  passo = passo || 1000;
  var tudo = [];
  function pagina(ini){
    var fim = ini + passo - 1;
    return sbPedir(caminho, { headers: { "Range-Unit":"items", "Range": ini+"-"+fim } })
      .then(function(r){
        if(r.status === 416) return tudo;
        if(!r.ok) throw new Error(String(r.status));
        return r.json().then(function(linhas){
          linhas = linhas || [];
          tudo = tudo.concat(linhas);
          if(linhas.length < passo) return tudo;
          return pagina(ini + passo);
        });
      });
  }
  return pagina(0);
}

    .then(function(linhas){
      HIST.linhas = linhas || []; HIST.ok = true; HIST.erro = ""; HIST.lidoAs = horaAgora();
      HIST.carregando = false; return true;
    })
    .catch(function(e){
      HIST.carregando = false; HIST.ok = false; HIST.erro = e.message; HIST.lidoAs = horaAgora();
      if(HIST.linhas === null) HIST.linhas = [];
      if(window.console && console.warn) console.warn("[radar] historico: leitura falhou: " + e.message);
      return false;
    });
}

/* Junta os toques registrados com o estado atual da "atividade": marcacao
   sem registro (feita antes da tabela existir, ou vinda do importar.html)
   entra pela data da ultima marcacao. A chave vend|lead|data|status evita
   contar duas vezes. */
function eventosHistorico(){
  var evs = [], chave = {};
  (HIST.linhas||[]).forEach(function(x){
    if(!x || !x.vend || !x.lead || !x.s) return;
    var d = String(x.d||"").slice(0,10) || String(x.ts||"").slice(0,10);
    if(!d) return;
    evs.push({ vend:x.vend, lead:x.lead, s:x.s, m:x.m||null, d:d, ts:x.ts||"", real:true });
    chave[x.vend+"|"+x.lead+"|"+d+"|"+x.s] = 1;
  });
  Object.keys(STATE.atividade||{}).forEach(function(vid){
    var m = STATE.atividade[vid]||{};
    Object.keys(m).forEach(function(leadId){
      var r = m[leadId]; if(!r || !r.s || !r.d) return;
      if(chave[vid+"|"+leadId+"|"+r.d+"|"+r.s]) return;
      evs.push({ vend:vid, lead:leadId, s:r.s, m:r.m||null, d:r.d, ts:"", real:false });
    });
  });
  return evs;
}

/* ---------- periodos ---------- */
var HV = { periodo:"semana", ini:"", fim:"", grupo:"", metrica:"toques" };
function somaDiasLocal(iso, n){ var d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return dataLocal(d); }
function inicioSemana(iso){ var d=new Date(iso+"T12:00:00"); var dia=(d.getDay()+6)%7; d.setDate(d.getDate()-dia); return dataLocal(d); }
function inicioMes(iso){ return iso.slice(0,7)+"-01"; }
function fimMes(iso){ return dataLocal(new Date(+iso.slice(0,4), +iso.slice(5,7), 0, 12)); }
function diasEntre(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000)+1; }
var PERIODOS=[
  ["hoje","Hoje"],["ontem","Ontem"],["semana","Esta semana"],["semana_passada","Semana passada"],
  ["mes","Este mês"],["mes_passado","Mês passado"],["total","Total"],["custom","De / até"]
];
function periodoAtual(evs){
  var p = HV.periodo, ini, fim = HOJE, t;
  if(p==="hoje"){ ini=HOJE; }
  else if(p==="ontem"){ ini=fim=somaDiasLocal(HOJE,-1); }
  else if(p==="semana"){ ini=inicioSemana(HOJE); }
  else if(p==="semana_passada"){ fim=somaDiasLocal(inicioSemana(HOJE),-1); ini=somaDiasLocal(fim,-6); }
  else if(p==="mes"){ ini=inicioMes(HOJE); }
  else if(p==="mes_passado"){ fim=somaDiasLocal(inicioMes(HOJE),-1); ini=inicioMes(fim); }
  else if(p==="total"){ ini=""; evs.forEach(function(e){ if(e.d && (!ini || e.d<ini)) ini=e.d; }); if(!ini) ini=HOJE; }
  else { ini=HV.ini||somaDiasLocal(HOJE,-6); fim=HV.fim||HOJE; if(ini>fim){ t=ini; ini=fim; fim=t; } }
  return { ini:ini, fim:fim };
}
function grupoAuto(ini,fim){
  var n=diasEntre(ini,fim);
  return n<=31?"dia":(n<=140?"semana":"mes");
}
function chaveBucket(d, grupo){
  if(grupo==="mes") return d.slice(0,7);
  if(grupo==="semana") return inicioSemana(d);
  return d;
}
var MESES_CURTO=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var DIAS_CURTO=["dom","seg","ter","qua","qui","sex","sáb"];
function rotuloBucket(k, grupo){
  if(grupo==="mes") return MESES_CURTO[+k.slice(5,7)-1]+"/"+k.slice(2,4);
  if(grupo==="semana") return "sem. "+dataBR(k);
  return DIAS_CURTO[new Date(k+"T12:00:00").getDay()]+" "+dataBR(k);
}
function listaBuckets(ini, fim, grupo){
  var out=[], cur, guard=0;
  if(grupo==="mes"){ cur=inicioMes(ini); while(cur<=fim && guard++<120){ out.push(cur.slice(0,7)); cur=somaDiasLocal(fimMes(cur),1); } }
  else if(grupo==="semana"){ cur=inicioSemana(ini); while(cur<=fim && guard++<400){ out.push(cur); cur=somaDiasLocal(cur,7); } }
  else { cur=ini; while(cur<=fim && guard++<400){ out.push(cur); cur=somaDiasLocal(cur,1); } }
  return out;
}
var RESPOSTA=["conversa","reuniao","proposta","fechado"];
var METRICAS=[
  ["toques","Toques"],["leads","Leads distintos"],["contatos","1º contato"],
  ["respostas","Respostas"],["reunioes","Reuniões"],["fechados","Fechados"]
];
function contadorVazio(){ return {toques:0,contatos:0,followups:0,respostas:0,reunioes:0,fechados:0,perdidos:0,_leads:{},_dias:{}}; }
function somarEvento(c, e){
  c.toques++;
  c._leads[e.lead]=1; c._dias[e.d]=1;
  if(e.s==="contatado" && e.m!=="recepcao") c.contatos++;
  if(e.s==="fup1"||e.s==="fup2") c.followups++;
  if(RESPOSTA.indexOf(e.s)>=0) c.respostas++;
  if(e.s==="reuniao") c.reunioes++;
  if(e.s==="fechado") c.fechados++;
  if(e.s==="perdido"||e.s==="bloqueado") c.perdidos++;
}
function fecharContador(c){
  c.leads=Object.keys(c._leads).length; c.dias=Object.keys(c._dias).length;
  c.mediaDia=c.dias?c.toques/c.dias:0;
  return c;
}

/* ---------- resumo do dia para mandar no grupo ---------- */
function resumoDoDia(){
  var v = STATE.vend; if(!v) return "";
  var m = STATE.atividade[v.id] || {}, k, r;
  var hoje = { enviadas:0, responderam:0, reunioes:0, semInteresse:0, followups:0 };
  var nomes = { reuniao:[], conversa:[] };
  var mapa = {};
  todosLeads().forEach(function(l){ mapa[l.id] = l.empresa; });
  for(k in m){
    r = m[k]; if(!r || r.d !== HOJE) continue;
    hoje.enviadas++;
    if(["conversa","reuniao","proposta","fechado"].indexOf(r.s) >= 0) hoje.responderam++;
    if(r.s === "reuniao"){ hoje.reunioes++; nomes.reuniao.push(mapa[k]||k); }
    if(r.s === "conversa"){ nomes.conversa.push(mapa[k]||k); }
    if(r.s === "perdido" || r.s === "bloqueado") hoje.semInteresse++;
    if(r.s === "fup1" || r.s === "fup2") hoje.followups++;
  }
  var d = HOJE.split("-");
  var t = "*Resumo do dia — " + v.nome + "*\n" + d[2] + "/" + d[1] + "\n\n";
  t += "Mensagens enviadas: " + hoje.enviadas + "\n";
  t += "Responderam: " + hoje.responderam + "\n";
  t += "Follow-ups feitos: " + hoje.followups + "\n";
  t += "*Reuniões marcadas: " + hoje.reunioes + "*\n";
  t += "Sem interesse: " + hoje.semInteresse + "\n";
  if(nomes.reuniao.length) t += "\n*Reuniões:* " + nomes.reuniao.join(", ") + "\n";
  if(nomes.conversa.length) t += "*Em conversa:* " + nomes.conversa.join(", ") + "\n";
  return t;
}
